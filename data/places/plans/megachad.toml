rule = "Place inferred lakeshore fisher-hunter-gatherer camps on land hexes within 10 km of the board's Megachad shoreline of that slice, about one per 75 km of shore. Put two to four extra at each river mouth or delta: the Komadugu-Yobe mouth near the Bama Ridge west end, the Chari-Logone mouth, the Angamma delta, and the Bahr el Ghazal sill. Mark them as inferred. Leave out the Kawar-Agadem stretch, where we already hold dated sites. At -7000 halve the density on the southern and western shores. On the northern shore at -7000 and -6000, prefer the Angamma and Borkou stretch, where our dated sites continue."
confidence = "medium"
reasoning = "Presence (medium): lakeshore and wetland fisher-hunter-gatherers are documented on every well-studied early and mid Holocene Saharan lake. The nearest is Gobero, on a palaeolake only about 3 km across: sedentary hunter-fisher-gatherers 7700-6200 BCE, a hiatus 6200-5200 BCE, then 5200-2500 BCE people living on clams, fish, savanna game and some cattle (Sereno et al. 2008). Megachad was vastly larger and stood at its highstand from 11.5 to 5.0 ka (Armitage et al. 2015). Our own dated sites ring its north-western and northern shores from 9,860 BCE (Angamma) and 8,480 BCE (Agadem). The south-west shore has a dugout canoe of about 6,200 BCE at Dufuna on the Komadugu-Yobe and pottery of about 5,300 BCE on the Bama Ridge beach ridge at Konduga. Bone harpoons and wavy-line pottery are reported from Borkou (Courtin 1965-66; Huard & Massip 1964). Spacing (low): taken from the Kawar-Termit margin, where we hold about eight dated sites over some 400 km of shore, roughly one per 50 km. I thin it to one per 75 km for shores nobody has surveyed. The -7000 thinning follows Gobero's 6200-5200 BCE arid hiatus and the 8.1-6.6 ka lake lowering in Armitage et al. (2015). Inferred camps are a statement about the past, never an input to expected density."
basis = ["analogy", "neighbouring_evidence", "environment", "literature"]

