# Layer registry for the isostyle surfaces. Read by isostyle/layers.py.
#
# Each [[layer]]:
#   id, name      identifier (y_<id> in units.csv.gz) and display name
#   group         one of `groups` below; overlays and the viewer group by it
#   kind          presence_absence  share of units with the trait, absences known
#                 presence_only     no source records absence; shows recording
#                 share             a 0/1 trait among samples (e.g. one haplogroup clade)
#                 continuous        a measured value, kernel mean (e.g. delta15N)
#                 grid              an external gridded field, looked up per cell
#   unit          occupation (dated site episodes), core (off-site pollen cores),
#                 sample (individual human remains) or grid
#   sigma         "cv" (cross-validated where the layer has >= 20 presences and
#                 absences) or the id of a layer whose sigma to borrow
#   site_type     regex on the dated site's type: a match records presence
#   not_before    signed year: site-type and dated-material matches on dates
#                 older than this are ignored (a site's type applies to all its
#                 phases, including those before the structure existed)
#   dated_material regex on a dated sample's material: a match records presence
#   mask          ["acid"] masks cells with topsoil pH below [surface] bone_ph_min
#   levels        isoline levels (default 0.25, 0.5, 0.75; continuous: in units)
#   units_label   for continuous and grid layers, the value's unit
#   vmin, vmax    for continuous and grid layers, the colour scale's range
#   licence, note shown on maps and in the viewer
#   value_field   for a share layer: the column of data/ancestry/ancestry.csv.gz that
#                 gives each sample a fractional value (ancestry weights)
#   fill          false: recorded only; the speculative step never fills its gaps
#   colour        overrides the palette colour (default: by position in the set or group)
#   set           layers sharing a set (haplogroup clades) are picked together
#   evidence_word what a unit is called on maps ("occupations", "cores", "samples")

groups = ["Material culture", "Subsistence", "Environment", "Structures & organics", "People"]

# ------------------------------------------------------------ material culture
[[layer]]
id = "pottery"
name = "Pottery"
group = "Material culture"
kind = "presence_absence"
dated_material = 'pot|sherd|ceram|food ?crust|food res|food rem|carbonised residue|charred crust|charred food|tesson|keramik|^residue'

[[layer]]
id = "flaked_stone"
name = "Flaked stone"
group = "Material culture"
kind = "presence_only"
sigma = "pottery"

[[layer]]
id = "ground_stone"
name = "Ground stone"
group = "Material culture"
kind = "presence_absence"

[[layer]]
id = "bone_antler"
name = "Bone and antler"
group = "Material culture"
kind = "presence_only"
sigma = "pottery"
mask = ["acid"]
dated_material = 'artefact|artifact|tool|point|harpoon|mattock|worked|bevel'

[[layer]]
id = "ornaments"
name = "Ornaments"
group = "Material culture"
kind = "presence_only"
sigma = "pottery"

# ----------------------------------------------------------------- subsistence
# No label rules: these layers rest only on recorded remains, so absences are
# real (a sampled phase without cereals, an identified bone assemblage without
# domestic livestock).
[[layer]]
id = "cereals"
name = "Cereal grain"
group = "Subsistence"
kind = "presence_absence"
evidence_word = "sampled phases"
dated_material = '\bgrains?\b|cereal|triticum|hordeum|wheat|barley|emmer|einkorn|secale'
note = "Charred grain of wheat or barley. In SW Asia before about 8500 BCE this includes cultivated or gathered wild-type cereals. Recovery depends on flotation, which was rare before the 1970s."
licence = "EUROEVOL CC0 (unverified for botany); Arranz-Otaegui & Roe 2023 CC0"

[[layer]]
id = "domestic_livestock"
name = "Domestic livestock"
group = "Subsistence"
kind = "presence_absence"
evidence_word = "faunal assemblages"
note = "Domestic cattle, sheep, goat or pig. Absent means at least 50 identified specimens (or 8 taxa) with no livestock genus of domestic or uncertain status."
licence = "EUROEVOL CC0; ADEMNES via Arranz-Otaegui & Roe (CC0); Open Context CC BY; Phelps et al. CC BY"

# -------------------------------------------------------- structures & organics
# Presence-only: a dated site whose type (XRONOS free text) or dated sample
# shows the structure. A site without one says nothing, so these map where
# structures have been dated, not where they were absent.
[[layer]]
id = "enclosures"
not_before = -6000   # ditched enclosures begin with the LBK and Impressa; the regex also catches later stone enclosures
name = "Enclosures"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = 'enclos|causewayed|rondel|roundel|kreisgraben|henge|ring.?ditch'
note = "Ditched enclosures: causewayed camps, rondels, henges. Rondels are dated as a class to 4850–4500 BCE."
licence = "XRONOS CC BY; rondel dataset CC BY"

[[layer]]
id = "megalithic_tombs"
not_before = -5000   # the earliest megalithic tombs (Brittany) are c. 4800 BCE
name = "Megalithic tombs"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = '^(?!.*non-megalithic).*(dolmen|megalith|passage (grave|tomb)|gallery grave|court tomb|portal tomb|wedge tomb|chambered|long barrow|hällkista|maes howe|boyne)'
note = "Dolmens, passage and gallery graves, court and portal tombs, chambered cairns and long barrows."
licence = "XRONOS CC BY"

[[layer]]
id = "pile_dwellings"
not_before = -6000   # La Marmotta, the earliest lake dwelling, is c. 5700 BCE
name = "Pile dwellings"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = 'palaf|pile|pfahl|lake.?dwell|ufersiedlung|lakeside settlement'
note = "Lake and wetland settlements on piles. Most are dendro-dated, which this layer does not yet use; only radiocarbon-dated ones appear."
licence = "XRONOS CC BY"

[[layer]]
id = "houses"
name = "Houses"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = '^(?!.*dead house).*\b(long ?)?house\b'
note = "Dated sites recorded as houses or longhouses. Most excavated houses are filed as plain settlements, so this undercounts heavily."
licence = "XRONOS CC BY"

[[layer]]
id = "mines"
name = "Flint and stone mines"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = '\b(mine|mines|mining|quarry|flint ?mine)\b'
licence = "XRONOS CC BY"

[[layer]]
id = "metallurgy"
not_before = -6500   # the earliest smelting is in the 6th millennium BCE (Belovode, Anatolia)
name = "Metallurgy"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = 'smelt|slag|furnace|crucible|metallurg|copper ?(mine|work)'
dated_material = '\bslag\b|crucible'
note = "Smelting sites, slag and crucibles. Before 3000 BCE this is mostly the Balkans and Anatolia."
licence = "XRONOS CC BY"

[[layer]]
id = "waterlogged_organics"
name = "Waterlogged organics"
group = "Structures & organics"
kind = "presence_only"
sigma = "pottery"
site_type = 'logboat|dugout|trackway|fish ?weir|\bweir\b|fish ?trap'
dated_material = 'paddle|\bbows?\b|textile|\bnets?\b|cordage|basket|logboat|dugout|fish ?trap|weir|trackway'
note = "Dugouts, paddles, bows, fish weirs and traps, trackways, nets and textiles. They survive only in wet ground, so this maps preservation as much as use."
licence = "XRONOS CC BY"

# ----------------------------------------------------------------- environment
# Off-site pollen cores (Neotoma / European Pollen Database): one unit per
# core and slice with counted levels. Absent means the core was counted in
# that slice and no level had it. Independent of where sites were dug.
[[layer]]
id = "cereal_pollen"
name = "Cereal pollen in cores"
group = "Environment"
kind = "presence_absence"
unit = "core"
levels = [0.1, 0.25, 0.5]
note = "Cerealia-type pollen (Triticum, Hordeum, Avena, Secale types) in lake and bog cores. Pollen travels a few kilometres, not a site. Some wild grasses fall in these types, and SW Asia has wild cereals, so cereal pollen there before farming is natural vegetation, not cultivation. Before farming about 6% of counted levels in Europe already have cereal-type grains, from large wild grasses."
licence = "Neotoma / EPD, CC BY 4.0"

[[layer]]
id = "dung_spores"
name = "Dung-fungus spores in cores"
group = "Environment"
kind = "presence_absence"
unit = "core"
sigma = "cereal_pollen"
note = "Sporormiella, Sordaria, Cercophora and Podospora spores, which grow on herbivore dung. Only cores that count non-pollen palynomorphs; wild herbivores produce them too."
licence = "Neotoma / EPD, CC BY 4.0"

[[layer]]
id = "open_land"
name = "Open land (pollen-based)"
group = "Environment"
kind = "grid"
file = "landclim2_reveals.zip"
column = "OL"
units_label = "% open land"
vmin = 0
vmax = 100
levels = [25, 50, 75]
note = "Share of open land (grassland, heath, crops) in each 1° cell, reconstructed from 1,128 pollen records with the REVEALS model. Natural steppe and alpine land count as open too, so read change through time, not the level. Covers 30–75°N, 25°W–50°E only."
licence = "LandClimII (Fyfe et al. 2021), CC BY 4.0"

# ---------------------------------------------------------------------- people
# Individual ancient genomes (AADR v66.p1, CC0). Each clade layer is the share
# of samples with a call of that kind (Y: males only) that fall in the clade.
# Sampling follows burials and research interest, not population.
[[layer]]
id = "adna_samples"
name = "Ancient genomes"
group = "People"
kind = "presence_only"
unit = "sample"
sigma = "y_i2"
note = "Where dated, quality-passing ancient genomes come from. Read the evidence map: it is the denominator for every haplogroup layer."
licence = "AADR v66.p1, CC0"

[[layer]]
id = "y_i2"
name = "Y: I2"
group = "People"
set = "Y haplogroup"
kind = "share"
unit = "sample"
field = "y"
prefixes = ["I2"]

evidence_word = "male genomes"
note = "Mainly western European hunter-gatherers; persists among early farmers."
licence = "AADR v66.p1, CC0"

[[layer]]
id = "y_g2a"
name = "Y: G2a"
group = "People"
set = "Y haplogroup"
kind = "share"
unit = "sample"
field = "y"
prefixes = ["G2a"]
sigma = "y_i2"
evidence_word = "male genomes"
note = "The commonest Y lineage of the first farmers from Anatolia."
licence = "AADR v66.p1, CC0"

[[layer]]
id = "y_r1b"
name = "Y: R1b"
group = "People"
set = "Y haplogroup"
kind = "share"
unit = "sample"
field = "y"
prefixes = ["R1b"]
sigma = "y_i2"
evidence_word = "male genomes"
note = "Before 3500 BCE rare (some hunter-gatherers); spreads with steppe ancestry after 3000 BCE."
licence = "AADR v66.p1, CC0"

[[layer]]
id = "y_r1a"
name = "Y: R1a"
group = "People"
