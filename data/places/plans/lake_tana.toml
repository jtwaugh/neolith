[meta]
place = "lake_tana"
written = "2026-11-13"
verdict = "research"
confidence = "medium"
really_empty = "Yes in our data, no in the literature. No site in the box or within 100 km in any epoch; the nearest record, 250 km away, is the Lake Ashenge sediment core (39.51, 12.59), which is a palaeolake core, not a settlement. No duplicates or doubtful coordinates nearby. The whole of Ethiopia has 32 XRONOS measurements, all from three lake cores (Ashenge, Hayq, Tilo) and one late Mota Cave bone. The board also has no lake here: all 12 hexes are land in every epoch, though Lake Tana (about 3,000 km2, larger than one hex) existed throughout the period."
why_empty = ["not_in_open_compilations", "research_intensity", "publication_access", "recording_practice"]
summary = """
Lake Tana is the largest lake in Ethiopia and the source of the Blue Nile, on
a basalt plateau at about 1,800 m. In our data the box is empty in every
epoch and nothing lies within 100 km. That says little about the past. No
Holocene archaeological date from anywhere in the Ethiopian highlands
reaches our open compilations: the Ethiopian XRONOS file holds lake cores
and one Mota Cave bone, p3k14c adds nothing. The residuals read the box as
'little dated archaeology nearby' from 5,000 BCE (peak 'missing' 15.4 at
4,000 BCE), which is right.

The literature has two sites at the lake, both from one small research
line. Kurtiye rock shelter, on the shore, was excavated for a Bergen PhD
(Firew 2014). Its abstract reports occupation from the sixth millennium BP,
an assemblage dominated by wild fauna, mainly fish, with abundant lithics
and pottery, no bone harpoons or wavy-line decoration, domestic animals only
very late and no sign of farming until about the end of the first
millennium BC. The radiocarbon dates and the shelter's position are in the
thesis, whose PDF refused me (HTTP 403). Gorgora rock shelter, 1 km from the
north shore, was dug in 1942; Sahle et al. 2024 re-dated its Middle Stone
Age (over 42,000 cal BP) and say plainly that its Later Stone Age and
'ceramic Neolithic' levels are undated, for lack of organic material. Both
papers call the region understudied, and I found no survey gazetteer of the
basin. Dombrowski's 1970s caves in Begemder (Lalibela, Natchabiet) are a
possible third lead, but I could not confirm where they are or what they
date.

What to do: get the Firew thesis and enter Kurtiye with its dates. That is
one dated site and probably a list of undated survey sites around the lake.
Barnett 1999 (The Emergence of Food Production in Ethiopia) is the closest
thing to a highland gazetteer, worth reading for any dated site within
100 km. Beside the record, the place can carry low-density fisher-forager
camps on the shore from the mid-Holocene, on Kurtiye's model. The evidence
layers should be corrected where they contradict the one dated site: they
hold domestic livestock rising to 0.61 by 3,000 BCE, against Kurtiye's very
late domesticates and the gap critic's own Horn rule of zero before
4,500 BCE. Two things need a person. The board needs Lake Tana as water.
The two lake cores in our settlement list (Lake Ashenge, Lake Tilo) are
not settlements.
"""

