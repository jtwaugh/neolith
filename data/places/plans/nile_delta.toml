[meta]
place = "nile_delta"
written = "2026-11-12"
verdict = "research"
confidence = "high"
really_empty = "Not empty, but far emptier than it looks. The 8 records in the box are 4 real sites: Merimde Beni Salama is entered four times (Merimda, Merimde, Merimde Beni Salame, Merimde-Benisalame; the dossier's duplicate table pairs them but they are one site), plus Buto, Sais and Minshat Abu Omar, with 'Undefined site Eastern Delta' 11 km from Minshat Abu Omar probably the same again. Nothing at all before 5,190 BCE. The box edge cuts through the delta apex: Maadi, Wadi Digla, el-Omari and Giza are 3-13 km south of it. The raw downloads have no record under any spelling for Tell el-Farkha, Tell el-Iswid, Tell Ibrahim Awad, Kom el-Khilgan or Tell el-Samara, and XRONOS holds 67 dates for Minshat Abu Omar and 14 for Kom el-Hisn with no coordinates, which are dropped."
why_empty = ["not_in_open_compilations", "recovery_methods", "true_absence", "submerged"]
summary = """
The largest delta on the map. Our data shows four real sites in 82,000 km2
and none before 5,200 BCE, against 53 records within 100 km (the Memphite
cemeteries, Maadi, the Fayum). The residuals call 10 to 16 of its hexes an
'unexplained shortfall' from 5,000 BCE, about 20 sites missing. Three
different things are going on.

From about 4,000 BCE the shortfall is ours, not the archaeology's. The
eastern delta has a string of excavated Predynastic and Early Dynastic
settlements and cemeteries on sand islands (geziras), none of which is in
our data: Tell el-Farkha (c. 3700-2600 BCE, seven phases), Tell el-Samara
(late fifth millennium BCE to the Early Dynastic, the oldest village yet
found in the eastern delta), and from my own knowledge, not checked here,
Tell el-Iswid, Tell Ibrahim Awad, Kom el-Khilgan, Tell el-Murra, Mendes
and Kafr Hassan Dawood. They are missing because the open radiocarbon
compilations do not carry them; Egyptian chronology is mostly built on
pottery, not radiocarbon. The EES Delta Survey lists 783 sites with period
attributes on a public map and is the thing to ingest.

From 5,000 to 4,000 BCE the record really is thin, for a reason the
sources agree on: the Neolithic land surface lies under metres of later
Nile silt and is reached only by coring or where a gezira stands above the
plain (the statement about burial depth is my own knowledge and a search
summary of a Heidelberg chapter I could not open). Merimde, Sais and Buto
are the visible tips. This is 'buried', which the cause list has no word
for; I have put it under recovery_methods.

Before about 5,000 BCE the emptiness may be largely real. Zhao et al.
(2025), from cores at Buto, Sais and Kom el-Khilgan, argue that during the
African Humid Period very high Nile discharge and rapid sea-level rise
kept the delta unstable and hindered settlement; herding appears only
before about 7000 cal BP and sedentary farming about a millennium after
the delta stabilised. The old shore is also drowned (8 hexes at 10,000
BCE). So: ingest for the fourth millennium, speculate modestly for the
sixth and fifth, and leave the early Holocene nearly empty.
"""

[[known_site]]
name = "Tell el-Farkha"
lon = 31.6025
lat = 30.8706
coordinates = "published"
start = -3700
end = -2600
what = "Settlement and cemetery on three mounds, about 45,000 m2, 120 km north-east of Cairo: a Lower Egyptian community from c. 3700 BCE (Naqada IIB-C), then Naqada-culture occupation through Dynasty 0 and the Early Dynastic to c. 2600 BCE, in seven phases with a destruction by fire after phase 3 (c. 3350 BCE). Coordinates and phases as given on the site's Wikipedia page (30 deg 52 min 14 s N, 31 deg 36 min 9 s E); the dates there are archaeological phase dates, not a radiocarbon list. Heath 2023 gives the same start and the site's size."
cite = "Wikipedia, 'Tell el-Farkha' (after Cialowicz, Chlodnicki and Maczynska, the Polish excavation reports); Heath, J. 2023, Tell el-Farkha: an exceptional predynastic site in the Nile Delta, Ancient Egypt 137"
url = "https://en.wikipedia.org/wiki/Tell_el-Farkha"
checked = true

