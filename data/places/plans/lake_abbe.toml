[meta]
place = "lake_abbe"
written = "2026-11-13"
verdict = "research"
confidence = "high"
really_empty = "Yes in our data, no in the literature. No site in the box or within 100 km in any epoch. The nearest record (259 km) is Lake Ashenge on the Ethiopian escarpment, which is a lake-sediment core, not a settlement. No duplicates. One misfiled record: Asa Koma, the best-known site in the box, is in XRONOS (Gif-7404, 3440+/-90 BP, via p3k14c) under Somalia at 44.69 E, 9.72 N, about 300 km east of its real position near As Eyla. It is also after 3,000 BCE, so it would not show anyway. The XRONOS country file for Djibouti is empty. Board: no lake and no river on record here. Palaeolake Abhe (about 6,000 km² in the early Holocene, today about 350 km²) and the lower Awash are both missing, so the box is 17 dry grassland or savannah hexes in every epoch."
why_empty = ["not_in_open_compilations", "research_intensity", "publication_access"]
summary = """
Lake Abbe (Abhe) is the terminal lake of the Awash, on the Ethiopia-Djibouti
border in the central Afar. It sits with lakes Gamarri and Afambo in a
basin that held a palaeolake of about 6,000 km² in the early Holocene,
against about 350 km² today. Our data has nothing in the box or within 100
km in any epoch. The residuals read "little dated archaeology nearby" from
5,000 BCE, with 18-24 missing sites. That reading is right, and the cause is
mostly us. The basin has two long-running French field projects with
radiocarbon chronologies, and none of their dates reached the open
compilations. The one date that did (Asa Koma) is filed in Somaliland.

On the Djibouti side, the Gobaad basin mission has worked since 1984
(Joussaume, then Gutherz, since 2013 Cauliez) and reports over 100 sites
around the lake. Hara Idé 3 has human remains of 16,000-11,500 BCE and a
second phase of 9500-8700 BCE with obsidian, fish and ostrich eggshell.
There are sites of the last hunter-gatherers (Ali Dabba); a collective
burial of the third millennium BCE (Antakari 3); about 30 excavated tombs
from the fourth millennium BCE onward; and the fisher-herder sites Asa Koma
(2500-1800 BCE) and Wakrita (directly dated caprines and cattle,
2013-1778 cal BC). Two-thirds of the Asa Koma fauna is tilapia and catfish.
On the Ethiopian side, Khalidi et al. (2020) dated seven new sites in the
lower Awash and northern Abhe basin with 37 radiocarbon dates. They form
three occupation phases between about 11,000 and 3,300 cal BP, separated by
the dry events at about 8.2 and 4.2 ka. The sequence runs from Later Stone
Age fisher-foragers to the first potter-herders, between 4.8 and 3.3 ka cal
BP. One of the sites is Raso-02, at about 10,000 BP. Khalidi et al. call
this the first Holocene occupation sequence in the Ethiopian Afar, which
measures how little had been done before 2020.

What to do: ingest Khalidi et al. 2020 (37 dates, 7 sites, all in the box)
and the Gobaad dates (the Asa Koma monograph, Gutherz 2017; Wakrita;
Cauliez et al. 2008; the Hara Idé 3 papers), and correct the Asa Koma
position. Speculate lakeshore fisher-forager camps on the palaeolake shore
in the humid phases, which is well founded here. For a person: the board
needs palaeolake Abhe in data/lakes/lakes.toml and the lower Awash in
data/rivers/rivers.toml. Without them, lakeshore sites land on dry
grassland and the lake's 5,000 km² swings, which drive the whole
archaeological sequence, are invisible.
"""

