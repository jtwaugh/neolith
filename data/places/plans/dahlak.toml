reasoning = "Before about 6,000 BCE the Dahlak bank was dry land joined to the mainland (dossier: 10, 7 and 5 hexes drown later at 10,000, 8,000 and 7,000 BCE). The oldest dated middens on the present coast, Gelalo NW and Misse East at about 8000 cal BP, are already there when the sea is still rising. That suggests people were using the shore before it reached its present line, and that their earlier shore sites are under water. Beyin & Bar-Yosef Mayer (2018) argue the same from the coastal-oasis model. No site of this age is known on either shore of the southern Red Sea, so this rests on environment and the timing of the earliest middens; keep it sparse."
basis = ["environment", "neighbouring_evidence", "literature"]

