slices = [-9000, -8000, -7000, -6000, -5000, -4000, -3000]
gap_ids = ["ground_stone-9000-27", "ground_stone-5000-101", "ground_stone-3000-134", "ground_stone-6000-87", "ground_stone-8000-49", "ground_stone-7000-68", "ground_stone-4000-118", "ground_stone-4000-124"]
why_empty = ["research_intensity", "not_in_open_compilations", "low_population"]
why_note = "Early Holocene Saharan foragers and later herders processed wild grasses on grinding stones at almost every site."
expected = 0.9
expected_range = [0.75, 1.0]
confidence = "medium"
basis = ["literature", "other_layer"]
reasoning = "466-1,729 cells; edges 0.91-1.0; pottery and livestock inside where present. In Wadi Howar grinding material is recorded on the excavated sites, abundantly at Abu Tabari 02/1 (c. 4000 BCE); the wadi has no attested occupation before the end of the 6th millennium BCE. Jesse 2010 (early pottery in Northern Africa), cited here before, does not address grinding stones and was removed; the early slices rest on the edge evidence."
literature = [
  { cite = "Jesse 2006, A short history of the Wadi Howar, Sudan, Sudan & Nubia 10", checked = true, url = "https://www.sudarchrs.org.uk/wp-content/uploads/2019/03/SARS_SN10-Jesse_opt.pdf", read = "full text", note = "Supports grinding material on Wadi Howar sites from c. 5200 BCE, large amounts at Abu Tabari 02/1 c. 4000 BC; says nothing of the Sahara as a whole or of the 9th-7th millennia." },
]
would_settle = "Saharan site lists with inventories."
speculative_rule = "0.9 where occupied; mark the north as low occupation after 4,000 BCE."

