# Gap critic: metallurgy layer. Judgements, not data.
# Values: expected share of dated occupations with smelting, slag or crucibles (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "metallurgy"
written = "2026-11-12"
dossier = "build/isostyle/gaps/metallurgy/dossier.json"
summary = "Before 3000 BCE smelting and crucible metallurgy belong to the Balkans (Belovode, Pločnik, c. 5000), eastern Anatolia (Değirmentepe, Norşuntepe), the Iranian plateau (Tal-i Iblis, Arisman), the southern Levant (Ghassulian, Faynan), and later the Caucasus, south-east Iberia (Los Millares, Cabezo Juré) and the Alps. The layer shows only the southern Levant (7-10%) and edge cells in Jordan-facing Arabia and Egypt. The empty Balkans and Anatolia are the largest method artefact: sites there are typed 'tell' or 'settlement', and slag and crucibles are rarely the dated material. Expected values are small shares (0.02-0.12) of occupations, highest in the 4th millennium in Anatolia, Iran and the Caucasus. Absence north of the Alps, in Britain, Scandinavia, the forest zone and Africa is real for this range."

