# ------------------------------------------------- Lake Chad basin
# From data/places/plans/megachad.toml. [[keep]] site: the name exactly as
# filed; lab: the lab number. Admits that one date although its 1-sigma error
# is above [settlements] max_std. A keep that matches no date stops the build.

[[keep]]
site = "Konduga"
lab = "Kn-4300"
source = "https://doi.org/10.1007/BF01956304"
note = "Konduga, a pottery site on the Bama Ridge (the Megachad beach ridge) south-east of Maiduguri: charcoal, 6340 +/- 250 BP, its only date (Breunig, Neumann & Van Neer 1996, African Archaeological Review 13:111-145; also in Open Context, https://opencontext.org/subjects/17fd55b0-7d22-4b3b-afb7-5af9ef11505b). Saharan-tradition decorated pottery, before food production. Wide but not wrong for a 1980s Koeln date; max_std = 200 dropped the site entirely. Not kept, for comparison: Koro Toro Gif-1095, Nedeley Gif-1094/1097, which lie 33-58 m under the board's lake at their own dates and are probably lake-level samples."

# ------------------------------------------------- p3k14c names out of step
# p3k14c's Vermeersch2019 rows often carry an alphabetical neighbour's name,
# and XRONOS filed them under its own site of that name, wherever it is
# (Lake Lacha's GIN-4858 in Italy as 'Peschio Ranaro'). The build drops such
# dates ([settlements] p3k14c_km, settlements.drop_shifted); these entries
# put back the ones the literature places. From data/places/plans/
# upper_volga_lakes.toml and onega.toml.
# [[refile]]  site: the name exactly as filed; lab: the lab number; name, at:
#             the site the date belongs to. Moves that one date. The filed
#             name is not made an alias. A refile that matches no date stops
#             the build.

[[refile]]
site = "Peschio Ranaro"
lab = "GIN-4858"
name = "Peschanitsa"
at = [38.9093, 61.2312]
source = "https://dataverse.harvard.edu/api/access/datafile/13994515"
note = "Bone, 9890 +/- 120 BP: the Peschanitsa cemetery at Lake Lacha (Kargopol district, Arkhangelsk oblast), the earliest Veretye date (onega plan, after Oshibkina). p3k14c files it as 'Peschio Ranaro' (the next name in its alphabetical list) at 32.95, 60.36, Russia; XRONOS put it at the Epigravettian Peschio Ranaro in Lazio (13.32, 41.8). The position is AADR's for Peschanitsa (PES001, Allentoft et al. 2024)."

[[refile]]
site = "Vergara"
lab = "LE-1469"
name = "Veretye 1"
at = [38.9093, 61.2312]
source = "https://journal.fi/fennoscandiaarchaeologica/article/view/126513"
note = "Charcoal, 9600 +/- 80 BP, citing Dolukhanov 2002: the earliest date of (Lower) Veretye 1, Oshibkina's peat-bog site at Lake Lacha (onega plan; Zhilin 2015, Fig. 1, site 9). p3k14c files it as 'Vergara' (the next name after 'Veretye I'); XRONOS put it at Vergara in Spain (-2.02, 41.45). No published coordinates: placed at Peschanitsa on the same lake (AADR), good to about 15 km."

