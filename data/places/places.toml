# Exotic places: straits, river mouths, islands, oases, passes and drowned
# plains where a player looking at the map expects something to be going on.
# `python -m pipeline places` measures how empty each one is in our data
# (build/critic/places/), and the exotic critic
# (.claude/agents/exotic-critic.md) asks why and writes a plan per place in
# data/places/plans/<key>.toml.
#
# box = [lon0, lat0, lon1, lat1], read by eye off the map, generous enough to
# hold a few hexes (a hex is about 0.58 x 0.5 degrees). `why` says why the
# place is worth a look; it is geography, not a claim about what was found
# there. Write-up and references: SOURCES.md.

# ------------------------------------------------------------------ straits
