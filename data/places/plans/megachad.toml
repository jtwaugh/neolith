really_empty = "No, but it is lopsided and thin. Ten dated sites are in the box in the window, all from XRONOS (via EUROEVOL/CalPal and p3k14c), mostly with one or two dates and with no material or site type recorded. Seven sit on the northern and north-western margin: Angamma, Borkou, Largeau and Fayalargeau on the Borkou side, and Dibella, Agadem and Zoo Baba in the Agadem-Kawar lowland. Three are scattered elsewhere: Mandi near Bol, Beurkia in the Bahr el Ghazal corridor, and Blabli in the far south. Within 100 km are Bilma, Kafra, Dogonboulo, Termit ouest, Dogoule and Gara Tchia Bo on the Kawar-Termit side, and Dufuna (the canoe) in the south-west. Four more in-window records are in our raw XRONOS download but are dropped by the build's max_std = 200 cut: Konduga on the Bama Ridge (6340 +/- 250 BP), Nedeley (10,900 +/- 300 and 10,100 +/- 230 BP), an early date at Koro Toro (9470 +/- 220 BP) and a placeholder 'Bassin du Tchad' (4260 +/- 360 BP). The whole southern and eastern shore is blank before 3,000 BCE apart from Blabli: Kanem, the Chari-Logone, Nigerian Borno and the Cameroon plain. The dense Nigerian-Cameroonian record of Gajiganna, Zilum, Daima, Mdaga, Houlouf and Sou all falls after about 2,000 BCE. The coordinate audit flags Mandi and Beurkia as 'offshore'. Neither is plausibly a lat/lon swap: Mandi's coordinates fall by Bol on today's eastern lake shore. Both sit under the board's 320-329 m lake at their dated time, so they are more likely lake-sediment or shell samples than settlements; this is inference, unchecked. No duplicates. Not a board problem: the box is fair and the lake is drawn as the literature describes."
why_empty = ["research_intensity", "not_in_open_compilations", "publication_access", "recording_practice", "submerged"]
summary = """
Lake Megachad was the largest lake in Holocene Africa. On the board it fills
the box from about 9,500 to 3,000 BCE at the 329 m shoreline. The lake
reached its highstand by 11.5 ka and held it to about 5.0 ka, then fell
fast; the Bodélé floor finally dried only about 1 ka (Armitage et al.
2015). The box therefore has two things to show. One is a lakeshore some
thousands of kilometres long, which should carry fisher-hunter-gatherers of
the Kiffian and Ténéréen kind known 300 km west at Gobero (Sereno et al.
2008). The other is the lake floor opening after 3,000 BCE to the herders
and, later, the farmers of the Gajiganna culture. In our data the
shore is lit only on the north-west (Kawar, Agadem, Dibella, Termit) and the
north (Angamma delta, Borkou), by a dozen single- or double-date XRONOS
records with no material or site type. Several of those may be lake
samples, not settlements: Mandi by Bol and Beurkia in the Bahr el Ghazal
both sit under the board's lake at their own dates. The south and east
shores (Borno, Cameroon, Kanem, the Chari) are empty before 3,000 BCE
except Blabli. That matches MacEachern (2012): the southern basin is all
but empty in the terminal Pleistocene and early Holocene. The rich Nigerian
and Cameroonian record (Gajiganna, Zilum, Kursakata, Daima, Mdaga, the Sao
mounds) starts after about 2,000 BCE, when people walked onto the exposed
lake floor. That is the end of this story, not part of it.

Why it is empty: on the Chad side, research stopped. Courtin (Borkou
Neolithic and bone harpoons, 1965-66), Huard and Massip (harpoons and
wavy-line pottery, 1964), Coppens's 1960-66 missions ('several hundred'
archaeological sites in northern Chad, per Universalis), Servant's
lake-sediment dating, and Treinen-Claustre's Iron Age Koro Toro (1982) are
all 1960s-80s French publications, mostly surface collections, rarely
dated, and never entered into an open table except as the Gif, Hv and T
dates we already hold. War closed northern Chad from the late 1970s. The
Franco-Chadian palaeontological mission walks the Djourab every year but
records Miocene and Pliocene fossils. The new ArRéLaT project (Toulouse and
N'Djamena, from 2015) inventoried 66 sites at Ounianga, north of the box,
and worked in the Guéra in 2017 (Abanga 2018). In Nigeria the Frankfurt
SFB 268 surveyed the Bama Ridge beach ridge and the Komadugu-Yobe, but
dated mostly late sites; only Konduga (pottery, about 5300 BCE) and the
Dufuna canoe (7264 BP, about 6200 BCE) fall in our window. Konduga's date
is in our raw download but its error (+/- 250) is over the build's cut.
The lake floor itself (Bodélé, the Chad basin floor) was under water for
most of the window, and the Bodélé is deflating, so the floor's absence is
real and not a gap.

What to do: research first, for the cheap wins: Konduga and Nedeley as
curated entries, then the Chad and Nigeria literature in order of yield.
At the same time, add the speculation the research cannot reach. That is a
marked, inferred lakeshore belt of fisher-hunter-gatherer camps on the
board's shoreline from 9,000 to 4,000 BCE, densest at the river mouths and
deltas: Komadugu-Yobe, Chari-Logone, Angamma, Bahr el Ghazal. Add herder
camps on the northern margin from 5,000 BCE, and a receding-shore herder
belt at 3,000 BCE. Do not infer anything on the deep lake floor or the
Bodélé before 3,000 BCE.
"""

