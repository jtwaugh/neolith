# Gap critic: dung_spores layer. Judgements, not data.
# Values are the expected share of cores that count non-pollen palynomorphs
# (NPPs) and hold dung-fungus spores (Sporormiella, Sordaria, Cercophora,
# Podospora) in a slice, if such cores existed in the gap. Wild herbivores
# count as well as livestock.

[meta]
layer = "dung_spores"
written = "2026-11-12"
dossier = "build/isostyle/gaps/dung_spores/dossier.json"
summary = """This layer is a map of a counting habit. Pollen cores are common across Russia, Scandinavia and Anatolia, but most are 'status unknown' for dung because NPPs were not counted. Routine NPP counting dates from the 2000s and clusters in European landscape-archaeology projects. With 118-277 usable cores per slice, coverage is 0% across Africa, Arabia, SW and Central Asia and the steppe, and 1-4% in northern Russia, Ukraine-Belarus and Iran. \
Wild herbivores make dung spores too. So the expected values follow grazing pressure, not farming: high in steppes and savannas full of saiga, onager, horse, gazelle and aurochs (and then herds), low in closed boreal and temperate forest. \
Method notes: (1) the kernel width is borrowed from cereal pollen, which is far too narrow for so few cores. (2) Edge values are means over 3-15 cells next to one or two NPP-counting cores, so they are anecdotes, not trends. (3) Cores that count NPPs are biased toward sites chosen for archaeology, which probably inflates the evidenced mean in farmed Europe after 5,000 BCE."""

