  # North Africa, Sahara, Sahel (the grid reaches 6°N)
  "MA", "DZ", "TN", "LY", "EG", "EH", "MR", "ML", "NE", "TD", "SD", "SS", "ER",
  "ET", "DJ", "SO", "SN", "GM", "GW", "GN", "SL", "LR", "CI", "BF", "GH", "TG",
  "BJ", "NG", "CM", "CF",
]
# Catches settlement-typed sites filed under a country label not listed above.
site_types = ["settlement"]
# Dates whose normalised site type contains any of these are ignored.
# This drops graves, hoards and non-site samples.
exclude_types = [
  "grave", "burial", "tomb", "tumulus", "barrow", "dolmen", "megalith", "cairn",
  "cist", "funerary", "cemetery", "necropolis", "hypogeum", "hoard", "logboat",
  "trackway", "palaeosol", "environmental", "landscape", "beach", "bone point",
  "pine dates",
]

# Site-type spellings folded together (keys are lower case). An unknown or
# empty type becomes "site".
[settlements.xronos.type_aliases]
"plein air" = "open air"
"open air site" = "open air"
"open-air" = "open air"
"abri/grotte" = "rock shelter"
"abri" = "rock shelter"
"shelter" = "rock shelter"
"rockshelter" = "rock shelter"
"rockshelter/cave" = "cave"
"cave/rockshelter" = "cave"
"house" = "settlement"
"neolithic house" = "settlement"
"early neolithic house" = "settlement"
"palafitte" = "settlement"
"pile dwelling" = "settlement"
"camp site" = "camp"
"miscellaneous" = "site"
"prehistoric" = "site"
"neolithic" = "site"
"mesolithic" = "site"
"mesolithic site" = "site"
"central anatolia" = "site"
"b" = "site"
"b mou" = "site"

# ---------------------------------------------------------------- places
# Exotic places (`python -m pipeline places`, pipeline/places.py) for the
# exotic critic (.claude/agents/exotic-critic.md): straits, river mouths,
# islands, oases, passes and drowned plains, and how empty each is in our
# data. Reads the built map, the sites and the residuals; changes nothing,
# and nothing in the build reads its output.
[places]
catalogue = "data/places/places.toml"
plans = "data/places/plans"
sources = "data/places/SOURCES.md"
out = "build/critic/places"
# Sites within near_km of a place's box count as "within reach". Distance to
# the nearest site is capped at far_km in the emptiness score.
near_km = 100.0
far_km = 300.0
# Margin (degrees) around the box on the sheet of maps, and its epochs.
pad_degrees = 2.0
sheet_years = [-10000, -8000, -6000, -5000, -4000, -3000]

# ---------------------------------------------------------------- critic
# Screens for terrain artefacts (`python -m pipeline suspects`) and region
# sheets (`python -m pipeline look`), in pipeline/look.py, for the terrain
# critic (.claude/agents/terrain-critic.md). They read the built map and
# never change it. A suspect is somewhere to look, not a verdict.
[critic]
out = "build/critic/terrain"
# Bands and edges are screened every years_step years; surges and climate
# every 1000.
years_step = 500
# A straight edge: the same biome over (or beside) the same other biome for
# at least edge_min hexes, within one row (or column).
edge_min = 14
# A thin band: at most stripe_max_thick hexes thick, at least stripe_min long.
stripe_max_thick = 2
stripe_min = 10
# Surge: a biome's share of the land in a tile_degrees tile (with at least
# tile_min_hexes land hexes) moves by `surge` between keyframes 1000 years
# apart; flicker: by `flicker` and straight back.
tile_degrees = 5.0
tile_min_hexes = 20
flicker = 0.25
surge = 0.5
# Smallest patch (hexes) reported by the climate screen; lone hexes per
# 10-degree tile for speckle.
cluster_min = 6
# Margin (degrees) around a suspect in its suggested `look` command.
pad_degrees = 3.0
# Suspects listed per screen.
top = 40

# Köppen classes (prefixes) each biome may sit under without being flagged.
# Deliberately loose: this is a screen for the absurd (Mediterranean scrub in
# a boreal climate, desert on the Arctic coast), not a biome model.
[critic.climate]
"Chaparral" = ["Cs", "Cf", "BS"]
"Savannah" = ["A", "BSh", "Cw", "Cfa"]
"Tropical Forest" = ["A", "Cw", "Cfa"]
"Extreme Desert" = ["BW", "BS"]
"Semi-Desert" = ["B", "Cs"]
"Grassland" = ["B", "C", "D"]
"Steppe-Forest" = ["BS", "C", "D"]
"Woodlands" = ["A", "BS", "C", "D"]
"Temperate Forest" = ["C", "D"]
"Boreal Forest" = ["D", "Cfb", "Cfc", "ET"]
"Tundra" = ["E", "D"]
"Ice" = ["E"]

# ---------------------------------------------------------------- report
# Regions whose Water count the report tracks per year.
[[report.watch]]
name = "Doggerland"
bbox = [0.0, 53.0, 6.0, 56.0]  # lon0, lat0, lon1, lat1

[[report.watch]]
name = "Persian Gulf"
bbox = [48.0, 24.0, 56.5, 30.5]

# Regions whose terrain mix the report lists per 1000 years (the Land gaps).
[[report.regions]]
name = "Arabia"
bbox = [36.0, 13.0, 58.0, 30.0]

[[report.regions]]
name = "Volga-Urals"
bbox = [45.0, 50.0, 62.0, 62.0]

[[report.regions]]
name = "Turan lowland"
bbox = [52.0, 37.0, 66.0, 46.0]

[[report.regions]]
name = "Iranian plateau"
bbox = [46.0, 27.0, 62.0, 37.0]

# ---------------------------------------------------------------- rivers
# Rivers are polylines with a state step function (data/rivers/rivers.toml),
# drawn over the board; hexes only get a derived `river` class.
[rivers]
catalogue = "data/rivers/rivers.toml"
geojson = "build/rivers.geojson"
# Sample spacing (degrees) for hex lookup, and Douglas-Peucker tolerance.
sample = 0.02
simplify = 0.02
# A river counts for a hex only with at least this much length (degrees) in it.
hex_min_length = 0.15
# Warn when a `from` point is further than this (degrees) from its reach.
snap_max = 0.5
# Half size (degrees) of the ETOPO window searched for shelf extensions.
shelf_window = 9.0

[rivers.floodplain]
# Green river bottomland: hexes on a big perennial river (river class 2) in
# dry or open country, not on mountains, plus flat neighbours of the same
# biomes at most max_rise m above them (`spread` rings).
enabled = true
river_class = 2
apply_to = ["Extreme Desert", "Semi-Desert", "Savannah", "Grassland", "Chaparral", "Plains", "Steppe-Forest"]
max_rise = 30.0
spread = 1
# A hex is eligible if it is under an apply_to biome in more than half of the
# keyframes where it is land; it is then Floodplain in every year its big
# river runs, so a biome swap in one keyframe (the drawn -5000 Temperate
# Forest over the Middle Volga) no longer switches it off and on (174 river
# hexes did, map-wide). pipeline/biome_clean.py floodplain_eligibility.
eligibility = "keyframes"
# No ring for hexes whose commonest open biome is one of these: in
# forest-steppe the floodplain is a valley-floor strip, and a hex's median
# elevation can't tell the low Trans-Volga interfluves from alluvium.
no_spread = ["Steppe-Forest"]

# GEOGLOWS v2 stream network (CC BY 4.0), a subset of NGA's TDX-Hydro
# (CC BY-SA 4.0), fetched by `make build/geoglows`; pipeline/geoglows.py.
# Replaced HydroRIVERS v1.0 on 2026-11-13 (its WWF licence can't be passed
# on under CC BY-SA). `min_upland` is km² upstream, as before.
[rivers.geoglows]
table = "build/geoglows/v2-model-table.parquet"
streams = "build/geoglows/global_streams_simplified.gpkg"
cache = "build/geoglows/reaches.pkl"
# A network drains to the sea if its outlet is on or next to today's ocean
# hex; these catalogued lakes (data/lakes/lakes.toml) are marine today and
# count as sea below 0 m, because their straits (Kerch, Danish straits) are
# narrower than a hex. The Caspian, Aral and Dead Sea stay inland.
marine_lakes = ["baltic", "black-sea", "white-sea"]
# Only reaches with at least this upstream area (km²) are kept.
min_upland = 1000.0

# ---------------------------------------------------------------- coasts
# Dated shorelines inland of today's (data/coasts/coasts.toml): where rivers
# have since filled in former sea, which ETOPO1's modern surface can't show.
# Applied right after the sea step.
[coasts]
catalogue = "data/coasts/coasts.toml"
geojson = "build/coasts.geojson"
# A hex becomes Water when at least this share of it is inside the polygon.
hex_fraction = 0.5

# ------------------------------------------------------------- isostasy
# Fennoscandian glacio-isostatic uplift (pipeline/isostasy.py), used by
# lakes with `level = "sea-or-outlet"` (the Baltic). Present uplift rate: an
# elliptical dome centred on the Gulf of Bothnia, long axis to the NE;
# rate grows exponentially into the past with time constant tau (ka).
# scale, tau and the axes are fitted (least squares) to the calibration
# points below; see data/lakes/SOURCES.md (Baltic) and test_isostasy.py.
[isostasy]
centre = [20.0, 63.5]
azimuth = 55.0          # long axis, degrees clockwise from north
axes = [879.6, 585.6]   # semi-axes (km) along and across
peak_rate = 9.5         # mm/yr at the centre today
scale = 0.852
tau = 4.805
# [name, lon, lat, age (ka cal BP), uplift since then (m): shoreline
# elevation today minus the water level then], with the source in SOURCES.md.
calibration = [
  ["Skuleberget highest shoreline", 18.43, 63.08, 10.4, 306.0],
  ["Gästrikland highest shoreline", 17.1, 60.6, 10.7, 247.0],
  ["Tallinn Ancylus shoreline", 24.75, 59.44, 10.3, 55.0],
  ["Saaremaa Ancylus shoreline", 22.5, 58.4, 10.3, 50.0],
  ["Kõpu Ancylus transgression", 22.2, 58.9, 10.3, 67.0],
  ["Tallinn Littorina maximum", 24.75, 59.44, 7.4, 29.0],
  ["Narva-Luga Littorina shoreline", 28.3, 59.7, 7.5, 22.0],
  ["Mecklenburg Bay (no uplift)", 11.5, 54.2, 9.0, 0.0],
  # White Sea, added after the Baltic fit. Chupa isolation basins (Kolka et
  # al. 2015, table 2: threshold elevation and isolation age), minus the
  # [sea] curve then; these check the main dome's reach.
  ["Chupa 8 isolation (81.5 m)", 32.69, 66.28, 11.23, 133.8],
  ["Chupa 6 isolation (61 m)", 33.14, 66.30, 10.22, 103.2],
  ["Chupa 5 isolation (53 m)", 32.78, 66.29, 9.06, 78.9],
  ["Chupa 3-4 isolation (33-40 m)", 32.75, 66.32, 6.36, 39.0],
  # Fitted with the White Sea dome below (main dome gives nothing here).
  ["Onega Peninsula Late Glacial maximum (about 15 m)", 38.5, 64.8, 11.5, 70.0],
  ["Onega Peninsula, fall over the last 4 ka", 38.5, 64.8, 4.0, 7.4],
  ["Southern Onega Bay, above 4-5 m until about 9.8 ka", 38.1, 63.9, 9.8, 41.5],
]
# Largest acceptable misfit (m) at a calibration point (the test checks it).
tolerance = 25.0

# Second dome over Onega Bay and the Onega Peninsula, which the main dome
# doesn't reach. Grid-fitted to the three White Sea points above, with the
# main dome's scale and tau; it adds nothing at Chupa. Low confidence: the
# eastern points come from abstracts, and the Middle Holocene (Tapes)
# transgression there can't be shown by a smooth exponential.
[[isostasy.dome]]
centre = [38.5, 64.5]
azimuth = 0.0
axes = [200.0, 200.0]
peak_rate = 1.75

# ---------------------------------------------------------------- lakes
# Lake levels over time (data/lakes/lakes.toml): extents from ETOPO1, applied
# to terrain as Water after the sea; shorelines drawn over the hexes.
[lakes]
catalogue = "data/lakes/lakes.toml"
geojson = "build/lakes.geojson"
# A hex is lake when at least this share of its cells is under water.
hex_fraction = 0.5
# Drawn Water this far (metres) above the lake's highest level counts as its
# basin, so the lake can expose it in drier years.
basin_margin = 25.0
# A new shoreline shape when the level moves this many metres.
shore_step = 2.0
# Rings around fewer raster cells than this are dropped; simplify tolerance (°).
min_ring_cells = 12
simplify = 0.02
