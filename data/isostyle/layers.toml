# Autosomal ancestry (data/ancestry/ancestry.csv.gz, isostyle/ancestry.py):
# each genome's qpAdm weight for one of six reference groups. All six share
# one kernel width, so a cell's six values sum to 1. Recorded only: `fill =
# false` keeps the speculative step from filling unsampled land. `colour` is
# the game's colour for the component (neolith-rs palette.rs ANCESTRY; checked
# with the dataviz palette validator, all pairs, 2026-11-13).
[[layer]]
id = "anc_whg"
name = "Western hunter-gatherer"
group = "People"
set = "Ancestry"
kind = "share"
unit = "sample"
value_field = "w_whg"
colour = "#2a78d6"
sigma = "anc_ana"
fill = false
evidence_word = "genomes"
note = "Ancestry like the Mesolithic foragers of western Europe (Loschbour, Bichon, Villabruna). Falls as farmers arrive, then partly returns in the Middle Neolithic. A model estimate from six reference groups: shared ancestry, not a people, language or culture."
licence = "AADR v66.p1, CC0; proportions CC BY-SA (data/ancestry/SOURCES.md)"

[[layer]]
id = "anc_ehg"
name = "Eastern hunter-gatherer"
group = "People"
set = "Ancestry"
kind = "share"
unit = "sample"
value_field = "w_ehg"
colour = "#4a3aa7"
sigma = "anc_ana"
fill = false
evidence_word = "genomes"
note = "Ancestry like the Mesolithic foragers of Karelia and the Volga. One of the two halves of the later steppe ancestry. A model estimate from six reference groups: shared ancestry, not a people, language or culture."
licence = "AADR v66.p1, CC0; proportions CC BY-SA (data/ancestry/SOURCES.md)"

[[layer]]
id = "anc_ana"
name = "Anatolian farmer"
group = "People"
set = "Ancestry"
kind = "share"
unit = "sample"
value_field = "w_ana"
colour = "#d95926"
sigma = "cv"
fill = false
evidence_word = "genomes"
note = "Ancestry like the first farmers of north-west Anatolia (Barcın, Menteşe). It moves up the Danube and across the Mediterranean between 7000 and 4000 BCE. A model estimate from six reference groups: shared ancestry, not a people, language or culture."
licence = "AADR v66.p1, CC0; proportions CC BY-SA (data/ancestry/SOURCES.md)"

[[layer]]
id = "anc_irn"
name = "Iranian farmer / Caucasus hunter-gatherer"
group = "People"
set = "Ancestry"
kind = "share"
unit = "sample"
value_field = "w_irn"
colour = "#1baf7a"
sigma = "anc_ana"
fill = false
evidence_word = "genomes"
note = "Ancestry like the first herders of the Zagros (Ganj Dareh) and the foragers of the Caucasus (Kotias, Satsurblia). The other half of the later steppe ancestry. A model estimate from six reference groups: shared ancestry, not a people, language or culture."
licence = "AADR v66.p1, CC0; proportions CC BY-SA (data/ancestry/SOURCES.md)"

[[layer]]
id = "anc_lev"
name = "Levantine forager"
group = "People"
set = "Ancestry"
kind = "share"
unit = "sample"
value_field = "w_lev"
colour = "#eda100"
sigma = "anc_ana"
fill = false
evidence_word = "genomes"
note = "Ancestry like the Natufian foragers of the Levant. A model estimate from six reference groups: shared ancestry, not a people, language or culture."
licence = "AADR v66.p1, CC0; proportions CC BY-SA (data/ancestry/SOURCES.md)"

[[layer]]
