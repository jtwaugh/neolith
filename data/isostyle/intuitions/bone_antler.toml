# Gap critic: bone and antler layer. Judgements, not data.
# Presence-only layer: masked cells mean 'not recorded'. Values are the expected share of occupations
# that would have worked bone or antler if their finds were recorded (0-1); preservation sets it.

[meta]
layer = "bone_antler"
written = "2026-11-12"
dossier = "build/isostyle/gaps/bone_antler/dossier.json"
summary = "Bone and antler is presence-only: no source records its absence, so the atlas shows 1.0 wherever anything is recorded and masked cells mean 'not recorded', never 'absent'. The values below are the share of occupations that would have worked bone or antler if their finds were recorded and reported; this applies to every entry. Unlike flaked stone, that share is set by preservation, not by use: everyone used bone and antler, but it survives in alkaline soils, caves, shell middens, tells and wetlands and is lost in acid sands, podzols and granite uplands and on deflated desert surfaces. So expect 0.8-0.9 in tell and loess regions (SW Asia, the Balkans, the steppe, the Maghreb's escargotières), 0.4-0.6 in the acid north (Scandinavia, the Russian forest, the British Isles) where it depends on bogs and shell middens, and lower on the Saharan and Arabian surface sites. Coverage is an artefact of three sources: BDA (France, Iberia, Maghreb), DEFC (Greece and Anatolia) and 50 directly dated points (Tsirintoulaki et al.), whose bone points are why Denmark, the Baltic and the British Isles show coverage only at 9,000-8,000 BCE. The acid-soil mask uses modern topsoil pH and is too harsh where bogs and lakes preserve bone (Denmark, Latvia's Zvejnieki, Star Carr); a speculative layer should restore those wetland margins."

