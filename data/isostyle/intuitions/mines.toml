# Gap critic: mines layer. Judgements, not data.
# Values: expected share of dated occupations that are mines or quarries (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "mines"
written = "2026-11-12"
dossier = "build/isostyle/gaps/mines/dossier.json"
summary = "Flint and stone mines are point features tied to good flint, stone and ore: Gargano (Defensola, c. 5700), Casa Montero (c. 5350), Arnhofen (LBK), Spiennes, Rijckholt, Jablines, the Sussex mines, Krzemionki and Danish Hov in the 4th millennium, Grimes Graves after 2600, Gavà variscite, the copper mines of Rudna Glava and Ai Bunar (5th millennium), and Faynan/Timna copper in the Levant. Expected shares are therefore small (0.01-0.04) even in mining provinces and zero elsewhere. Method notes: 'quarry' may match the discovery context of a site (a find from a modern gravel quarry), and the site-type rule spreads earlier or later dates at a mine site into other slices; the units at 8,000-6,000 BCE are likely of this kind."

