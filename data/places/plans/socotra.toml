confidence = "low"
reasoning = "Same argument as for livestock: the dossier shows 0 -> 0.057 -> 0.259 judged from the mainland, with no dated occupation on the island in the period (Jansen van Rensburg 2018)."
basis = ["literature", "environment"]
[[speculate.adjust]]
kind = "area"
bbox = [52.0, 11.8, 54.9, 13.0]
value = 0.02

