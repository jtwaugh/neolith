[[speculate]]
target = "settlements"
slices = [-4000, -3000]
rule = "Place inferred Lower Egyptian (Buto-Maadi) and then Naqada-period villages on geziras and levees within 5 km of a Nile branch flowing in that slice, across the central and eastern delta, about one per 20 km of branch, marked as inferred and removed hex by hex as the Delta Survey sites are ingested."
confidence = "medium"
reasoning = "Every excavated delta settlement of this date sits on a gezira and was found because the mound stands above the silt: Buto, Sais, Tell el-Farkha, Tell el-Samara. The dossier's residuals independently report an unexplained shortfall in 16 of 25 land hexes at 4,000 BCE and 13 at 3,000 BCE, about 20 and 13 sites, in the best-surveyed part of Egypt (survey level 1.94 of 2). Villages certainly existed; where they were is the uncertain part, so the rule ties them to channels. This is a stopgap for the research above, not a substitute."
basis = ["literature", "dossier_statistics", "neighbouring_evidence"]

