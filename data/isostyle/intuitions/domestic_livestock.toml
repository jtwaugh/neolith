# Gap critic: domestic_livestock layer (domestic cattle, sheep, goat or pig). Judgements, not data.
# Values are the expected share of identified faunal assemblages with at least one
# livestock species of domestic status, if the gap had evidence.

[meta]
layer = "domestic_livestock"
written = "2026-11-12"
dossier = "build/isostyle/gaps/domestic_livestock/dossier.json"
summary = """With sigma = 200 km the livestock surface covers far more ground than cereals, and after 5,000 BCE most of western and central Europe, the Levant and Anatolia are evidenced; the gaps are the regions with no open faunal table at all (Iran, the Caucasus, Central Asia, the Russian plain, Arabia, West Africa and the Horn: 0% evidenced in every slice) and the forager north. The 45 absences are real and well placed: Natufian and PPNA Levant, Ertebolle Denmark and Schleswig, Oronsay, the Swiss and Swabian Mesolithic, early Holocene Sahara (Amekni, Ti-n-Torha, Gobero) and Khartoum Mesolithic sites. \
One artefact matters a lot. The Open Context Anatolian table's 'Start BCE' and 'End BCE' columns hold cal BP values (Ulucak reads 8990-7650, i.e. c. 7000-5700 BCE; Karain B reads 19800), and the parser negates them as BCE. Every Open Context phase is therefore about 1,950 years too old: Ulucak and Çukuriçi appear at 8,700-8,050 BCE, Barcın at 8,200 BCE, Ilıpınar at 7,850-7,375 BCE, Çatalhöyük at 8,300-7,950 BCE. That is what makes Anatolia 51% evidenced at 8,000 BCE and puts presences on the Aegean coast and in the Balkans gap edge (0.96) at 8,000 BCE, a millennium before any farmer lived there. A smaller one: the two French 'Mesolithic sheep' caves (Gazel, Font-des-Pigeons) are kept as recorded and raise the edge of the 6,000 and 7,000 BCE France gaps; most specialists now read them as intrusive. Also, METHODS.md says livestock cross-validates to 300 km, but the dossier and summary use 200 km. \
The speculative layer should follow the farming frontier: the Fertile Crescent from c. 8500 BCE, Aegean c. 6700, Balkans and south Italy c. 6000, central Europe and Iberia c. 5500, Britain and south Scandinavia c. 4000, the eastern Baltic and Russian forest only with Corded Ware and Fatyanovo after 2800; North African herding spreads west and south from c. 6000 BCE (caprines) and the Sahara is pastoral by 5000, but West Africa and the Horn get livestock only at the end of the period."""

