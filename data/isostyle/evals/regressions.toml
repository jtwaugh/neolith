# Artefacts of the speculative fill that the smooth-critic reported and the numbers
# confirmed (`python -m isostyle evals --check`). `python -m isostyle evals` measures
# each case: the 95th-percentile step inside the box (neighbour steps touching a
# speculative cell; for flicker and period_step, the change to the next slice).
# A case passes when that step is at most `max`: the larger of 0.1 and the
# layer's own 95th percentile when the case was recorded (`was` is the step then).
# Add cases; do not delete one because it fails.

# How many cases may fail before the evals guard trips. Lower it as fixes land.
allowed_failing = 13

