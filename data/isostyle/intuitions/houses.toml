# Gap critic: houses layer. Judgements, not data.
# Values: expected share of dated occupations with a house if all sites' structures were typed (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "houses"
written = "2026-11-12"
dossier = "build/isostyle/gaps/houses/dossier.json"
summary = "Houses existed wherever farmers lived and in many forager settings too, so almost every gap here is recording practice: XRONOS types most excavated houses as 'settlement', and the layer only shows Britain (Mesolithic roundhouses at 6,000 BCE, Neolithic halls at 4,000) plus a few Scandinavian and Central European cells. Expected values are the share of dated occupations that would show a house if every site's structures were typed: c. 0.6-0.75 in village-farming regions (SW Asia from the PPNA, the Balkans, the loess belt, Trypillia), 0.3-0.5 where caves and open camps dominate (Iberia, Italy, Mediterranean France), and 0.1-0.3 among foragers and mobile herders. The whole layer is a method artefact; a speculative layer should follow the farming front, not the evidence. A better proxy would be to read 'settlement' sites with house plans from regional syntheses."

