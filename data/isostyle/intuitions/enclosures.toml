# Gap critic: enclosures layer. Judgements, not data.
# Values: expected share of dated occupations that are ditched enclosures (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "enclosures"
written = "2026-11-12"
dossier = "build/isostyle/gaps/enclosures/dossier.json"
summary = "Ditched enclosures are a regional, mostly late phenomenon: Tavoliere ditched villages (c. 6000-5000 BCE), Balkan tell and settlement ditches, LBK-to-Michelsberg and rondel enclosures in Central Europe (5300-3500), causewayed camps in France, Britain, Ireland and southern Scandinavia (4300-3300), and Iberian ditched 'recintos' (3500-2500). Expected values are the share of dated occupations that would be enclosures if all were typed, so they are small (0.02-0.15) even in the core zones, and about zero outside Europe. Method artefacts: (1) the site-type rule tags every dated occupation at an enclosure site, so Mesolithic and pre-monument dates light up slices before any enclosure existed - the British Isles show 57-60% coverage at 6,000-5,000 BCE and an 8,000 BCE spot (Stonehenge-area Mesolithic posts), and Central Europe 7% at 6,000 BCE; (2) the rondel class date (4850-4500 BCE) puts all rondels in one slice and makes Central Europe 89% at 5,000 vs 52% at 4,000; (3) 'enclos' also matches non-ditched stone enclosures (Gobekli Tepe's circular buildings, Arabian mustatils) if a source typed them so."

