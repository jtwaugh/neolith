# Gap critic: adna_samples (Ancient genomes). Judgements, not data.
# `expected` is the share of land cells in the gap where a quality-passing genome would be
# recoverable IF someone sampled there: it folds bone survival, DNA survival (heat, acidity)
# and burial practice (are there inhumed skeletons at all?) but NOT research effort.
# Each why_note says whether the gap is mainly about SAMPLING (genomes would come out if anyone
# looked), PRESERVATION (bone or DNA does not survive), or BURIAL PRACTICE (few skeletons were
# left: cremation, exposure, no cemeteries).

[meta]
layer = "adna_samples"
written = "2026-11-12"
dossier = "build/isostyle/gaps/adna_samples/dossier.json"
summary = "Almost every ancient-genome gap is a sampling gap, not a preservation one: AADR's quality-passing genomes come from a few national projects (Britain, Iberia, Central Europe, the Baltic, the Balkans, the Pontic steppe), so the coverage table tracks where geneticists have worked. Preservation dominates only in three places: the hot lowlands (Mesopotamian alluvium, Arabia, Egypt, the Sahara-Sahel, Sudan, Baluchistan), where DNA in bone is degraded even when skeletons are abundant (Gobero, Jebel Sahaba, Mehrgarh, Jebel Buhais); acid boreal soils (Finland, Belarusian Polesie, Scotland) where bone itself dissolves; and the drowned shelves. Burial practice dominates in a few slices: the Late Pottery Neolithic Levant (0% at 5,000 BCE), Trypillia (few graves), Mesolithic Ireland (cremation) and the pre-cemetery Early Mesolithic everywhere. Regions with NO prehistoric genome at all before 3,000 BCE, where any haplogroup expectation is pure extrapolation: Arabia, the Sahara-Sahel, West Africa, Nile & Sudan, the Horn (Mota is c. 2500 BCE), Afghanistan, Pakistani Baluchistan, interior Algeria and the drowned shelves; Libya has only Takarkori, Egypt only post-3000 BCE Nuwayrat. Method artefacts: the surface is presence-only with value 1.0 everywhere it is shown, so 'coverage' is just kernel reach (sigma 100 km) around sampled sites; a gap edge of 1.0 says nothing about the gap. Slices of 1,000 years with dates drawn from AADR's mean and SD smear single cemeteries (Zvejnieki, Yuzhny Oleni Ostrov) across two slices and leave others (Levant 5,000 BCE, Anatolia 5,000 BCE) empty by the luck of where the slice edge falls."

