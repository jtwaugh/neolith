# Gap critic: ground stone layer. Judgements, not data.
# Values are the expected share of occupations with ground or polished stone (0-1) if the gap had evidence.

[meta]
layer = "ground_stone"
written = "2026-11-12"
dossier = "build/isostyle/gaps/ground_stone/dossier.json"
summary = "Ground stone (axes, adzes, querns, mortars, grinding slabs) is a presence/absence layer, but 84-99% of its observations come from labels and all 308 absences are label-derived (Late Upper Palaeolithic culture names). Two consequences. First, the edge values around almost every gap are the same within a slice (0.91 at 8,000, 0.94 at 7,000, 0.977 at 6,000, 0.994 at 5,000, 0.998 at 4,000, 1.0 at 3,000 BCE) whatever the region: that is the slice-wide level the 300 km kernel shrinks toward, a method artefact, not local evidence, and it should not be copied into gaps. Second, 'Mesolithic' and 'Epipalaeolithic' labels are left undecided, so forager regions are masked rather than low. The real pattern is not universal presence: grinding equipment is near-universal in the Holocene Sahara, the Nile, SW Asia and Arabia (wild-grass and cereal processing), and polished or pecked axes and adzes are common in the forest Mesolithic of Scandinavia and Russia, but many European Mesolithic camps and steppe graves have no ground stone at all. Before c. 9,500 BCE the share is low outside SW Asia and the Nile. The largest gaps (Russia, Scandinavia's north, the Sahara, Arabia's interior, Central Asia, West Africa) are research and compilation gaps."

