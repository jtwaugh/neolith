# Gap critic: megalithic_tombs layer. Judgements, not data.
# Values: expected share of dated occupations that are megalithic tombs (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "megalithic_tombs"
written = "2026-11-12"
dossier = "build/isostyle/gaps/megalithic_tombs/dossier.json"
summary = "Megalithic tombs belong to the Atlantic facade and the north: Iberia and Brittany from c. 4700-4500 BCE, Britain and Ireland from c. 3800, northern Germany, Poland and southern Scandinavia (TRB dolmens and passage graves) 3600-3200, Mediterranean France, Sardinia and Apulia later, plus separate traditions in the Levant (Golan and Jordan dolmen fields, 4th millennium) and the western Caucasus (from c. 3200). Elsewhere absence is real. Method artefacts: the evidenced cells at 7,000 BCE in Iberia (33%) and France (4%) and at 6,000 BCE in Britain (51%) predate any megalith; they are pre-monument, old-wood or Mesolithic dates at monument sites, many arriving via Paulsson's 2019 set joined by lab number. Late reuse dates do the opposite at the end of the range. The Maghreb edge cells (4,000-3,000 BCE) are probably the Iberian kernel crossing the Strait; North African dolmens are mostly later."

