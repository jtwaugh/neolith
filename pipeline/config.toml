# Hex-map build pipeline config. Paths are relative to the repo root.
# Years are negative integers (BCE), matching combined_map.geojson keys.

[output]
# Intermediate GeoJSON (SPEC §3.2 shape); `make maps` converts it into
# neolith-rs/assets/world.bin for the Rust app.
combined = "build/combined_map.geojson"
build_dir = "build"
# Write a year key only when a hex's value changes (SPEC §3.2 step function).
sparse = true

[time]
start = -10000
end = -3000
step = 100
# How years between/outside keyframes get values. "hold": latest earlier
# keyframe. "fronts": between keyframes, changes spread as fronts from where
# the new value already is; outside the keyframe range, hold.
fill = "fronts"

[grid]
# Canonical hex geometry, ids and bboxes come from this file.
source = "game/static/game/assets/maps/5000_bce.geojson"

# ---------------------------------------------------------------- terrain
[terrain]
# Pixels within this RGB distance of a palette colour count as that class;
# anything further (anti-aliasing, labels) doesn't vote.
tolerance = 30.0

# RGB -> terrain class. Moved from scripts/convert_terrain.py.
palette = [
  [[255, 0, 0], "Chaparral"],
  [[255, 0, 255], "Extreme Desert"],
  [[0, 0, 255], "Semi-Desert"],
  [[0, 255, 255], "Ice"],
  [[0, 255, 0], "Free"],
  [[255, 255, 0], "Savannah"],
  [[127, 0, 0], "Woodlands"],
  [[127, 0, 127], "Mountains"],
  [[0, 0, 127], "Tropical Forest"],
  [[0, 127, 127], "Grassland"],
  [[0, 127, 0], "Temperate Forest"],
  [[130, 127, 0], "Steppe-Forest"],
  [[102, 102, 102], "Boreal Forest"],
  [[178, 178, 178], "Land"],
  [[51, 51, 51], "Water"],
]

# Drawn classes the transcription of the source maps got wrong. The composite
# key frames were copied from Adams & Faure's QEN maps (raw/maps/europe/,
# raw/maps/africa/). QEN's pale-yellow steppe over the Pontic-Caspian region,
# the Caucasus and Anatolia was copied as red Chaparral at -9000 and as
# yellow Savannah from -8000 on, the colours of Mediterranean scrub and
# tropical savanna. Tropical savanna doesn't grow north of 30°N, and pollen
# records there (Shotota, Lake Neor, Nar Gölü) show steppe, meadow and oak
# parkland; the gap filling ([paleobiome.calibrate]) then spread both classes
# over the Anatolian, Zagros and Talesh uplands. Each rule turns `from` into
# `to` on hexes centred in `box` = [lon0, lat0, lon1, lat1] (optionally only
# for `years` = [first, last]).
[[terrain.reinterpret]]
from = "Savannah"
to = "Grassland"
box = [-17.0, 30.0, 66.5, 76.5]
[[terrain.reinterpret]]
from = "Chaparral"
to = "Grassland"
box = [26.0, 39.0, 66.5, 76.5]

# The eastern Sahel and Nubia in the African Humid Period: the drawn maps
# have grassland from 15 to 22°N where pollen at El Atrun (18°N) and Selima
# (21.4°N) shows thorn-tree savanna at -7000 and -6000. Fitted on those (the
# latitude limit is loose: 19.5-24.5°N fit equally; 22°N is just north of
# Selima, the northernmost savanna among them) and checked on held-out Oyo,
# Nabta and Sodmein: 5 -> 7 of 10 slices. Arabia's errors run both ways at
# too few sites for a rule.
[[terrain.reinterpret]]
from = "Grassland"
to = "Savannah"
box = [20.0, 15.0, 38.0, 22.0]
years = [-7000, -6000]

# Drawn Water on hexes whose median elevation is above max_elevation, outside
# every lake box in data/lakes/lakes.toml and the `keep` boxes, is a drawing
# artefact (a coast a hex off, a one-key-frame flicker): it becomes a gap
# ("Land") filled from the climate model. A real palaeolake belongs in
# lakes.toml with a level curve and sources, which also brings it back here.
[terrain.high_water]
enabled = true
max_elevation = 200.0
keep = []

# Georeferenced keyframes: PNG + world file (.pgw).
[[terrain.sources]]
year = -9000
image = "raw/maps/composite/terrain_9000_bce_georeferenced_2.png"
world = "raw/maps/composite/terrain_9000_bce_georeferenced_2.pgw"

[[terrain.sources]]
year = -8000
image = "raw/maps/composite/terrain_8000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_8000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -7000
image = "raw/maps/composite/terrain_7000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_7000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -6000
image = "raw/maps/composite/terrain_6000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_6000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -5000
image = "raw/maps/composite/terrain_5000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_5000_bce_georeferenced.pgw"

# ---------------------------------------------------------------- mountains
# Mountains are a landform, not a biome. The keyframes' hand-drawn Mountains
# are biome gaps, filled like Land ([paleobiome]), and the landform comes from
# the elevation raster ([sea] elevation). A cell is mountain if it passes any band:
# at least `above` metres, and, where given, a slope of `slope` degrees or
# (`rugged`) more than `relief` metres of relief within `relief_radius` metres.
# Bands follow Kapos et al. 2000 (UNEP-WCMC mountain classes).
[mountains]
relief = 300.0
relief_radius = 7000.0
bands = [
  { above = 2500.0 },
  { above = 1500.0, slope = 2.0 },
  { above = 1000.0, slope = 5.0, rugged = true },
  { above = 300.0, rugged = true },
]
# Landform is static and separate from the biome (`landform` property,
# 0 flat, 1 hills, 2 mountains, 3 high mountains). A hex is mountains when at
# least `min_fraction` of its cells are mountain cells. That's below a half so
# that narrow ranges (Apennines, Pyrenees) stay connected. Mountains whose
# median is at or above `high_elevation` m are high mountains. Hills are hexes
# with at least `hills_fraction` mountain cells.
min_fraction = 0.4
hills_fraction = 0.15
high_elevation = 2000.0

# Mountain hexes whose growing season is too cold or short for trees are
# Alpine (above the treeline). After Paulsen & Körner 2014 (Alpine Botany
# 124:1-12): the season is the days with a mean above `season_min` degC, and
# trees need a season mean of `season_mean` degC over `season_days` days.
# Monthly means stand in for days. Model temperatures are moved to each hex's
# own elevation first ([paleobiome.lapse]).
[mountains.treeline]
season_min = 0.9
season_mean = 6.4
season_days = 94

# ---------------------------------------------------------------- sea level
[sea]
# ETOPO1 subset (2 arc-min), fetched by `make build/etopo.asc`.
elevation = "build/etopo.asc"
# Hexes deeper than this always count as open ocean (seeds the flood fill,
# along with below-sea-level hexes on the grid's edge).
seed_depth = -1500.0
# Global mean sea level (metres) by year. APPROXIMATE values read off the
# Lambeck et al. 2014 (PNAS 111:15296) GMSL curve, converted from BP
# (BCE = BP - 1950). Replace with tabulated values before trusting details.
# Ignores isostatic rebound here; the Baltic basin is handled with an
# uplift-corrected surface in the lakes stage ([isostasy]).
curve = [
  [-12050, -70.0],
  [-10050, -60.0],
  [-9050, -50.0],
  [-8050, -40.0],
  [-7050, -25.0],
  [-6050, -13.0],
  [-5050, -4.0],
  [-4050, -1.5],
  [-3050, -0.5],
  [1950, 0.0],
]

# ------------------------------------------------------------ paleobiome
# The drawn keyframes have no biome (grey, "Land") over Arabia, Russia east of
# the Volga, Central Asia and the Iranian/Levantine uplands. Those hexes take
# modelled biomes from Beyer, Krapp & Manica 2020 (Sci. Data 7:236; HadCM3 +
# BIOME4, 0.5 degrees, 1000-year slices; CC BY 4.0). `make build/biome.npz`
# downloads the 1.3 GB NetCDF once and cuts it down with `python -m pipeline biome`.
# Biome cleanup (pipeline/biome_clean.py), applied to each keyframe after the
# model fills its gaps and before the years between are filled.
[biome.edges]
# Model-filled hexes take the biome at a smoothly displaced position, which
# breaks up the BIOME4 grid's straight rows and columns. One fixed field for
# all years, so the edges don't shimmer. apply_to: "model" or "all".
enabled = true
apply_to = "model"
seed = 7
# Displacement (hexes) and the noise wavelength (hexes).
amplitude = 1.2
period = 4.0

[biome.upland]
# The Irano-Anatolian uplands. The drawn maps leave them as Mountains (a gap),
# and the gap filling, never shown woodland in this climate, made them
# Chaparral, Savannah or Grassland. Pollen and charcoal records there (Nar,
# Hazar, Mirabad, Hashilan, Gölhisar, Zeribar, Van, Urmia, Abant, Yeniçağa)
# show steppe and forest-steppe until about -7000, then oak woodland where
# it is wet enough, and steppe where it is dry. A gap-filled hex in `box`
# at or above min_elevation (not Alpine) with a coldest month (BIO6, lapse-
# corrected) at or below max_coldest and annual precipitation (BIO12) of at
# least min_precip becomes Woodlands from woodland_from where precipitation
# reaches woodland_precip, else Steppe-Forest from forest_steppe_precip,
# else Grassland. The mild-winter test leaves the Lebanon and Aegean
# mountains Mediterranean. Thresholds fitted on the anchors that aren't held
# out (52 of 60 upland keyframe slices right); on the held-out ones the map
# went from 15 to 37 of 44.
enabled = true
box = [26.0, 30.0, 62.0, 43.5]
min_elevation = 700.0
max_coldest = -2.0
min_precip = 200.0
woodland_from = -7000
woodland_precip = 350.0
forest_steppe_precip = 225.0

[biome.adjacency]
# Pairs that should never share an edge, and the biome put between them
# (on the model-filled side, else the less established one). Water, Ice and
# Alpine are never changed. Also run on every year between keyframes.
enabled = true
max_passes = 8
forbid = [
  ["Extreme Desert", "Boreal Forest", "Steppe-Forest"],
  ["Extreme Desert", "Temperate Forest", "Grassland"],
  ["Extreme Desert", "Tropical Forest", "Savannah"],
  ["Tropical Forest", "Tundra", "Woodlands"],
  ["Tropical Forest", "Boreal Forest", "Temperate Forest"],
  ["Ice", "Tropical Forest", "Tundra"],
  ["Ice", "Savannah", "Tundra"],
  ["Tundra", "Savannah", "Grassland"],
  ["Savannah", "Boreal Forest", "Steppe-Forest"],
]

[paleobiome]
source = "build/LateQuaternary_Environment.nc"
url = "https://ndownloader.figshare.com/files/22659026"
data = "build/biome.npz"
box = [-17.5, 5.5, 67.0, 76.5]  # lon0, lat0, lon1, lat1
bp_min = 4000
bp_max = 13000
# Extra keyframes outside the drawn range (-9000..-5000): the nearest drawn
# map, with its Land hexes taking that year's modelled biome.
extend_keyframes = [-10000, -4000, -3000]
# Codes that aren't vegetation; hexes fall back to neighbours instead.
ignore_codes = [0]
# Drawn classes that are biome gaps, filled from the model: unlabelled land,
# and the drawn Mountains (a landform: the maps give no biome under them).
gaps = ["Land", "Mountains"]
# Monthly climatologies (t, month, lat, lon) for the Köppen classification.
monthly_vars = ["temperature", "precipitation"]

# The model climate is for each 0.5-degree cell at its mean land elevation;
# a hex's temperatures (BIO1/5/6/8/9/10/11 and monthly means, for the
# calibration and the treeline) are moved to the hex's median elevation at
# `rate` degC per metre (the standard environmental lapse rate). Precipitation
# is left as it is.
[paleobiome.lapse]
enabled = true
rate = 0.0065

# The model is drier than the drawn maps (HadCM3 underplays the Holocene
# monsoon), so its biomes alone leave Arabia desert beside a green Sahara.
# Calibration learns the drawn maps' biome from the model's own climate on the
# hexes both cover (k nearest neighbours in standardised climate space), then
# applies that to the gaps; the model's wet bias cancels because both sides
# use the same model climate. Years with no drawn map use the nearest drawn
# map's relation with their own climate. A gap hex keeps the model's biome
# when its climate is far from every drawn hex: its mean distance to its k
# nearest is over `max_distance_factor` times the `max_distance_quantile`
# of drawn hexes' own. At 2.5 that keeps the model in the cold deserts of
# Turan and the far north-east, which have no counterpart in the hot Sahara,
# and calibrates Arabia, Iran and the Volga, whose climates the drawn maps span.
[paleobiome.calibrate]
enabled = true
k = 15
max_distance_quantile = 0.99
max_distance_factor = 2.5
# Spatial cross-validation tile size for the report's accuracy figure.
block_degrees = 10.0
# Only drawn hexes within max_km vote (0 = off). Tried at 1000-2500 km to
# stop the Zagros and eastern Anatolia (drawn as Mountains, a gap) borrowing
# Chaparral from Iberia and the Maghreb. Off: on the held-out literature
# anchors it made things worse (10 of 31 keyframe slices right -> 7-8), since
# nearby drawn hexes offer Grassland, not the oak woodland the records show,
# and the Egyptian and Yemeni deserts lost good examples.
max_km = 0
# Add the literature anchors (data/terrain/anchors_literature.csv, those not
# held out by [anchors] holdout) to the training, each slice on a keyframe
# year anchor_weight times. It corrects the map at and around those sites
# (27 -> 46 of 57 keyframe slices) but does not carry to other sites (held
# out: 10 of 31 either way), so it is a local correction, and only the held-
# out anchors measure the map.
use_literature = true
anchor_weight = 5
features = [
  ["BIO1", "linear"],   # annual mean temperature
  ["BIO6", "linear"],   # min temperature of coldest month
  ["BIO10", "linear"],  # mean temperature of warmest quarter
  ["BIO12", "log"],     # annual precipitation
  ["BIO18", "log"],     # precipitation of warmest quarter (summer drought)
]

# BIOME4 code -> terrain class.
[paleobiome.classes]
"1" = "Tropical Forest"    # tropical evergreen forest
"2" = "Tropical Forest"    # tropical semi-deciduous forest
"3" = "Woodlands"          # tropical deciduous forest/woodland
"4" = "Temperate Forest"   # temperate deciduous forest
"5" = "Temperate Forest"   # temperate conifer forest
"6" = "Temperate Forest"   # warm mixed forest
"7" = "Temperate Forest"   # cool mixed forest
"8" = "Boreal Forest"      # cool conifer forest
"9" = "Boreal Forest"      # cold mixed forest
"10" = "Boreal Forest"     # evergreen taiga/montane forest
"11" = "Boreal Forest"     # deciduous taiga/montane forest
"12" = "Savannah"          # tropical savanna
"13" = "Semi-Desert"       # tropical xerophytic shrubland
"14" = "Semi-Desert"       # temperate xerophytic shrubland
"15" = "Chaparral"         # temperate sclerophyll woodland
"16" = "Woodlands"         # temperate broadleaved savanna
"17" = "Woodlands"         # open conifer woodland
"18" = "Steppe-Forest"     # boreal parkland
"19" = "Savannah"          # tropical grassland
"20" = "Grassland"         # temperate grassland
"21" = "Extreme Desert"    # desert
"22" = "Tundra"            # steppe tundra
"23" = "Tundra"            # shrub tundra
"24" = "Tundra"            # dwarf shrub tundra
"25" = "Tundra"            # prostrate shrub tundra
"26" = "Tundra"            # cushion forbs, lichen and moss
"27" = "Extreme Desert"    # barren
"28" = "Ice"               # land ice

# ----------------------------------------------------------------- islands
# Islands smaller than a hex or two lose the Water majority vote and vanish
# (pipeline/islands.py). Per frame, a hex's land fraction is the share of its
# ETOPO1 cells above that frame's sea or modelled-lake level (uplift-
# corrected). A landmass of hexes with any land, at most max_hexes big and
# with at least min_area_km2 of land, keeps max(1, round(area / hex area))
# land hexes: its Water hexes with the most land (at least
# min_hex_fraction) become land, best first. Lake levels count only inside
# that year's modelled shoreline.
[islands]
enabled = true
# Drawn Water on a hex at least this much land at the frame's water level,
# outside every lake, is a coast drawn a hex off: it becomes land.
restore_majority_land = 0.5
# 0.1 keeps Bornholm and Menorca apart from Scania and Mallorca.
min_any_fraction = 0.1
min_area_km2 = 150.0
min_hex_fraction = 0.1
max_hexes = 60
# Islands the report tracks (land hexes centred in the box per 1000 years).
watch = [
  ["Gotland", [18.1, 56.9, 19.4, 58.0]],
  ["Bornholm", [14.6, 54.95, 15.2, 55.3]],
  ["Mallorca", [2.3, 39.25, 3.5, 40.0]],
  ["Menorca", [3.8, 39.8, 4.35, 40.1]],
  ["Malta", [14.15, 35.8, 14.6, 36.1]],
  ["Crete", [23.5, 34.9, 26.3, 35.7]],
  ["Cyprus", [32.2, 34.5, 34.6, 35.7]],
  ["Orkney", [-3.5, 58.7, -2.3, 59.4]],
  ["Corsica", [8.5, 41.3, 9.6, 43.1]],
  ["Sardinia", [8.1, 38.8, 9.9, 41.3]],
]

# ------------------------------------------------------------ settled land
# Settlements arrive on land and leave only when the water really reaches
# them. A settlement's hex stays land (its own pre-water biome, else its land
# neighbours') in any frame the map has it Water while the site's ground is
# above the water: the highest ETOPO1 cell within site_radius cells, less
# glacio-isostatic uplift still to come ([isostasy]), against the level of a
# modelled lake whose box holds it, else global sea level ([sea] curve). The
# first frame the ground is below ends the occupation phase (`drowned`).
# Sites starting on Water with no land neighbour are left alone and listed
# in the report. `make maps` converts `out`, not data/settlements.
[settled_land]
enabled = true
min_land_neighbours = 1
site_radius = 1
# Hand corrections to settlement positions, applied first (pipeline/coords.py),
# and the coordinate audit written after the map is final.
corrections = "data/settlements/corrections.toml"
audit = "data/settlements/coordinate_audit.csv"
audit_deep_m = 50.0
audit_far_km = 25.0
# A shore site is within metres of the water, closer than the sea, lake and
# uplift models are good: the depth they give at a phase's start (when the
# site was dry) is their error there. Water must rise this much more than
# that to end the phase.
drown_margin = 3.0
# A site on a hex next to open sea (but not in it) is exposed to the sea
# only if its ground is within this of sea level; deeper, it is a basin
# behind higher ground (the Jordan Valley beside a coastal hex).
coast_cap = 20.0
# A site that starts on a Water hex with no land neighbour but whose own
# ground is above the water is on an islet too small for the grid (Youra,
# Scilly): its hex is kept land like a mis-drawn shore.
islets = true
out = "build/settlements.geojson"

# ----------------------------------------------------------------- anchors
# Natural-history anchor records for checking the biome maps
# (`python -m pipeline anchors`, pipeline/anchors.py). Method and sources in
# data/terrain/SOURCES.md; output in out_dir. Needs `python -m isostyle pollen`
# (the Neotoma level list) and `make maps` (build/combined_map.geojson) first.
[anchors]
cache = "build/anchors"
out_dir = "data/terrain"
neotoma_levels = "build/isostyle/pollen/levels.csv.gz"
# Harrison 2017, BIOME 6000 DB classified plotfile v1 (CC BY 4.0).
biome6000_url = "https://researchdata.reading.ac.uk/99/1/BIOME%206000%20DB%20classified%20plotfile_v1.csv"
# Harrison, Marinova & Cruz-Silva 2021, EMBSeCBIO pollen database (CC BY 4.0).
embsecbio_url = "https://researchdata.reading.ac.uk/309/10/EMBSeCBIO_pollen_DB.zip"
# Cruz-Silva et al. 2022 code and data, pinned to a commit.
cruzsilva_url = "https://raw.githubusercontent.com/esmeraldacs/Intra_biome_variation_method/28949b77fb0e63035d6b80a5eadea1b3e868e30a"
# A record qualifies if its levels span this share of [time] start..end,
# leave no gap longer than max_gap years, and number at least min_levels.
min_coverage = 0.8
max_gap = 1000
min_levels = 15
# Ranking: coverage x min(1, levels / full_levels) x min(1, good_gap / gap)
# x basin weight. Basin size (EMBSeCBIO codes) stands in for pollen-source
# area: big lakes see the region, small bogs their own shore.
full_levels = 30
good_gap = 500
# Two records closer than this (degrees) are the same site or core.
dedupe_degrees = 0.05
# Records within this many km whose names share a word (other than "lake",
# "core"...) are one site: Lake Van's three cores, Lake Urmia's two.
same_site_km = 50.0
# Thinning: keep the best per_cell records in each cell_degrees cell.
cell_degrees = 5.0
per_cell = 2
# A cell with this many land hexes and no anchor is a gap.
min_land_hexes = 20
# Biome labels every slice_step years over [time], from samples within
# slice_half_window years of the slice.
slice_step = 500
slice_half_window = 250
# A BIOME 6000 site this close (degrees) to an anchor gives its 6 ka label.
biome6000_match_degrees = 0.06
# Cruz-Silva et al. 2022's epsilon in the dissimilarity index.
epsilon = 0.5
# Neotoma levels with less of their pollen and spores harmonised to the
# training taxa than this are dropped.
min_mapped = 0.7
# Anchors whose id's crc32 is 0 mod holdout are held out from tuning.
holdout = 3
# Inside the EMBSeCBIO box (the game's core region) keep more per cell.
per_cell_core = 4
# An anchor with no land hex centre within this (degrees) is off the grid.
off_grid_degrees = 0.6
# Biomised labels need modern training samples nearby: the method has no
# biomes for, e.g., tropical Africa. Farther than this, only published
# labels count.
domain_km = 300.0
# Samples mostly made of the core site's own mire say little about the
# region (Hawks Tor: 62% Cyperaceae at -3800): left out of the labels.
local_taxa = ["Cyperaceae"]
max_local_share = 40.0
# Hand-entered anchors from the literature, for the gap cells.
literature = "data/terrain/anchors_literature.csv"
# Known-bad labels: what = "published", "biomised" or "all".
[[anchors.exclude]]
name = "Hawks Tor"
what = "all"
reason = "a small upland mire whose pollen is mostly its own sedges (62% Cyperaceae at -3800); BIOME 6000's 6 ka 'tundra' disagrees with the three other SW England sites (temperate deciduous forest)"
[[anchors.exclude]]
name = "Tigalmamine"
what = "biomised"
reason = "evergreen-oak and grass assemblages (Quercus evergreen 32-42%) are read as xeric shrubland; the published 6 ka label is warm-temperate evergreen forest"

[anchors.basin_weight]
VELG = 1.0
LARG = 1.0
MEDI = 0.8
SMAL = 0.5
VESM = 0.5
NOTA = 0.7
unknown = 0.7

[anchors.classes]
# Cruz-Silva et al. 2022 biome -> compatible game classes, best first.
# Follows [paleobiome.classes] for the nearest BIOME4 biome.
TUND = ["Tundra", "Alpine"]
DESE = ["Semi-Desert", "Extreme Desert"]          # pollen "desert": sparse Amaranthaceae/Artemisia
GRAM = ["Grassland", "Steppe-Forest"]              # graminoids with forbs: steppe
XSHB = ["Semi-Desert", "Grassland"]                # xeric shrubland (BIOME4 14)
ENWD = ["Woodlands", "Steppe-Forest"]              # evergreen needleleaf woodland (BIOME4 17)
WTSFS = ["Chaparral", "Woodlands", "Temperate Forest"]  # Mediterranean evergreen forest (BIOME4 15)
CENF = ["Boreal Forest"]
CMIX = ["Temperate Forest", "Boreal Forest"]       # cool mixed (BIOME4 7)
TEDE = ["Temperate Forest", "Woodlands"]           # temperate deciduous (BIOME4 4)

# ------------------------------------------------------------------ Köppen
# Köppen-Geiger per key frame (Beck et al. 2018 rules) from the monthly
# Beyer et al. 2020 temperature/precipitation in build/biome.npz; "legacy"
# copies the committed epoch files' modern Köppen instead. Water hexes are
# Ocean each year; exposed shelf takes its land neighbours' class.
[koeppen]
source = "beyer2020"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# Terrain classes with a fixed climate.
force = { Ice = "EF" }
# Classify each hex's own mean monthly climate with its temperatures moved
# to the hex's median elevation ([paleobiome.lapse]), instead of taking the
# majority class of the 0.5-degree model cells. The 0 BP validation uses
# the same method.
lapse = true

# Each key frame is the modern (0 BP) climatology plus the model anomaly,
# averaged over `months` (circular, odd) and +-`slices` neighbouring 1 ka
# slices. Unsmoothed, single-month noise in the anomalies (0 mm Julys in
# Karelia) turns ~1,400 boreal cells summer-dry (Ds); smoothed, the classes
# converge steadily on modern. months = 1, slices = 0 uses the raw slice.
[koeppen.smooth]
months = 3
slices = 1

# HadCM3 is too dry over the Holocene Sahara and Arabia (see
# [paleobiome.calibrate]). Hexes whose terrain that year (drawn, or
# calibrated to the drawn maps) is wetter than their modelled climate step
# up BW -> BS -> the classifier's non-arid class: "BS" = at least steppe,
# "humid" = not arid. Never makes a hex drier.
[koeppen.nudge]
enabled = true
[koeppen.nudge.wanted]
"Semi-Desert" = "BS"
"Grassland" = "BS"
"Savannah" = "BS"
"Chaparral" = "BS"
"Steppe-Forest" = "BS"
"Woodlands" = "humid"
"Tropical Forest" = "humid"
"Temperate Forest" = "humid"
"Boreal Forest" = "humid"

# --------------------------------------------------- legacy-only properties
# No rasters for these yet: read them from the committed per-epoch files.
[legacy]
dir = "game/static/game/assets/maps"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]

# ------------------------------------------------------------ productivity
# Net primary productivity per hex per key frame, by the Miami model (Lieth
# 1973) from annual mean temperature and annual precipitation: the lower of
# 3000 / (1 + exp(1.315 - 0.119 T)) and 3000 (1 - exp(-0.000664 P)), in grams
# of dry matter per m² per year. This is the productivity the forager-density
# model was fitted on (Tallavaara et al. 2018; data/population/SOURCES.md),
# so it is what the hexes carry, not the climate model's own `npp`.
# Temperature is moved to the hex's elevation ([paleobiome.lapse]). After
# changing the variables, delete build/biome.npz so it is cut again.
[productivity]
enabled = true
temperature = "BIO1"     # annual mean temperature, degC
precipitation = "BIO12"  # annual precipitation, mm
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# Stored to the nearest `round` g/m²/yr.
round = 10
# Hexes with no model land cell nearby (shelf the lower sea exposed) take
# their neighbours' mean, this many rings out. The rest are open sea: 0.
fill_rings = 3

# ---------------------------------------------------------------- farming
# The year farming reaches each hex (static hex property `farming`): one
# origin, one speed, shortest path over land (pipeline/farming.py). The
# model and its three numbers are Pinhasi, Fort & Ammerman 2005
# (doi:10.1371/journal.pbio.0030410); none is fitted to this project's sites.
# Whether a hex can then be farmed is decided in the app, per year.
[farming]
enabled = true
# Çayönü: their best-correlated origin for shortest-path distances.
origin = [39.73, 38.22]
# Their origin date is 10,000-11,500 cal BP (8050-9550 BCE); the midpoint.
start = -8800
# Their calibrated shortest-path speed is 0.7-1.1 km/yr; the midpoint.
speed_km_per_year = 0.9
# Land hexes this close are linked across whatever lies between, so the
# front crosses straits and reaches near islands (Cyprus, Britain, Sicily).
# They allow "some sea travel" but no long voyages and give no distance;
# 100 km is this project's choice.
sea_reach_km = 100.0

# -------------------------------------------------------------- residuals
# `make residuals`: where the site list falls short of expected population,
# and why (pipeline/residuals.py; data/population/SOURCES.md). Outputs are
# residuals only and never feed expected population.
[residuals]
# Expected population per hex and year, written by `neolith-convert --expected`.
expected = "build/population/expected.csv"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# A site counts for an epoch if it was occupied within this many years of it.
half_window = 500
# Presence near water for foragers: ln factor = a + b ln(km to water + 10),
# flat beyond max_shore_km. These are the forager model's own numbers
# (`shore_factor` in neolith-rs/crates/core/src/forager.rs, fitted to
# ethnographic groups); a test keeps the two copies the same.
shore_factor = [2.1279, -0.4024]
max_shore_km = 2000.0
# Research effort: dated records younger than this many radiocarbon years
# (about 2800 BCE), smoothed over effort_sigma_km. Later than the period, so
# they show where archaeologists work without counting the sites being judged.
background_max_bp = 4200
effort_sigma_km = 100
# "Nothing hiding the sites" puts every hex at least at this quantile of effort.
effort_quantile = 0.9
# A hex that is land at the epoch and Water at this year counts as drowned.
today = -3000
# SoilGrids pH layers (fetched by isostyle); below acid_ph bone does not last.
soil_dir = "build/isostyle/sources"
acid_ph = 5.5
# A hex-epoch is short when at least min_missing sites are missing and the
# known sites are no more than 1/ratio of those expected; the mirror image
# is "more sites than expected".
min_missing = 1.0
ratio = 2.0
map_bins = [0.5, 1, 2, 5, 10]
out = "data/population/residuals.csv.gz"
summary = "data/population/residuals.json"
maps = "data/population/maps"

# Grey level -> people/km². From scripts/convert_population_density.py, with
# 199 and 215 swapped so density rises with grey level (SPEC defect 15).
[legacy.population_lookup]
"0" = 0.0
"23" = 0.0
"31" = 0.0
"39" = 0.0
"63" = 0.0
"127" = 0.1
"151" = 0.3
"175" = 0.5
"183" = 0.8
"199" = 1.0
"215" = 1.5
"231" = 2.0
"247" = 5.0

# ------------------------------------------------------------ settlements
# `make settlements`: dated sites from XRONOS (xronos.ch), calibrated with
# IntCal20. A site needs at least one date inside [time] start..end.
[settlements]
out = "data/settlements/settlements.geojson"
# Hand entries; their properties override the dated site named by `match`,
# else the nearest within merge_km. A null geometry takes that site's.
# Besides name/founding/population they may set `features` (a list of notable
# features, e.g. ["rock art", "megalithic tomb"]) and `wikipedia` (an English
# article title); the app shows both in the settlement popup.
curated = "data/settlements/curated.geojson"
merge_km = 5.0
raw_dir = "build/settlements"
curve_url = "https://intcal.org/curves/intcal20.14c"
# Dates with a larger 1-sigma error (14C years) are ignored.
max_std = 200
min_dates = 1
# founding/abandoned are this quantile (and 1 minus it) of a site's dates, so
# stray dates at well-dated sites are ignored. Below 1/trim dates: min/max.
trim = 0.05
# Years without a date after which a site is assumed abandoned. Dates further
# apart than this also split a site into separate occupation phases (e.g. a
# tell resettled after a hiatus). Each phase runs from its first date to its
# last date + abandon_after. 0 = sites never end.
abandon_after = 1000
# Entries this close whose names differ only by extra words are one site.
same_km = 1.0
# Entries with the same name (ignoring case, accents, punctuation) this close
# are one site filed at differing coordinates.
same_name_km = 10.0

# SOURCES.md lists original references behind at least this many dates.
min_refs_listed = 200

# Piece size for sites without a population figure (settlements.score_sites).
# importance = class of the site type + 1 for a long total occupation and
# + 1 for many dates, each judged against the site's own neighbourhood since
# both grow with research effort. Never from references or sources.
[settlements.importance]
min_span = 1000          # total occupied years must exceed one phase (abandon_after)
persist_top = 0.75       # and beat this share of neighbours
local_km = 150           # neighbourhood for both local tests
local_top = 0.9          # share of neighbours with fewer dates
local_min_dates = 5      # and at least this many dates of its own

# Keywords matched inside the normalised site type; the highest class wins.
[settlements.importance.class]
default = 1
3 = ["tell", "enclosure", "hillfort", "fortified", "entrenched", "pile-dwelling", "pfahlbau", "henge", "crannog"]
2 = ["settlement", "habitation", "house", "hut", "structure", "village", "roundhouse", "dwelling"]
1 = ["site", "open air", "camp", "cave", "rock shelter", "shell midden", "midden", "abri", "terrace"]
0 = ["pit", "hearth", "kiln", "well", "ditch", "find spot", "boat", "togher", "post-hole", "stake-hole",
     "burnt mound", "burnt spread", "spread", "oven", "mine", "quarry", "gully", "yoke", "plough", "wood",
     "lake core", "peat", "sediment", "alluvium", "bog", "inhumation", "cremation", "pyre"]

# Research effort per hex (settlements.survey_intensity): every dated record
# of any period and site type, smoothed. A detection model only; never an
# input to expected population density. Levels: below `thin` records per
# 10,000 km² = 0 (absence uninformative), below `well` = 1, else 2.
[settlements.survey]
out = "data/settlements/survey.csv.gz"
sigma_km = 100
thin = 5
well = 25

# Extra date tables, read in this order after XRONOS. A date whose lab number
# is already in hand is skipped, so these only add what XRONOS lacks.
# `columns` maps our fields to the table's headers; `refs` columns are kept
# as each date's references.
[[settlements.tables]]
name = "p3k14c"
url = "https://raw.githubusercontent.com/people3k/p3k14c/refs/tags/2025.07/inst/p3k14c_scrubbed_fuzzed.csv"
file = "p3k14c_2025.07.csv"
columns = { labnr = "LabID", bp = "Age", std = "Error", lon = "Long", lat = "Lat", site = "SiteName", period = "Period", refs = ["Source", "Reference"] }

[[settlements.tables]]
name = "neonet"
url = "https://digitallib.unipi.it/fedora/objects/mag:2814/datastreams/MMb714bbfacf4af2ce1fd7025e3789a99b/content"
file = "neonet_med_v2.tsv"
delimiter = "\t"
columns = { labnr = "LabCode", bp = "C14Age", std = "C14SD", lon = "Longitude", lat = "Latitude", site = "SiteName", period = "Period", refs = ["bib", "bib_url"] }

[[settlements.tables]]
name = "neonetatl"
url = "https://digitallib.unipi.it/fedora/objects/mag:2627/datastreams/MM54ff3698c0ea78b77469ce6462c2ca36/content"
file = "neonet_atl_v1.tsv"
delimiter = "\t"
columns = { labnr = "LabCode", bp = "C14Age", std = "C14SD", lon = "Longitude", lat = "Latitude", site = "SiteName", period = "Period", refs = ["bib", "bib_url"] }

# Names, Wikipedia links and cultures for sites that Wikidata classes as an
# archaeological site and that have an English Wikipedia article. Items with
# an inception date in [time] start..end that match no dated site are added.
#
# Off until `contact` is set: the query service answered this client with
# 429 and a 1000 s Retry-After (2026-11-11). Wikimedia's User-Agent policy
# asks automated clients to give contact details; put a URL or email in
# `contact` (it is sent in the User-Agent header) and set enabled = true.
[settlements.wikidata]
enabled = true
contact = ""
url = "https://query.wikidata.org/sparql"
tile_degrees = 10.0
match_km = 5.0

# What SOURCES.md says about each dataset. Keys are the names used in each
# site's `sources` property.
[settlements.citations.xronos]
title = "XRONOS"
citation = "Roe, J., Schmid, C., Ebrahimiabareghi, S., Heitz, C. & Hinz, M., 2025. XRONOS: An Open Data Infrastructure for Archaeological Chronology. Journal of Computer Applications in Archaeology 8(1): 242–263. https://doi.org/10.5334/jcaa.191"
licence = "CC BY 4.0"
url = "https://xronos.ch"
note = "XRONOS compiles dates from other databases and publications and asks that those are cited too; see the last section."

[settlements.citations.p3k14c]
title = "p3k14c, release 2025.07"
citation = "Bird, D., Miranda, L., Vander Linden, M. et al., 2022. p3k14c, a synthetic global database of archaeological radiocarbon dates. Scientific Data 9, 27. https://doi.org/10.1038/s41597-022-01118-7"
licence = "The article is CC BY 4.0. The repository states CC BY 4.0 for text and figures and MIT for code, and gives no separate licence for the data file."
url = "https://github.com/people3k/p3k14c"
note = "Only dates whose lab number XRONOS does not have. The file is the \"scrubbed and fuzzed\" one."

[settlements.citations.neonet]
title = "NeoNet (Mediterranean), version 2"
citation = "Mazzucco et al. 2021, NeoNet radiocarbon database version 1, Pisa: MOD. https://doi.org/10.13131/archelogicadata-yb11-yb66. Data paper: Huet, T., Cubas, M., Gibaja, J.F., Oms, F.X. & Mazzucco, N., 2022. NeoNet Dataset. Radiocarbon Dates for the Late Mesolithic/Early Neolithic Transition in the North Central-Western Mediterranean Basin. Journal of Open Archaeology Data 10: 3. https://doi.org/10.5334/joad.87"
licence = "CC BY-SA according to the Pisa repository; CC BY 4.0 according to the data paper."
url = "https://github.com/zoometh/neonet"
note = "Only dates whose lab number is not already in hand. The file is the version c14bazAAR points to (2023-12-08)."

[settlements.citations.neonetatl]
title = "NeoNet Atlantic, version 1"
citation = "Huet, T., Basílio, A.C., Carvalho, A.F., Cubas, M., Gibaja, J.F., López-Romero, E., Oms, F.X. & Mazzucco, N., 2023. NeoNetAtl radiocarbon database, Pisa: MOD. https://doi.org/10.13131/unipi/z332-ye56"
licence = "CC BY-SA according to the Pisa repository."
url = "https://github.com/zoometh/neonet"
note = "Only dates whose lab number is not already in hand. The author list is as given by c14bazAAR."

[settlements.citations.wikidata]
title = "Wikidata"
citation = "Wikidata contributors. Wikidata. https://www.wikidata.org. Each site gives its item id in the `wikidata` property."
licence = "CC0 1.0"
url = "https://query.wikidata.org"
note = "Supplies `wikidata`, `wikipedia` and `culture`, and the whole record for sites whose only source is `wikidata`."

[settlements.citations.curated]
title = "Hand entries"
citation = "`data/settlements/curated.geojson` in this repository, carried over from the 2023 `settlements.geojson`."
licence = "Project's own."
note = "Names, founding years and populations entered by hand without recorded sources. The populations are placeholders."

[settlements.citations.intcal20]
title = "IntCal20 calibration curve"
citation = "Reimer, P.J., Austin, W.E.N., Bard, E. et al., 2020. The IntCal20 Northern Hemisphere radiocarbon age calibration curve (0–55 cal kBP). Radiocarbon 62. https://doi.org/10.1017/RDC.2020.41"
licence = "Not stated in the file."
url = "https://intcal.org/curves/intcal20.14c"
note = "Used to calibrate every radiocarbon date."

# Cultures and stages from the period labels on each site's dates; see
# data/cultures/cultures.toml. Labels nothing matched go to unmapped_labels.tsv.
[settlements.cultures]
table = "data/cultures/cultures.toml"
out_dir = "data/cultures"
wikipedia_cache = "build/cultures/wikipedia"
unmapped = "build/cultures/unmapped_labels.tsv"
# Years a date may fall outside a culture's cited range and still count
# (calibrated medians scatter by a century or two).
range_margin = 200

# Guess a culture (stage) for dates whose own labels give none, from labelled
# sites nearby. Written as culture_inferred / stage_inferred, never mixed
# with the labelled timelines. The holdout rates go to data/cultures/SOURCES.md.
[settlements.cultures.infer]
radius_km = 50
window_years = 250
min_sites = 2
min_share = 0.67

[settlements.xronos]
url = "https://xronos.ch/api/v1/data"
# One download per entry, cached; a date returned by several is used once.
# Countries are XRONOS's own labels: mostly ISO codes, plus a few oddities.
countries = [
  # Europe
  "IS", "IE", "GB", "England/Wales", "Scotland", "FR", "ES", "España", "PT", "AD",
  "BE", "NL", "LU", "DE", "CH", "AT", "IT", "MT", "DK", "NO", "SE", "FI", "EE",
  "LV", "LT", "PL", "CZ", "SK", "HU", "SI", "HR", "BA", "RS", "ME", "MK", "AL",
  "XK", "Kosovo", "GR", "Crete", "BG", "RO", "MD", "Moldavia", "UA", "BY", "RU",
  # Near East, Caucasus, Central Asia
  "TR", "CY", "SY", "LB", "IL", "PS", "Israel/West Bank/Gaza Strip",
  "Israel, Palestine", "JO", "IQ", "IR", "SA", "YE", "OM", "AE", "QA", "BH", "KW",
  "GE", "AM", "AZ", "KZ", "UZ", "TM", "AF",
  # North Africa, Sahara, Sahel (the grid reaches 6°N)
  "MA", "DZ", "TN", "LY", "EG", "EH", "MR", "ML", "NE", "TD", "SD", "SS", "ER",
  "ET", "DJ", "SO", "SN", "GM", "GW", "GN", "SL", "LR", "CI", "BF", "GH", "TG",
  "BJ", "NG", "CM", "CF",
]
# Catches settlement-typed sites filed under a country label not listed above.
site_types = ["settlement"]
# Dates whose normalised site type contains any of these are ignored.
# This drops graves, hoards and non-site samples.
exclude_types = [
  "grave", "burial", "tomb", "tumulus", "barrow", "dolmen", "megalith", "cairn",
  "cist", "funerary", "cemetery", "necropolis", "hypogeum", "hoard", "logboat",
  "trackway", "palaeosol", "environmental", "landscape", "beach", "bone point",
  "pine dates",
]

# Site-type spellings folded together (keys are lower case). An unknown or
# empty type becomes "site".
[settlements.xronos.type_aliases]
"plein air" = "open air"
"open air site" = "open air"
"open-air" = "open air"
"abri/grotte" = "rock shelter"
"abri" = "rock shelter"
"shelter" = "rock shelter"
"rockshelter" = "rock shelter"
"rockshelter/cave" = "cave"
"cave/rockshelter" = "cave"
"house" = "settlement"
"neolithic house" = "settlement"
"early neolithic house" = "settlement"
"palafitte" = "settlement"
"pile dwelling" = "settlement"
"camp site" = "camp"
"miscellaneous" = "site"
"prehistoric" = "site"
"neolithic" = "site"
"mesolithic" = "site"
"mesolithic site" = "site"
"central anatolia" = "site"
"b" = "site"
"b mou" = "site"

# ---------------------------------------------------------------- report
# Regions whose Water count the report tracks per year.
[[report.watch]]
name = "Doggerland"
bbox = [0.0, 53.0, 6.0, 56.0]  # lon0, lat0, lon1, lat1

[[report.watch]]
name = "Persian Gulf"
bbox = [48.0, 24.0, 56.5, 30.5]

# Regions whose terrain mix the report lists per 1000 years (the Land gaps).
[[report.regions]]
name = "Arabia"
bbox = [36.0, 13.0, 58.0, 30.0]

[[report.regions]]
name = "Volga-Urals"
bbox = [45.0, 50.0, 62.0, 62.0]

[[report.regions]]
name = "Turan lowland"
bbox = [52.0, 37.0, 66.0, 46.0]

[[report.regions]]
name = "Iranian plateau"
bbox = [46.0, 27.0, 62.0, 37.0]

# ---------------------------------------------------------------- rivers
# Rivers are polylines with a state step function (data/rivers/rivers.toml),
# drawn over the board; hexes only get a derived `river` class.
[rivers]
catalogue = "data/rivers/rivers.toml"
geojson = "build/rivers.geojson"
# Sample spacing (degrees) for hex lookup, and Douglas-Peucker tolerance.
sample = 0.02
simplify = 0.02
# A river counts for a hex only with at least this much length (degrees) in it.
hex_min_length = 0.15
# Warn when a `from` point is further than this (degrees) from its reach.
snap_max = 0.5
# Half size (degrees) of the ETOPO window searched for shelf extensions.
shelf_window = 9.0

[rivers.floodplain]
# Green river bottomland: hexes on a big perennial river (river class 2) in
# dry or open country, not on mountains, plus flat neighbours of the same
# biomes at most max_rise m above them (`spread` rings).
enabled = true
river_class = 2
apply_to = ["Extreme Desert", "Semi-Desert", "Savannah", "Grassland", "Chaparral", "Plains", "Steppe-Forest"]
max_rise = 30.0
spread = 1

# HydroRIVERS v1.0 (Lehner & Grill 2013), fetched by `make build/hydrorivers`.
[rivers.hydrorivers]
shapefiles = [
  "build/hydrorivers/HydroRIVERS_v10_af_shp/HydroRIVERS_v10_af.shp",
  "build/hydrorivers/HydroRIVERS_v10_eu_shp/HydroRIVERS_v10_eu.shp",
  "build/hydrorivers/HydroRIVERS_v10_as_shp/HydroRIVERS_v10_as.shp",
]
cache = "build/hydrorivers/reaches.pkl"
# Only reaches with at least this upstream area (km²) are kept.
min_upland = 1000.0

# ---------------------------------------------------------------- coasts
# Dated shorelines inland of today's (data/coasts/coasts.toml): where rivers
# have since filled in former sea, which ETOPO1's modern surface can't show.
# Applied right after the sea step.
[coasts]
catalogue = "data/coasts/coasts.toml"
geojson = "build/coasts.geojson"
# A hex becomes Water when at least this share of it is inside the polygon.
hex_fraction = 0.5

# ------------------------------------------------------------- isostasy
# Fennoscandian glacio-isostatic uplift (pipeline/isostasy.py), used by
# lakes with `level = "sea-or-outlet"` (the Baltic). Present uplift rate: an
# elliptical dome centred on the Gulf of Bothnia, long axis to the NE;
# rate grows exponentially into the past with time constant tau (ka).
# scale, tau and the axes are fitted (least squares) to the calibration
# points below; see data/lakes/SOURCES.md (Baltic) and test_isostasy.py.
[isostasy]
centre = [20.0, 63.5]
azimuth = 55.0          # long axis, degrees clockwise from north
axes = [879.6, 585.6]   # semi-axes (km) along and across
peak_rate = 9.5         # mm/yr at the centre today
scale = 0.852
tau = 4.805
# [name, lon, lat, age (ka cal BP), uplift since then (m): shoreline
# elevation today minus the water level then], with the source in SOURCES.md.
calibration = [
  ["Skuleberget highest shoreline", 18.43, 63.08, 10.4, 306.0],
  ["Gästrikland highest shoreline", 17.1, 60.6, 10.7, 247.0],
  ["Tallinn Ancylus shoreline", 24.75, 59.44, 10.3, 55.0],
  ["Saaremaa Ancylus shoreline", 22.5, 58.4, 10.3, 50.0],
  ["Kõpu Ancylus transgression", 22.2, 58.9, 10.3, 67.0],
  ["Tallinn Littorina maximum", 24.75, 59.44, 7.4, 29.0],
  ["Narva-Luga Littorina shoreline", 28.3, 59.7, 7.5, 22.0],
  ["Mecklenburg Bay (no uplift)", 11.5, 54.2, 9.0, 0.0],
]
# Largest acceptable misfit (m) at a calibration point (the test checks it).
tolerance = 25.0

# ---------------------------------------------------------------- lakes
# Lake levels over time (data/lakes/lakes.toml): extents from ETOPO1, applied
# to terrain as Water after the sea; shorelines drawn over the hexes.
[lakes]
catalogue = "data/lakes/lakes.toml"
geojson = "build/lakes.geojson"
# A hex is lake when at least this share of its cells is under water.
hex_fraction = 0.5
# Drawn Water this far (metres) above the lake's highest level counts as its
# basin, so the lake can expose it in drier years.
basin_margin = 25.0
# A new shoreline shape when the level moves this many metres.
shore_step = 2.0
# Rings around fewer raster cells than this are dropped; simplify tolerance (°).
min_ring_cells = 12
simplify = 0.02
