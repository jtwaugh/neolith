# Gap critic: cereal_pollen layer. Judgements, not data.
# Values are the expected share of pollen cores (core-slices with counted levels)
# that hold at least one Cerealia-type grain, if cores existed in the gap.
# In SW Asia, Central Asia and the steppe this share measures wild large grasses
# (wild wheat, barley, rye, Aegilops, Elymus/Leymus) as much as farming.

[meta]
layer = "cereal_pollen"
written = "2026-11-12"
dossier = "build/isostyle/gaps/cereal_pollen/dossier.json"
summary = """The cereal-pollen gaps follow where lake and bog cores were taken and put into Neotoma/EPD, not where people farmed: coverage is near-total in Europe and 0-13% across Africa, Arabia, Central Asia, Iran and Mesopotamia. Read outside Europe, the layer is mostly a wild-grass signal. Cores in the Zagros, Levant, Anatolia and Central Asia show Cerealia-type grains in 60-100% of core-slices at 10,000 BCE, long before farming. Cores in northern Russia and Finland show it in only 0-5%. African cores show it in none, because the African Pollen Database does not split Cerealia-type from other Poaceae. \
Two features are method artefacts. (1) Most edge values in Africa and the Horn (0.05-0.15) come from shrinkage, not data. A cell just above the mask threshold with only absent cores gets f = f0/(E+1), about 0.45 times the slice mean. These edges therefore rise from 0.058 to 0.145 between 9,000 and 3,000 BCE only because European farming lifts the global f0. They should not be read as an African trend. (2) The high edge values around Arabia, Libya-Egypt and the central Iranian plateau (0.5-0.75) leak in from Levantine, Nile Delta and Zagros cores, where they reflect wild cereals and steppe grasses. They should not be stretched across deserts that have no lakes."""

