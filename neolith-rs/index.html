<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1b1b" />
    <title>Neolith</title>
    <!-- Size-tuned build: see [profile.web] in Cargo.toml. -->
    <link data-trunk rel="rust" href="crates/app/Cargo.toml" data-bin="neolith" data-cargo-profile="web" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="assets/world.bin" />
    <!-- Start fetching the world alongside the wasm, not after it starts.
         crossorigin matches the fetch() credentials mode, so the app reuses
         this response instead of downloading the file again. -->
    <link rel="preload" href="world.bin" as="fetch" type="application/octet-stream" crossorigin="anonymous" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
      /* Phones: the dynamic viewport excludes the browser's own bars, and
         the board takes every touch (no page scroll, zoom, text selection
         or long-press callout). */
      body { height: 100dvh; overscroll-behavior: none; }
      canvas {
        display: block; width: 100%; height: 100%; outline: none;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #b9ad94; font: italic 20px/1.4 Georgia, "Times New Roman", serif; letter-spacing: 0.08em;
        pointer-events: none;
      }
      #loading.error { color: #e0a090; font-style: normal; font-size: 15px; padding: 0 16px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="neolith_canvas"></canvas>
    <!-- Removed by the app once it is running (main.rs). -->
    <div id="loading">Loading Neolith…</div>
    <script>
      // iOS Safari ignores user-scalable=no: stop its page pinch-zoom so the
      // pinch reaches the board instead.
      for (const ev of ["gesturestart", "gesturechange", "gestureend"])
        document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
      // WebGPU fallback (web_gpu.rs): if the wasm traps while a WebGPU start
      // is still unproven, reload once; the app then starts with WebGL.
      // The flag is cleared on a WebGL start, so this cannot loop.
      function webgpuCrashed() {
        try {
          if (sessionStorage.getItem("neolith.webgpu-pending") !== "1") return;
          sessionStorage.setItem("neolith.webgpu-pending", "crashed");
        } catch (_) { return; }
        const el = document.getElementById("loading");
        if (el) { el.className = ""; el.textContent = "Switching to WebGL…"; }
        setTimeout(() => location.reload(), 300);
      }
      window.addEventListener("error", (e) => {
        if (e.error instanceof WebAssembly.RuntimeError) webgpuCrashed();
      });
      window.addEventListener("unhandledrejection", (e) => {
        if (e.reason instanceof WebAssembly.RuntimeError) webgpuCrashed();
      });
    </script>
  </body>
</html>
