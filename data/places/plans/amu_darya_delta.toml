what = "Type site of the Kel'teminar culture in the Akchadarya delta: a single very large post-built communal dwelling with hearths, pottery, microlithic flint and fish and wild-animal bone, excavated 1939-40 and 1945. The date range is the conventional one as I remember it, inside the 5500-3500 BCE span given for the culture; I know of no radiocarbon date from the site. The point is the Dzhanbas-kala fortress the site is numbered from, from memory, good to perhaps 10 km. Not opened: the excavation seasons are from a search engine's summary of Vinogradov 1957, which also names a second site, Kunyak-1."
cite = "Vinogradov, A.V. 1957, K voprosu o yuzhnykh svyazyakh kel'teminarskoi kul'tury, Sovetskaya etnografiya 1957(1):25-45; first reported in Tolstov, S.P. 1948, Drevnii Khorezm"
url = "https://eo.iea.ras.ru/wp-content/uploads/1957/01/eoarchive_1957_1_025_vinogradov.pdf"
checked = false

