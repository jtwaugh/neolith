# Gap critic: ornaments layer. Judgements, not data.
# Presence-only layer: masked cells mean 'not recorded'. Values are the expected share of occupations
# that would have personal ornaments if their finds were recorded (0-1).

[meta]
layer = "ornaments"
written = "2026-11-12"
dossier = "build/isostyle/gaps/ornaments/dossier.json"
summary = "Ornaments are presence-only: no source records their absence, so the atlas shows 1.0 wherever anything is recorded and masked cells mean 'not recorded', never 'absent'. The values below are the share of occupations that would have personal ornaments (beads, pendants, perforated shells and teeth, bracelets) if their finds were recorded; this applies to every entry. Ornaments are near-universal in burials and common in excavated settlements, but small camps and surface sites often yield none, so expect 0.6-0.8 in most regions and 0.4-0.5 where preservation or research is poor. The coverage is overwhelmingly Windler's Spondylus compilation, so the recorded area is the Spondylus exchange zone (the Balkans, the Carpathian basin, Central Europe, France) from c. 6,000 BCE, plus DEFC in Greece and Anatolia and Rigaud's early Neolithic sites. Everything outside, including the Mesolithic with its shell and tooth beads, Africa with its ostrich-eggshell beads, and SW Asia with its stone and shell beads, is a recording gap. A speculative layer should model 'any ornament', not Spondylus, and should not extrapolate the Spondylus zone's edges."

