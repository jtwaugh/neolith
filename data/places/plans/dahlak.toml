verdict = "research"
confidence = "medium"
really_empty = "Yes in our data, no in the literature. No site in the box or within 100 km in any epoch; the nearest are the Saudi Tihama shell-midden sites (Site 217-174/175, Sihi) 274-357 km east across the Red Sea. No duplicates or misfiled sites. The source is blank, not the build: the XRONOS country file for Eritrea is empty (and Djibouti's), and p3k14c has no Eritrean record. Board problem: the Dahlak islands themselves are not on the board from 5,000 BCE. The hex holding Dahlak Kebir (centre 40.12 E, 15.61 N) is land to 6,000 BCE and Water from 5,000 BCE on, so the box's 5 land hexes after 5,000 BCE are all mainland coast (Massawa, the Buri peninsula, Gulf of Zula); see the person notes in the summary."
why_empty = ["not_in_open_compilations", "research_intensity", "submerged", "recovery_methods"]
summary = """
The Dahlak archipelago is a low, salt-domed coral platform of several hundred
islands off Massawa, sitting on the same kind of shallow bank as the Farasan
islands opposite. With the sea 50-60 m lower it was part of the mainland:
the dossier counts 10 of the box's 15 hexes as land at 10,000 BCE that drown
later. Our data has nothing in the box or within 100 km in any epoch, and
from 5,000 BCE the residuals read "little dated archaeology nearby". That
reading is right. The emptiness comes from our compilations, on top of a
thin field record. Eritrea has no record at all in XRONOS or p3k14c, so the
whole African shore of the southern Red Sea is blank for us. The prehistory
of the coast is known from one survey project, plus a remote-sensing study
that has never been checked on the ground.

The literature has more. The 2005-06 survey of the Buri peninsula and Gulf
of Zula (about 400 km², at the south edge of the box) found more than a dozen
MSA and LSA sites. Three Holocene shell-midden sites there have seven
radiocarbon dates on shell: Gelalo NW (7000-8500 cal BP), Misse East
(7323-8039 cal BP) and Asfet Unit F (5475-5672 cal BP). They are the earliest
dated shell middens in the Red Sea. They have obsidian microlithic industries,
ostrich-eggshell and marine-shell beads, and Terebralia (mangrove) and
Atactodea (sandy beach) shell. On the islands themselves, Meredith-Williams
et al. (2014) mapped about 1,200 probable shell mounds from satellite images
centred on the Dahlak islands, some casting shadows like the 6 m Farasan
mounds, plus 19 doubtful candidates at Massawa. None has been visited or
dated. An Italian engineer collected obsidian microliths on Dahlak Kebir in
the 1930s (Blanc 1952, "Wiltonian"), and there are undated shell middens
there. North of Massawa at Gurgussum, Roubet found obsidian and
comb-decorated pottery, called Neolithic (both after Zazzaro 2013).

The things to do, in order of yield: (1) enter the three dated Zula/Buri
middens from Beyin and Bar-Yosef Mayer's date table, after checking the
marine reservoir correction; (2) obtain the coordinates of the 1,200
remote-sensed Dahlak mounds from the York team and enter them as surveyed,
undated and unverified, never as dated sites; (3) speculate a
Farasan-style shell-mound fisher-forager presence on the islands and coast
from about 6,000 BCE, which is well argued because the Farasan mounds
opposite are dated in their thousands. The early Holocene shore on the bank
is drowned and can only be speculated.

For a person, the board: (a) the Dahlak islands vanish from 5,000 BCE. The
archipelago (Dahlak Kebir alone is several hundred km²) is bigger than
islands.min_area_km2. Probably the hexes holding it touch mainland coastal
hexes, so islands.py groups it with the mainland, whose landmass is too big
to restore. Adding a Dahlak box to [islands].watch would show it. Until it is
fixed, any island site we enter lands in a Water hex. (b) The sheet draws
the whole Dahlak bank and the strip east of it as semi-desert land at
10,000 BCE. That is right for the bank. The hexes at 40.98 E stay land only
at 10,000 BCE; I did not check them against the axial trough.
"""

