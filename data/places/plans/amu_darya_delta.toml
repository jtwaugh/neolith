[[speculate]]
target = "settlements"
slices = [-6000, -5000, -4000, -3000]
rule = "Place inferred Kel'teminar fisher-hunter settlements in floodplain hexes within 10 km of a branch of the Amu Darya that the river record has as flowing in that slice (the Sarykamysh branch throughout, the Akchadarya branch from 5,000 BCE) and on the Sarykamysh shore, about one per 40 km of channel, marked as inferred. Extend the rule east to 62 E, beyond the present box. Nothing before 6,000 BCE."
confidence = "medium"
reasoning = "The culture is defined from this delta and dated 5500-3500 BCE or 7th-4th millennium BCE (Brunet et al. 2013), with large communal houses for a hundred or more people, so presence from about 5,500 BCE is as safe as a statement without ingested data can be; 6,000 BCE is included on the longer chronology and is the weakest slice. The board agrees that the land was usable: 15-20 floodplain hexes in every slice. Our own speculative layers already assume people here (pottery judged 0 -> 0.53 -> 0.86, houses 0.34, ground stone observed) while the settlement layer shows none for 450 km, so the layers contradict each other until something is placed. The spacing is a guess and has low confidence: surveyed Kel'teminar localities are surface scatters on deflated takyr, much denser than this in places and absent in others."
basis = ["literature", "environment", "other_layer"]

