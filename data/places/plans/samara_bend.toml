really_empty = "Thin, not empty, and missing its best sites. The proposed box (47.8-52.0 E, 51.9-54.0 N, 55 land hexes) holds five dated records: Ivanovka (6,920-6,620 BCE), Lebyanzhinka (5,590 BCE, Beta-392490), Grenovka (4,730-4,650 BCE, tagged 'cucuteni_trypillia', which cannot be right on the Volga), Lopatino (3,100 BCE) and Kutuluk (3,020 BCE). Nothing is in the box at 10,000-8,000 BCE. 'Lebyanzhinka' and 'Lopatino' flagged as a possible duplicate are different sites 2.3 km apart. 'Lebyazhinka 4' (7 dates, 8,140-6,850 BCE, citing Zaitseva et al. 2009) is filed at 5.06 E, 50.51 N in Belgium; it belongs here at about 50.67 E, 53.68 N. The Khvalynsk cemetery has 14 dates in the raw XRONOS Russia file but no coordinates, so the build dropped it. AADR has about 15 directly dated burial localities in or next to the box (Khvalynsk I-II, Ekaterinovskiy Mys, S'yezzheye, Chekalino-4, Maksimovka-1, Labazy, Sidel'kino-2, and others); none are in our settlements except Lopatino and Kutuluk. Dolbunova's table has six dated-pottery Elshanka and Middle Volga sites here (Chekalino IV, Ilyinka, Lebyzhinka 4, Nizhnyaya Orlyanka II, Bolshaya Rakovka 2, Krasny Gorodok). They feed the pottery layer only."
why_empty = ["not_in_open_compilations", "dataset_edge", "publication_access"]
summary = """
The Middle Volga from the Samara Bend to Khvalynsk, with the Samara, Sok and
Kinel valleys of the Trans-Volga. This is the home ground of the Elshanka
culture, which made some of the earliest pottery in eastern Europe; of the
Samara and Khvalynsk Eneolithic, including the Khvalynsk cemetery with its
copper and its sheep, goat and cattle sacrifices; and of the earliest
Yamnaya kurgans. It is one of the most intensively dated places in the
steppe, in Russian work and in the aDNA papers of 2015-2026. Our data holds
five records, one of them with the wrong culture. The emptiness is all
recording. The dates exist in AADR, which this project has already
downloaded, and in Dolbunova et al.'s deposit, which it has already used for
pottery. Neither has been turned into settlements.

The dating debate matters for what to enter. Mamonov's and Vybornov's
7th-millennium dates for Elshanka are on shell and on pottery organics.
Courel et al. (2021) modelled about 250 legacy dates with new AMS dates and
put most Elshanka pottery at c. 6000-5200 cal BC. In their model, dates
before 6000 cal BC are 'possible, but unlikely'. Human bone from Khvalynsk
and Ekaterinovka is also dated too old by the fish in the diet. AADR's
calibrated ranges for Khvalynsk-2 reach 5311 calBCE, while the corrected
estimate for the cemetery, as summarised in search results I could not
open, is c. 4500-4300 BCE (Anthony et al. 2022). Enter the dates with that
caveat. Do not use them to push pottery or herding earlier.

The board is wrong here as well (details in the reply). Every one of the 55
hexes is Boreal Forest from 10,000 to 6,000 BCE and Temperate Forest from
5,000 BCE. There is no grassland or floodplain anywhere between 52 and 54 N,
and the Samara, Sok and Kinel are not drawn. Courel et al.'s Fig. 1 puts
this region in the modern forest-steppe and marks open steppe at the start
of the Atlantic.
"""

