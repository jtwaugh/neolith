# Gap critic: pottery layer. Judgements, not data.
# Values are the expected share of occupations with pottery (0-1) if the gap had evidence.
# Revised 2026-11-12 after the Arabian label fix and the Dolbunova start-date fix.

[meta]
layer = "pottery"
written = "2026-11-12"
dossier = "build/isostyle/gaps/pottery/dossier.json"
summary = "Most pottery gaps are compilation gaps, not archaeological ones: eastern Europe, Russia, the Caucasus, Central Asia, inner Arabia and inner Africa have dated sites in regional literatures but almost none in the open tables, so the surface there is either masked or driven by culture labels. Since the two pipeline fixes (bare 'Neolithic' etc. in Arabia now counts as no pottery; Dolbunova forager-pottery sites now start at the modelled start of their nearest modelled site, 5540-6000 BCE), the earlier artefacts have mostly gone: the Baltic is no longer at 0.87 in the 6,000 BCE slice but masked, which is honest, and the Arabian Neolithic sites now read as aceramic. What remains looks like method rather than record: (1) Arabia's evidenced cells still read 0.56-0.74 from 6,000 BCE, because the few Ubaid-labelled Gulf sites (Dosariyah, Khor, Dalma, Abu Khamis) and kernel spill from Fars, Kerman and southern Iraq dominate a peninsula whose aceramic interior has few dated sites; do not extend those values inland. The same country rule now also makes bare 'Bronze Age' labels in Arabia absent (e.g. Qannas), which is wrong for Umm an-Nar and the Yemeni Bronze Age after c. 2700 BCE: the rule should be limited to the Neolithic stage or end there. (2) The forest zone still loses coverage after 5,000 BCE (40% to 15% to 2%) because the Dolbunova spans still end at 4000 BCE, and its 6,000 BCE values (0.84-0.86) count only ceramic sites, because no aceramic Late Mesolithic site there is recorded. (3) The Caucasus at 6,000 BCE (0.94) still rests on 'Neolithic' labels. (4) The White Sea coast cells filed as drowned are a coastline-polygon artefact, and the grid's 66°E edge cuts Central Asia. Elsewhere the absences are real: no pottery north of the Sahara and east of the Levant before c. 7000 BCE, while the Sahara-Sahel and Sudan carry some of the world's earliest pottery from c. 9400 BCE, which the edge values (0.52-0.58 at 9,000 BCE) correctly hint at."

