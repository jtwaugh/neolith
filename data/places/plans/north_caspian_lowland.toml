really_empty = "Very thin, and half of what is there is misplaced. The proposed box (45.0-54.0 E, 45.0-50.6 N; 135 land hexes at 10,000 BCE, 264 from 9,000 to 6,000 BCE, 206 from 5,000 BCE) holds four records: Varfolomeevskaya (6,850-5,890 BCE, 13 dates), Surskoy Ostrov 2 (6,050 BCE), Kairsak III (5,840-5,630 BCE) and Dzangar (5,020-4,760 BCE). Ust-Tashelka (6,710-6,550 BCE) is 6 km outside. Nothing is in the box at 10,000-8,000 BCE or at 3,000 BCE. Varfolomeevskaya and Surskoy Ostrov 2 share the longitude 46.582 E and sit near Lake Elton. Varfolomeevka is on the Maly Uzen by the Varfolomeevskoye reservoir, about 100-150 km east of that point (Yudin, as quoted in a search summary; Dolbunova's table has 47.80 E, 50.52 N). Surskoy Ostrov is a Dnieper site and has no business here (its reference is Kotova 2009). Kairsak III's position disagrees with Dolbunova's by 75 km. Not in our data: Algay and Oroshaemoe I on the Bolshoy Uzen (18 dates, 6,271-4,557 cal BC), Baibek, Kugat IV, Tenteksor, Berezhnovka-2 (AADR), and the Orlovka type site."
why_empty = ["not_in_open_compilations", "research_intensity", "submerged", "publication_access"]
summary = """
The Caspian's own lowland north of the sea: the Trans-Volga steppe from
Volgograd and the Uzen rivers down to the Volga-Ural interfluve and the
Kalmyk Black Lands. Most of it is below 0 m and was sea floor in the late
Khvalynian. On the board it is half water at 10,000 BCE, wholly land from
9,000 to 6,000 BCE (58 hexes of it are drowned later), and a quarter water
from 5,000 BCE. So the board does track the Caspian; the question of when
the Mangyshlak lowstand ended is set out in the volga_delta plan. The board
has no Kamysh-Samar lakes at the end of the Uzens, no Sarpa lakes, and no
Elton or Baskunchak, though Elton alone is about 150 km2.

The record is better than our data. The Orlovka culture (Varfolomeevka;
the lower layer at Oroshaemoe I, with pottery from c. 6200-5900 cal BC),
the Kairshak-Tenteksor group of the interfluve, and the Cis-Caspian and
Khvalynsk Eneolithic all have radiocarbon series. Kulkova et al. 2019 give
18 dates for Algay and Oroshaemoe I alone, with domestic sheep and goat at
c. 5000-4700 cal BC. Little of this reached XRONOS, and two of the four
records that did are in the wrong place. The causes are, in order: not in
open compilations, coordinates assigned badly on the way in, and real
research thinness, since excavations are few, as Kulkova et al. say
themselves. Submergence hides only the strip south of the modern coast.

Do this: (1) correct Varfolomeevskaya and Surskoy Ostrov 2; (2) enter Kulkova
et al. 2019 Table 1 and the Vybornov series; (3) add the AADR burials
(Berezhnovka-2; Khlopkov-Bugor and Panitskoe just north); (4) put inferred
Orlovka-type camps along the Uzens and the Sarpa until (2) is done.
"""

