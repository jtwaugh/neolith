written = "2026-11-12"
verdict = "research"
confidence = "medium"
really_empty = "Yes: no site in the box and none within 100 km in any epoch; the nearest is Oleni Ostrov, 270-311 km south. The raw XRONOS Russia file has nothing between 63.5 and 66 N east of 33 E; p3k14c has one date (36.77 E 66.3 N, 1000 BP) north of the box. No duplicates. Board problem, which comes first: the board drains the White Sea when it should be bigger. At 8,000 BCE all 50 hexes of the box are land (Onega Bay, the Vyg mouth and the Dvina Bay included); at 10,000 BCE the western half is Ice and the rest land; water appears only at 7,000 BCE (8 hexes) and reaches today's outline about 5,000 BCE (18-19 water hexes). The dossier's 15-19 'drowned later' hexes are this artefact. In fact the White Sea basin was sea throughout the window, with its shores far above today's because of glacio-isostatic depression: at Chupa, on the Karelian coast 70 km north of the box, the marine limit is between 104 and 142 m and the shore fell at about 1 cm a year from 10,800 to 6,300 cal BP, standing at 33-40 m about 6,350 cal BP (Kolka et al. 2015)."
why_empty = ["not_in_open_compilations", "publication_access", "research_intensity"]
summary = """
The Karelian (south-west) coast of the White Sea from Onega Bay to the Vyg
mouth at Belomorsk, where the White Sea petroglyphs (Zalavruga, Besovy
Sledki, Yerpin Pudas; more than 3,400 figures in 12 locations over about
1.5 km², Lobanova 2019) sit on islands in the lower Vyg, with more than 80
sites around them. In our data the box is empty in every epoch, with nothing
within 100 km.

Two things are wrong, and they are separate. First, the board. The sea step
lowers the modern White Sea by the global sea-level curve and ignores uplift
(data/lakes/SOURCES.md, Baltic, "Limits"), so the shallow Onega Bay and
Dvina Bay dry out. The real White Sea coast was depressed by the ice and lay
far above today's: tens of metres in the early Holocene, still about 20 m
at Belomorsk in the 6th millennium BCE (Yerpin Pudas I, a settlement at
21.5-23.7 m, is dated 5570-5360 cal BC). Lobanova 2019 says the lower Vyg
became available to people no earlier than the mid-Atlantic, because it was
sea floor before then. So the early coast of this box is not drowned; it is
inland and uplifted, and much of today's coastal strip was under water. The
board shows the opposite.

Second, the record. It is dated and published, mostly in Russian. Tarasov
et al. 2017 list dates for Zalavruga I and IV, Zolotets, Yerpin Pudas I and
Besovy Sledki (locality 11), Keret' to the north and others; Zalavruga Ware
has AMS dates of 3,500-2,900 cal BC. Lobanova 2019 tabulates the Vyg sites
with elevations and dates, from Yerpin Pudas I (5570-5360 cal BC) to the
Eneolithic layers that bury the carvings. The Mesolithic of the White Sea
coast is known from older Russian monographs (Devyatova 1976; others in
Tarasov's references) that I could not reach. What to do: fix the White Sea
on the board first, or every shore site entered will plot in the sea or
inland of a false coast. Then ingest the Vyg dates from Tarasov et al. 2017
and Lobanova 2019. Speculation covers the Mesolithic coast before 5,500 BCE,
which nothing I read dates.
"""

