# Master attribution registry: every upstream dataset, image, font and paper
# whose data enters this repository or the published app.
#
# `python -m pipeline attributions` writes ATTRIBUTIONS.md (repo root) and
# neolith-rs/crates/app/assets/credits.json (the in-app Credits window) from
# this file. pipeline/tests/test_sources.py checks that every download in
# the configs and the Makefile is covered here (`provides`), that every entry
# has a URL and a licence, and that nothing non-commercial or no-derivatives
# is shipped or committed.
#
# Fields
#   key        short id
#   name       what it is
#   url        landing page or DOI
#   licence    SPDX-style id where one exists (CC-BY-4.0, CC0-1.0, ...);
#              "facts" for numbers read from papers; "unknown" if unverified
#   citation   the citation the licence or the authors ask for
#   used_in    where it enters the project
#   role       data      rows or rasters that become our data
#              fit       used only to fit or check a parameter; not shipped
#              asset     fonts, images
#              reference cited for numbers or rules typed into config
#   shipped    ends up in neolith-rs/assets/world.bin or the wasm bundle
#   committed  its rows, or a table derived from it, are tracked in git
#   verified   licence checked on the upstream page (date in `checked`)
#   provides   download keys this entry covers, used by the coverage test:
#              "isostyle:<file>", "settlements:<table>", "url:<prefix>"
#   notes      anything a reader should know

# ------------------------------------------------------------------ terrain

