target = "settlements"
slices = [-9000, -8000, -7000, -6000, -5000, -4000, -3000]
rule = "Place one inferred forager camp, marked as inferred, in each land hex of the box whose ETOPO1 minimum lies in a closed or near-closed lowland basin below 130 m: the Meshchera, the Rostov-Nero basin, the Pleshcheyevo basin, the Dubna and Nerl lowlands and the Ozerki-Shosha lowland. Put it at the hex's lowest point (the likely lake or bog edge). Label 9,000-7,000 BCE Butovo, 6,000 BCE Upper Volga, 5,000-4,000 BCE Lyalovo and 3,000 BCE Volosovo. Do not place one in a hex that already has a recorded site in that slice."
confidence = "medium"
reasoning = "Every dated site in and near the box is on a palaeolake or bog edge (Zaretskaya et al. 2005: 'all the settlements started and then developed near the lake shores or small river banks'). There are about 20 sites in the single Ozerki bog, and over 150 Mesolithic sites in the Meshchera by Sorokin's count (not opened). So people lived in each of these basins from the Preboreal on; the record is missing only the dates. One camp per hex is far fewer than the real count of sites, which is the point: it marks presence, not density. The 7,000 BCE slice is included even though no recorded site covers it here. Ivanovskoe-7 and Sakhtysh-14 have Late and Final Butovo layers in 8550-7200 BP, so the gap in our data is a gap in compilation. The culture labels follow the cultural sequence of the sites above. The weakest part is the 3,000 BCE Volosovo label, which rests on Pesochnoe-1 alone."
basis = ["neighbouring_evidence", "literature", "environment"]

