[meta]
place = "ladoga"
written = "2026-11-12"
verdict = "research"
confidence = "high"
really_empty = "Yes inside the box: no site in any epoch. Twelve sites lie within 100 km, all on the Finnish side (Savonlinna, Kerimäki, Taipalsaari, Kitee, Rääkkylä, Vironlahti and others, 5.6-97 km from the box), from 5,840 BCE at the earliest and mostly single dates of about 3,800-3,500 BCE. These are Finnish municipality names with one coordinate each, not sites, so even the near cluster is coarse. The raw XRONOS Finland file holds one Isthmus record ('Karelian Isthmus', 890 BP) and p3k14c four late Finnish-database dates (14CARHU) on the Isthmus, none in the window. The famous Antrea net is in neither. No duplicates in the box. The board itself is sound here: Lake Ladoga, the Baltic-Ladoga strait over the Isthmus until -8250 and the Heinjoki outflow are all modelled (data/lakes/SOURCES.md)."
why_empty = ["not_in_open_compilations", "publication_access", "buried"]
summary = """
Lake Ladoga and the Karelian Isthmus between it and the Gulf of Finland:
ceded by Finland in 1940-44, so its Stone Age was dug by Finns before the
war and by Russian and joint Finnish-Russian teams since the 1990s. In our
data the box is empty in every epoch; the nearest sites are Finnish
municipality records across the border. The residuals read "as expected"
because the site list's own pattern expects nothing here.

The record exists and is well dated. Seitsonen et al. 2012 compiled every
Stone Age and Early Metal Period radiocarbon date from the Isthmus (from
about 8,600 cal BC, 81 of them judged usable): the Antrea Korpilahti net
(8560-8240 cal BC), Antrea Suuri Kelpojärvi (8640-8320), the Heinjoki
(Veshchevo) sites (Early Mesolithic, 7960-7600, and Early Neolithic),
Kaukola Rupunkangas 1A with the oldest known dwelling in the area
(8170-7610), and Late Mesolithic to Late Neolithic sites through to 1,800
cal BC. Dolukhanov et al. 2007 tie the settlement of the area to the Ladoga-
Baltic waterway over the northern Isthmus, in use from about 11,500 cal BP.
At the Neva mouth, Okhta 1 in St Petersburg has more than 150
determinations for occupation from 4,200 cal BC on (not opened). Tarasov et
al. 2017 add the northern Ladoga shore (Kurkijoki). None of these is in
XRONOS, p3k14c or NeoNet: the Finnish radiocarbon records that reach
p3k14c carry only four late dates from the Isthmus, and the Russian lists
were never entered.

Two things hide part of the record even from the literature. Ladoga stood
low in the early Holocene (submerged bars down to 41 m below today's level,
data/lakes/SOURCES.md), so the earliest south-shore sites are under the
lake. The Ladoga transgression from about 5,000 cal BP then buried the
south-shore lowland under silt and sand before the Neva breakthrough
(Dolukhanov et al. 2007). The Isthmus record is therefore biased to the
north and to sites above the old shorelines. What to do: ingest Seitsonen
et al. 2012 Table 2 (about 100 dates; locations from the site names and
maps), then Okhta 1, then the Karelian Ladoga dates in Tarasov et al. 2017.
"""

