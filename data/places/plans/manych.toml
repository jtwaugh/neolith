reasoning = "Mesolithic and Neolithic people used both ends of the depression. On the Lower Don there are fisher-hunters from c. 7,450 BCE (Razdorskaya II, Rakushechny Yar), and in the steppe valleys of Rostov oblast the Caspian-Ciscaucasian group (Kremennaya II, Rassypnaya VI, 7th-5th millennium BC; Tsybrij et al. 2017). To the east are Dzhangar in Kalmykia and the Kairshak sites. Lavrentyev (2022) confirms that Mesolithic sites exist in the valley, though few were known. Lakes in a steppe draw game and people, and the lakes here are brackish to saline, poorer than the Don. Hence a density half that of the valleys and low confidence."
basis = ["analogy", "neighbouring_evidence", "literature"]
