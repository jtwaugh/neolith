# Gap critic: waterlogged_organics layer. Judgements, not data.
# Values: expected share of dated occupations with waterlogged or desiccated organic artefacts (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "waterlogged_organics"
written = "2026-11-12"
dossier = "build/isostyle/gaps/waterlogged_organics/dossier.json"
summary = "This layer maps preservation and recording as much as use: logboats, paddles, bows, fish weirs, trackways, nets and textiles survive in peat, lake mud and submerged coasts, and in dry caves. Evidence sits in Britain (Somerset Levels, fens), the southern Levant (Nahal Mishmar and other dry caves) and Egypt. Genuinely rich gaps are the peat and lake districts of Denmark, northern Germany, the Netherlands (Pesse, Hardinxveld, Tybrind Vig, Ertebølle weirs), the Alpine lakes, Latvia and Lithuania (Lubāna, Šventoji) and the Russian forest zone (Zamostje, Shigir, Sakhtysh), all poorly represented in XRONOS's dated materials. The rule mixes wet and dry preservation, so arid regions can score through cave finds. Expected values are the share of occupations that would yield such objects given the region's preservation: 0.1-0.15 in wetland districts, under 0.02 on dry mineral soils."

