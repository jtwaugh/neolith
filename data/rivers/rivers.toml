# Great rivers of the map, with their history over -10000..-3000.
# Read by pipeline/rivers.py; reasoning and references in SOURCES.md.
#
# Course, one of:
#   from = [lon, lat]   headwater point. The nearest HydroRIVERS reach with at
#                       least `min_upland` km² upstream is traced downstream to
#                       its outlet, or to the point nearest `to`.
#   points = [[lon, lat], ...]  hand-entered waypoints (upstream first), for
#                       channels HydroRIVERS can't follow (buried under sand).
#   With `from`: `before` waypoints are prepended (linking a distributary to
#   its parent) and `then` waypoints appended. A river whose course changed is
#   several entries: the shared upper course (`to` stops it at the fork) and
#   one entry per branch, each with its own `state`.
# A course that reaches the sea is extended across the shelf exposed at the
# run's lowest sea level (`shelf = false` turns this off, `true` forces it).
# Each year a river ends where the run of Water hexes at its mouth begins.
#
# size: 1 minor, 2 large, 3 great (line width; size >= 2 perennial rivers
#       make hexes `major`).
# state: step function, year (BCE negative) -> "perennial" | "seasonal" |
#       "absent"; absent before the first key.
# confidence: how well the course and timing are supported (high/medium/low).

# ===================================================================== Nile
[[river]]
key = "nile"
name = "Nile"
size = 3
from = [31.6, 6.6]
min_upland = 200000
# To the delta head near Cairo; the delta branches are below.
to = [31.23, 30.1]
state = { "-10000" = "perennial" }
confidence = "high"

# Nile delta. The modern delta began forming 8-7 ka as the sea steadied
# (Stanley & Warne 1993, 1994); earlier the branches crossed a wider,
# exposed delta plain (the shelf rule extends them). The Rosetta (Bolbitine)
# branch formed about 1000 BC and the Damietta (Phatnitic) later still, so
# neither is drawn. Waypoints follow the branch towns.
[[river]]
key = "nile-canopic"
name = "Nile (Canopic branch)"
size = 2
# The largest branch, active for "thousands of years" before 1000 BC
# (Stanley, Warne & Schnepp 2004, J. Coastal Research 20:920): past
# Naukratis to Canopus (Abu Qir).
points = [[31.23, 30.1], [31.0, 30.3], [30.85, 30.5], [30.72, 30.75], [30.6, 30.9], [30.45, 31.05], [30.25, 31.2], [30.07, 31.32]]
shelf = true
state = { "-10000" = "perennial" }
confidence = "medium"

