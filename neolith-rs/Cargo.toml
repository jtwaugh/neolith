[workspace]
resolver = "2"
members = ["crates/core", "crates/convert", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
neolith-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep debug builds of the app usable: optimise dependencies.
[profile.dev.package."*"]
opt-level = 2

# Web build (trunk uses it via data-cargo-profile in index.html): the wasm is
# downloaded on every visit, so optimise for size rather than speed.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
