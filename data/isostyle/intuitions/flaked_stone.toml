# Gap critic: flaked stone layer. Judgements, not data.
# Presence-only layer: masked cells mean 'not recorded'. Values are the expected share of occupations
# that would have flaked stone if their finds were recorded (0-1).

[meta]
layer = "flaked_stone"
written = "2026-11-12"
dossier = "build/isostyle/gaps/flaked_stone/dossier.json"
summary = "Flaked stone is presence-only: no source records its absence, so every value the atlas shows is 1.0 and every masked cell means 'not recorded', never 'absent'. The judgements below therefore give the share of occupations that would have flaked stone if their finds were recorded, and for this layer that is nearly all of them (0.95-1.0) in every region and slice: flint, chert, quartz and obsidian knapping is universal from 10,000 to 3,000 BCE, including in the Bronze Age (sickle blades, Canaanean blades, Egyptian flint knives, arrowheads). This caveat applies to every entry and is not repeated in each. The coverage map is a map of four sources, not of the past: BDA (France, Iberia, the Maghreb), DEFC (Greece and Anatolia), DObsiSS sourced obsidian (SW Asia) and MedAfriCarbon (North Africa); the drop to 548 cells at 3,000 BCE is where those sources end. Whole regions with thousands of dated stone-using occupations (Russia, Ukraine, Scandinavia, the British Isles, the Baltic, the Sahara, the Nile) are fully masked. Two places deserve a value below the default: the southern Mesopotamian alluvium from the Ubaid on, where stone was imported and baked-clay sickles replaced some flint, and the West African forest, where quartz industries are sparse and poorly reported. The speculative layer should treat flaked stone as present wherever people were."

