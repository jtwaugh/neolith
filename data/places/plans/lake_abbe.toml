what = "Seasonal fisher-herder site on a 40 m extinct volcanic hill ('colline Rouge') about 20 km east of Lake Abhe, Gobaad plain, Djibouti; excavated since 1984. 9,104 sherds of incised and impressed pottery, 21,247 lithics (almost all obsidian, mostly segments), basalt grinders. Of 30,559 vertebrate remains, two-thirds are fish (tilapia, catfish). There are taurine cattle and ovicaprine dung spherulites, three cairn pit burials, and Gulf of Aden shell ornaments. Six charcoal dates put it at the end of the 3rd to the mid-2nd millennium BC; the ministry page gives 2500-1800 BCE. It only touches the 3,000 BCE slice. In XRONOS (Gif-7404) it sits at 44.69 E, 9.72 N in Somaliland; that needs correcting. My point is from a gazetteer seen only in a search result (11.061 N, 42.074 E), which fits 'near As Eyla, 20 km east of the lake'. Unverified."
