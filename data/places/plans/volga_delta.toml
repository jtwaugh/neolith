really_empty = "Nearly. One record in the box in any epoch, Kairsak III (47.92, 46.76; GIN-5905, GIN-5927; 5,840-5,630 BCE). Dolbunova et al.'s site table puts Kairshak III 75 km further north at 47.76, 47.42, which is outside the box, so even that one may not belong here. Nothing within 100 km of the box in any epoch, and the nearest site in the 4,000 and 3,000 BCE slices is 290-555 km away. No duplicates. The box is on dry land from 9,000 to 6,000 BCE, all 40 hexes of it, with the Mangyshlak-stage Volga running out to about 44 N. In 10,000 BCE it is 38/40 water (the late Khvalynian sea), and from 5,000 BCE 18/40 water (New Caspian). 18 hexes that are land in 9,000-6,000 BCE are drowned later. Baibek (48.84, 46.45), a dated Kairshak-group pottery site, lies inside the box in Dolbunova's table and is not in our data."
why_empty = ["not_in_open_compilations", "research_intensity", "submerged", "buried", "publication_access"]
summary = """
The Volga delta and the strip of North Caspian lowland on either side of it,
from Astrakhan to the Kazakh border. The board does model the Caspian (see
data/lakes/lakes.toml: -10 m at 10,000 BCE, falling to -80 m by 7,050 BCE,
-50 m by 6,050 BCE and -25 m from 5,000 BCE). So the box goes from late
Khvalynian sea, to a dry Mangyshlak-stage delta plain reaching 44 N, to a
New Caspian coast near Astrakhan. That is the right shape. The timing is the
contested part. Bezrodnykh & Sorokin (2016) date the freshwater Mangyshlak
deposits of the northern Caspian to 12-9 ka, and they liken the lowstand
basins to the ilmen lakes of today's delta. A later abstract by the same
group (Sorokin et al. 2021) puts the regression at 11.9-10.5 ka. If that is
right, the northern Caspian was flooded again some time between about 8,500
and 7,000 BCE, not after 6,000 BCE as on the board. The board has no lakes
on the delta (ilmeni, the Sarpa lakes).

Our data holds one dated site, and it may not be in the box. The regional
record is the Lower Volga Neolithic of the Kairshak-Tenteksor ('Seroglazovo')
and Dzhangar groups, and the Orlovka culture of the Uzen steppe to the north
(see the north_caspian_lowland plan). Vybornov et al. (2018) date it from
6500-5400 cal BC (Neolithic) to 5300-4700 cal BC (Eneolithic), and put the
first domestic animals in the Early Eneolithic Cis-Caspian culture. It is
absent because its dates sit in Russian and Kazakh print and in Documenta
Praehistorica and Radiocarbon articles that nobody has entered. XRONOS holds
only Kairsak III and Dzangar here, and the Kazakhstan download has 54 dates
in all. Two physical causes add to it. Anything on the early Holocene delta
plain south of about 46 N is now under the North Caspian, and on the modern
delta the early levels lie under Holocene delta silt. Neither explains the
empty steppe on either side of the delta from 5,000 BCE, where the cause is
recording.

Do this: (1) take the Kairshak, Baibek, Kugat and Tenteksor dates and
coordinates from Vybornov's papers and Dolbunova's table; (2) fix Kairsak
III's position; (3) take the AADR-dated steppe burials around the delta
(Volga-Chogray-Channel-53 in Kalmykia is 77 km west of the box); and (4)
until then, put inferred fisher-hunter camps on the Mangyshlak-stage
channels the board already draws. Board questions for a person are in the
reply: the end of the Mangyshlak lowstand, and the missing delta lakes.
"""

