written = "2026-11-12"
verdict = "research"
confidence = "medium"
really_empty = "Yes, and far beyond the box: no site in the box or within 100 km in any epoch, and the nearest site of any date is 450-857 km away. In a window from 56 to 66 E and 38 to 46 N our data holds four records, all on the Kopet Dag piedmont 400 km south (Monjukli Depe, Tilkin, Anau) apart from one misfiled Breton site (see summary). No duplicates. The box itself is partly at fault: it frames the modern Aral delta and stops at 60.6 E, while the sheet shows floodplain continuing east to 62 E, which is the old Akchadarya delta where the classic sites of this region lie."
why_empty = ["not_in_open_compilations", "publication_access", "research_intensity", "dataset_edge"]
summary = """
Khwarazm: the deltas of the Amu Darya between the Kyzylkum and Karakum,
with the Aral Sea to the north and Sarykamysh to the west. On the board it
is 15 to 20 hexes of floodplain in desert, and there is no dated site in
our data within 450 km of it in any epoch. The residual model, which only
knows the site list's own pattern, expects 1.7 sites at most and reads
'as expected'. That is the model having no neighbours to learn from, not a
finding.

This is the home region of the Kel'teminar culture, found by Tolstov's
Khorezm expedition in 1939 at Dzhanbas-4 in the Akchadarya delta: sedentary
fishers and hunters with pottery and very large communal houses, dated
c. 5500-3500 BCE in the summary I could open (Wikipedia) and to the 7th-4th
millennia BCE by Brunet et al. (2013), who name the Akchadarya and the
Zeravshan as its two core regions. It is absent from our data because it
was excavated and published in Russian in the Soviet period, largely before
or without radiocarbon, and because the modern dated work (Ajakagytma, in
the Kyzylkum 400 km to the east) has not been entered in the open
compilations either. The single XRONOS record that looks relevant, 'Akcha'
(RUL-241, 3750 +/- 90 BP), has no coordinates on the XRONOS page and sits
in our raw copy at 37.6 N, 60.62 E in southern Turkmenistan.

What I could verify online is thin: abstracts and a general summary. The
site catalogues are Soviet monographs I know of but did not open
(Vinogradov's work on the Neolithic of Khorezm and of the Central Asian
interfluve). So the first job is to get them, and until then the plan
proposes inferred Kel'teminar camps along the delta channels.

For a person: (1) extend the box east to about 62.0 E, or add an
'Akchadarya delta' place; (2) the record 'Pors Nehue (Hoedic)' at 61.28 E,
38.95 N in our settlements is a Breton site (its twin is correctly at
-2.88, 47.33) and is already in coordinate_audit.csv as same_name_far; it
is one of only four records in this whole region; (3) the board keeps the
Aral Sea at full size from 10,000 BCE, which I have not checked against
the lake-level literature.
"""

[[known_site]]
