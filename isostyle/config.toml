# ---------------------------------------------------------------- EUROEVOL
# UCL Discovery refuses scripted downloads (bot check, then HTTP 429), so these
# are downloaded by hand from the landing page into build/isostyle/sources/.
# `fetch` records their checksums. Sites and the plant taxa list are read from
# the SQL dump: the CommonSites CSV has unquoted commas.

