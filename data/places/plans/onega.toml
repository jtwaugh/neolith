[meta]
place = "onega"
written = "2026-11-12"
verdict = "research"
confidence = "high"
really_empty = "Nearly. One site in the box in any epoch: Oleneostrovski mogilnik (Yuzhniy Oleniy Ostrov, 35.408 E 62.173 N, XRONOS, 9 dates, drawn as 6,600-4,540 BCE), and nothing else within 100 km of the box in any epoch; the nearest other site is 282-504 km away. No duplicates. The raw XRONOS file for Russia (2,271 records) holds only this site and a misplaced 'Medvezhya' (34.47 E 62.92 N, 15-19 ka BP, out of window) between 33 and 37 E; p3k14c adds the same Oleni Ostrov dates and one late Finnish date. The Oleni Ostrov span is the uncorrected bone-date span: Schulting et al. 2022 put the cemetery's main use at about 8250-8000 cal BP (about 6300-6050 BCE) after a freshwater-reservoir correction. Board problem: Lake Onega is not on the board in any epoch: all 49 hexes in the box are Boreal Forest from 10,000 to 3,000 BCE, and no river (Svir, Vodla, Shuya, Suna) is on record."
why_empty = ["not_in_open_compilations", "publication_access", "research_intensity"]
summary = """
Lake Onega, the second-largest lake in Europe (9,891 km², surface 33 m), with
the Zaonezhye peninsula and Pegrema on the north shore, the Oleni Ostrov
cemetery in the north-west basin, and the petroglyph capes (Besov Nos, Peri
Nos, Kladovets Nos) on the east shore near Pudozh. In our data the box holds
one site, the Oleni Ostrov cemetery, and nothing else within 100 km in any
epoch. The residuals read "as expected" in every hex because the site list's
own pattern expects almost nothing in the Russian boreal forest: that
expectation is itself an artefact of the same gap.

The emptiness is a hole in the open compilations, not in the past. The
Karelian record is large, dated and published, mostly in Russian and in
print: Tarasov et al. 2017 compile 194 radiocarbon dates from 77 Neolithic
and Eneolithic sites in the Karelian Republic (later 6th to 2nd millennium cal
BC), many of them on Onega's shores (Pegrema, Sheltozero, Orovnavolok,
Chernaya Guba, Chernaya Rechka, Kladovets, Vozhmarikha, Voynavolok, Vorob'i
4). The Mesolithic dates are in Zaitseva et al. 2000, a table of 211
Mesolithic dates from eastern Europe with site coordinates, which places
Pegrema 8, Orovnavolok 9, Kladovets, Muromskoe 7 and Besov Nos 6 on this lake
between about 7,500 and 5,700 cal BC, beside the 34 Oleni Ostrov dates we
already hold. Lobanova 2019 lists more than 60 sites around the east-shore
petroglyphs, with elevations and dates, and dates the Onega carvings to Pit-
Comb Ware times, about 4,200-3,000 BCE. None of this reached XRONOS, p3k14c or
NeoNet. Of the 2,271 Russian XRONOS records, two sites fall in all of Russian
Karelia.

What to do: ingest the Zaitseva et al. 2000 table (coordinates given) and
Tarasov et al. 2017 Table 1 (coordinates to be read off its Map 1), then the
Lobanova 2019 site tables. That turns one site into about twenty between
7,500 and 3,000 BCE. Separately, a person should put Lake Onega on the board:
it has been a lake through the whole window (the basin was free of ice by
about 13-12 ka; Rybalko et al. 2022), with levels a few metres above today's
around 5,000 BCE (Lobanova 2019, citing Devyatova 1986). Without the lake,
the shore sites have no shore and the petroglyph capes are inland forest.
Speculation is limited to the earliest slices, before the first dates on the
lake itself. On the user's point about large early Holocene lakes: the large
proglacial Onega stage, with its southern basin about 80-85 m a.s.l.
(Rybalko et al. 2022 cite c. 14.5-13.3 ka for the ice-lake stages), is
before the window. In the window the lake had roughly its present outline,
so the board needs the lake, not a bigger palaeolake.
"""

