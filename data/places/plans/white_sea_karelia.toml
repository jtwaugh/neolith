reasoning = "The coast was ice-free from the start of the Holocene (Lunkka et al. 2012 put a Younger Dryas shoreline at Belomorsk; title only, not opened) and was a sea coast throughout. People were at Onega's north shore by about 6,600 cal BC (Orovnavolok 9) and probably earlier. By 5,570 cal BC Pit-Comb Ware groups were at the Vyg mouth (Yerpin Pudas I), and the White Sea carvings show beluga and boats (Lobanova 2019), which points to an economy that used the sea. Why no earlier dates: the Mesolithic shore is on raised terraces that are forested, little surveyed, and poor in organic preservation, and Lobanova notes that the lower Vyg itself was sea floor until the mid-Atlantic. The density follows the Onega plan's analogy, halved for the poorer survey."
