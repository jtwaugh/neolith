# ------------------------------------------------- Lake Chad basin: lake samples
# From data/places/plans/megachad.toml. Single-date "sites" that lie far
# below the board's Lake Megachad at their own date: dates of lake deposits
# from the 1960s lake-level work, not settlements.

[[reject]]
site = "Mandi"
lab = "44Gif"
source = "https://xronos.ch/c14s/64809"
note = "9835 +/- 135 BP (about 9,330 BCE), the site's only date, no material or site type recorded. At 14.67, 13.42 by Bol, where ETOPO1 ground is about 284 m, 45 m below the board's 329 m Megachad highstand at that date (data/lakes/lakes.toml, after Armitage et al. 2015): under open lake water, so it dates a lake deposit, not a camp. Filed twice (XRONOS 64809 as '44Gif-', 170509 as '44Gif'); both dropped."

[[reject]]
site = "Beurkia"
lab = "T-642"
source = "https://xronos.ch/c14s/64718"
