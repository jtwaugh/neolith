verdict = "research"
confidence = "medium"
really_empty = "Yes. No site in the box in any epoch and no duplicate or misfiled site hiding one. The nearest in-period sites are four records (two real sites, MK Sada and Sedd adh-Dhra'a II) 73-85 km to the north-east on the Yemeni plateau; the Tihama cluster we do hold (Ash-Shumah, Gahabah-1, Surdud-1, Qummah-3 and -4, Ibn Abbas-4) starts about 110 km north of the box. The raw XRONOS download also holds Sabir and Ma'layba near Lahj (44.9-45.1 E, 13.0 N; 33 dates, 3550-2695 BP), which are after 3,000 BCE and so never show. The African side is blank in the source itself: the XRONOS files for Djibouti and Eritrea are empty and Somalia has one date. One board problem: the sheet draws the strait as continuous land at 10,000 and 8,000 BCE."
why_empty = ["research_intensity", "not_in_open_compilations", "submerged", "preservation"]
summary = """
The mouth of the Red Sea: the Yemeni Tihama and the Aden coast on one side,
Djibouti and the Eritrean Danakil coast on the other. Our data has nothing in
the box in any of the eight epochs, and the residuals read "little dated
archaeology nearby" from 5,000 BCE. That reading is right. The emptiness is
a hole in the dated record, not in the past. On the African shore almost
nothing prehistoric has been dated: the open compilations hold no record at
all for Djibouti or Eritrea, the known Djibouti Neolithic (Asa Koma and
Wakrita in the Gobaad basin by Lake Abbe) is early second millennium BCE and
west of the box, and the first radiocarbon ages from the Tadjoura coast were
only reported from surveys in 2023-24 (Hardt et al. 2026). On the Arabian
shore the Tihama was long written off as archaeologically barren (Lee 2023);
the surveys that changed that (Tosi 1986, seven shell-midden sites of 8-5 ka
cal BP; the 2003 Tihamah Coastal Survey of Khalidi) produced surface
collections with few dates, and mainland middens there are dune-covered or
cut away by wadis (Hausmann et al. 2019, citing Khalidi 2005). Only a small
fraction of southern Red Sea middens are dated at all, the oldest about
8,000 cal BP in Eritrea. Before that the shore itself is gone: 9 of the
box's hexes drown after 10,000 BCE.

The literature does have at least one dated site inside the box that we
lack: Gihayu on the Khor Umayra lagoon west of Aden, a stratified
fisher-shellfisher mound of the fifth to fourth millennium BCE dug by a
German-Russian team (Vogt and Amirkhanov), said to be one of several like
it on the Gulf of Aden coast. I could not open the paper (the journal site
blocks automated readers), so it is entered unchecked. The things to ingest
are the Gihayu reports, the Tihama survey site lists (Khalidi 2005; Durrani
2005, which draws on unpublished survey data), and the Tadjoura survey.
None of these is a table of dated sites; most of what they yield will be
period-dated survey sites, so the plan also carries speculation for the two
shores.

Board problem, for a person: the sheet shows land right across the strait at
10,000 and 8,000 BCE, so the Red Sea is a lake on the board until 6,000 BCE.
Lambeck et al. (2011) show it stayed open to the Gulf of Aden through the
last 400,000 years; at lowstand the channels south of the Hanish Sill were
under 4 km wide. A 4 km channel cannot show at 55 km hexes, but anything
that reads land adjacency will treat Africa and Arabia as joined. Fixed
2026-11-13: [[sea.channel]] in pipeline/config.toml keeps a chain of hexes
from the Gulf of Aden past the Hanish Islands Water in every year. Also for a
person: Asa Koma sits in our raw data in Somaliland (44.69 E, 9.72 N), not in
Djibouti's Gobaad plain.
"""

