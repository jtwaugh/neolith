[workspace]
resolver = "2"
members = ["crates/core", "crates/convert", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
neolith-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep debug builds of the app usable: optimise dependencies.
[profile.dev.package."*"]
opt-level = 2
