# Gap critic: pile_dwellings layer. Judgements, not data.
# Values: expected share of dated occupations that are pile or lake dwellings (0-1).
# Regions that share one reading are written as one judgement per region with the same text.

[meta]
layer = "pile_dwellings"
written = "2026-11-12"
dossier = "build/isostyle/gaps/pile_dwellings/dossier.json"
summary = "Pile dwellings are genuinely regional: the circum-Alpine lakes and bogs (Switzerland, southern Germany, Austria, the French Jura and Savoie, northern Italy) from c. 4300 to 2400 BCE, with outliers at Marmotta (Lake Bracciano, c. 5700), La Draga (Catalonia, c. 5300), Dispilio and the Ohrid-Prespa lakes (from c. 5500), Alvastra in Sweden, and the lake and bog settlements of Latvia, Lithuania, Belarus and western Russia (Sārnate, Šventoji, Serteya, Usvyaty, 4th-3rd millennium). The layer shows only 40-52 cells because nearly all of them are dated by dendrochronology, which no open table here uses: this is the dominant gap and it is a method artefact, not a hole in the record. Away from lakes and bogs the absence is real, so speculative values should be confined to lake basins."

