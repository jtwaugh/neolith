# Gap critic: open_land layer. Judgements, not data.
# Values are the expected % open land (REVEALS-style: grassland, heath, steppe,
# desert scrub and crops all count as open) if a 1° reconstruction existed.

[meta]
layer = "open_land"
written = "2026-11-12"
dossier = "build/isostyle/gaps/open_land/dossier.json"
summary = """The biggest problem in this layer is not a gap but a reading error. LandClimII's TW*.RV.estimates files list all 420 1° cells in every window. Cells with no reconstruction in a window are rows of zeros (every taxon, every land-cover class, OL = 0): 44 to 211 of the 420 cells, depending on the window, and up to half of all cells in the oldest window. isostyle/landcover.py reads those rows as 0% open land and averages them with real values. So (a) the 0.0 minima in almost every edge range, the Levant edges of exactly 0 at 10,000-8,000 BCE, and the Mesopotamian edge of 10.7% at 7,000 BCE are artefacts, (b) cells valid in only one of a slice's windows are halved, and (c) the per-slice mean (30% to 23% to 27%) understates the real valid-cell mean (about 60% at 11,450 BP to about 31% in the mid-Holocene to 40% by 3,000 BCE) and flattens the early-Holocene closing of the forest. Rows whose land-cover columns sum to 0 should be treated as missing. \
The real gaps have two causes: the dataset's window (30-75°N, 25°W-50°E) and where pollen cores exist. Everything in Africa, Arabia, Central Asia, Iran east of 50°E and the Russian forest and steppe east of 50°E is outside the window. Inside it, the Maghreb, Levant, Mesopotamia and the Caspian lowland have no cells with records. Those regions are mostly steppe or desert, which REVEALS counts as open, so the gaps should be filled high (85-98%), not by extending the forested European mean."""

