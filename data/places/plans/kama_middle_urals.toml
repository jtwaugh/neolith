verdict = "research"
confidence = "high"
really_empty = "Almost. The box (53.5-61.5 E, 56-60.5 N, 200 land hexes, no water in any epoch) holds one dated Holocene record, Beregovaya 2 (59.99, 57.93; six dates 10,200-9610 BP, so 9,920-8,990 BCE). There is no site in the box or within 100 km from 7,000 BCE on; the nearest is 423-723 km away. Beregovaya 2 really is in the Gorbunovo bog by Nizhny Tagil, but our record stops at 8,990 BCE. The site has dated Middle and Late Mesolithic, Early Neolithic (about 6200 cal BC) and Chalcolithic layers. Everything else in the raw p3k14c and XRONOS files for this area is Palaeolithic, and much of it carries West European names shifted onto Russian coordinates (Igue des Rameaux, Tapado do Motinho, Klappholz, Stranska Skala, Garzweiler). Our data has no record at all for the Shigir bog, the Kama Neolithic or the Kama Mesolithic. The only Kama-area point anywhere in our inputs is Kochurovskoe I (52.45, 56.8) in Dolbunova et al.'s lipid table, just west of the box, and it feeds the pottery layer, not the settlements."
why_empty = ["not_in_open_compilations", "publication_access", "research_intensity", "dataset_edge"]
summary = """
The Kama basin around Perm and the eastern slope of the Middle Urals
between Nizhny Tagil and Yekaterinburg. The eastern-slope peat bogs, Shigir
(68 archaeological sites) and Gorbunovo (38 sites), formed over palaeolakes
and preserve wood. They give the Shigir idol, which recent AMS dating puts at
about 11,600 years ago, and the larch trackways and stakes of Beregovaya-2.
The Kama Neolithic of the Cis-Urals is a pottery-using forager culture of
the second quarter of the 6th to the early 4th millennium cal BC. On our board
the box is 200 forest hexes with no river or lake on record, and there is one
dated site, cut off at 8,990 BCE.

The cause is compilation. The open compilations take this region only
through the Vermeersch Palaeolithic list (hence the caves and the shifted
names) and a handful of RADON rows. The Holocene literature is substantial
and partly open. Zaretskaya et al. 2012 publish 61 dates from Varga-2 at
Shigir and Beregovaya-2 at Gorbunovo, with Early Mesolithic from about
9300 cal BC and Early Neolithic about 6200-5700 cal BC. Lychagina &
Vybornov 2017 list more than 50 dates for about 30 Kama Neolithic sites
(Khutorskaya, Lake Chashkinskoye I/IIIa/VI, Lyovshino, Ziarat, Mokino,
Tarhan I and others). Those sites have no coordinates, only a numbered map.
Chairkina, Kuzmin & Hodgins 2017 publish 153 Trans-Urals dates from the
Mesolithic to the Bronze Age (abstract only). The grid's eastern edge at
66 E is not the problem here (the box ends at 61.5 E). The Trans-Urals
lowland beyond, which holds most of Chairkina's sites, is at the edge.

The user asked whether the board shows the lakes. It does not:
no water hex, and nothing for the box in lakes.toml or rivers.toml. The Shigir
and Gorbunovo palaeolakes were small, sub-hex basins (my inference from the
bog maps in Zaretskaya et al. 2012; I found no area stated), so no water
hex is right. The real board gap is the rivers. The Kama, Volga's largest
tributary, is absent, and so are the Vishera, Chusovaya, Belaya and Vyatka.
The Kama Neolithic sites sit on the first terraces and oxbow lakes of
exactly those rivers (Lychagina & Vybornov 2017). On the eastern slope the
Tagil, Neiva and Iset are absent too.

Do this: enter the Shigir/Gorbunovo dates; geolocate and enter the Kama
Neolithic table; get the Chairkina 2017 date list; add the Kama system to
rivers.toml. Until then, inferred Kama Neolithic camps along the Kama and
inferred Mesolithic camps at the eastern-slope palaeolakes can go beside
the record.
"""

