# Isostyle surfaces on the game's hex grid. Paths are relative to the repo
# root. Years are signed (negative = BCE). The Phase 1 audit keeps its own
# config, isostyle/audit.toml (50 km equal-area grid, 250-year slices).

[grid]
# The hex-map pipeline's output: hexagons in lon/lat with id and bbox
# properties, and a year-keyed `terrain` (Water and Ice are used here).
file = "build/combined_map.geojson"

[region]
# Dates outside this box are not read. It is the grid's extent.
lon_min = -17.0
lon_max = 66.5
lat_min = 5.5
lat_max = 76.5

[time]
# The map keyframes. Each slice covers its year ± half the spacing.
slices = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]

[dates]
raw_dir = "build/settlements"
pipeline_config = "pipeline/config.toml"
curve = "build/settlements/intcal20.14c"
same_km = 1.0
same_name_km = 10.0
share_km = 10.0
# Occupation episodes: a site's dates are chained while their 95% calibrated
# ranges overlap or lie within this many years of each other.
episode_gap = 200
# A culture label counts for an episode only if the episode's median falls
# inside the culture's range in data/cultures/cultures.toml, widened by this.
range_margin = 200
# Site types counted as graves (flagged, not dropped).
grave_types = ["grave", "burial", "tomb", "tumulus", "barrow", "dolmen", "megalith", "cairn",
               "cist", "funerary", "cemetery", "necropolis", "hypogeum"]

[presence]
# The layer registry (what each surface is); occupation layers' direct-evidence
# rules (dated sample material, site type) live there too.
layers = "data/isostyle/layers.toml"
cultures = "data/cultures/cultures.toml"
rules = "data/isostyle/label_presence.toml"
# A dataset record within this distance of a dated site, overlapping one of
# its episodes in time, marks that episode instead of adding a new one.
match_km = 2.0
# Hand-extracted tables kept in the repo: reader function -> path. Empty
# since the Jordan et al. 2016 table (an all-rights-reserved supplement) was
# dropped on 2026-11-13; its North African and Saharan sites come from
# Rotunno & Crema 2025 and MedAfriCarbon instead (data/isostyle/inputs/README.md).
inputs = {}

[surface]
# Candidate kernel widths (km) for leave-one-site-out cross-validation.
sigma_km = [50, 75, 100, 150, 200, 300]
cutoff = 2.5          # R = cutoff * sigma
alpha = 1.0           # shrinkage toward the slice mean
# Mask below this evidence: two well-dated sites one sigma away, 2*exp(-1/2).
e_min = 1.2
levels = [0.25, 0.5, 0.75]
bootstrap = 200
seed = 20261112
# Bone and antler: cells whose topsoil pH (SoilGrids 0-30 cm mean) is below
# this are masked. Kendall et al. 2018 put the onset of bone mineral
# dissolution at pH 6.0; 5.5 is the "strongly acid" class boundary.
bone_ph_min = 5.5

[speculative]
# Fill smoothing, chosen by `python -m isostyle evals --search` (the smoothest
# grid point that passes every guard; data/isostyle/evals/search.json).
blend_rings = 16     # hex rings over which judged values lean toward nearby observed ones
time_smooth = 0.4    # share of the way a speculative cell moves toward its neighbours in time
smooth_iters = 16    # neighbour-averaging passes over speculative cells (observed cells fixed)
smooth_rate = 0.5
bridge = 1.0         # a speculative cell observed in the slices before and after leans toward those two values
bridge_conf = 0      # ... by the full `bridge`, whatever the judgement's confidence
bridge_hold = 1      # ... and keeps that value through the smoothing: its own record outranks its neighbours'
# Presence-only layers: cells with dated evidence under the threshold move
# toward the observed 1.0 by s = (E / e_min) ** soft_power (speculative.py).
# Chosen 2026-11-13 against the regression cases with the hand-painted cores
# removed; the mean speculative value of these layers rises by 0.01-0.02.
soft_sources = 1
soft_power = 0.1

[ancestry]
# Autosomal ancestry proportions per AADR individual (`python -m isostyle
# ancestry`; needs R + ADMIXTOOLS 2 and the 1240K genotypes; isostyle/ancestry/README.md).
anno = "aadr_v66.p1_1240K.anno"
geno = "aadr_v66.p1_1240K"     # prefix of the .geno/.snp/.ind trio in build_dir/sources
out = "data/ancestry/ancestry.csv.gz"
min_snps = 30000               # targets below this are `low_coverage`
p_min = 0.01                   # a model is accepted at p >= this ...
z_bound = 2.0                  # ... with every weight inside [0, 1] within this many SE
max_sources = 4
# true: sources not in the model under test join the outgroups (rotating qpAdm).
rotate = true
order = ["whg", "ehg", "ana", "irn", "lev", "naf"]
# Outgroups ("right"). The first is the base. `ids` picks AADR genetic IDs
# within the groups; without it every passing individual of the group is used.
right = [
  { pop = "Mbuti", groups = ["Mbuti"] },
  { pop = "UstIshim", groups = ["Russia_UstIshim_IUP"] },
  { pop = "Kostenki14", groups = ["Russia_Kostenki_UP"], ids = ["Kostenki14.SG"] },
  { pop = "MA1", groups = ["Russia_Malta_UP"], ids = ["MA1.SG"] },
  { pop = "Han", groups = ["Han"] },
  { pop = "Papuan", groups = ["Papuan"] },
  { pop = "Onge", groups = ["India_100BP"], ids = ["Andaman.SG"] },
  { pop = "Mota", groups = ["Ethiopia_MotaCave_4500BP"], ids = ["mota.SG"] },
]

# The six distal sources. Group labels are AADR v66.p1 Group IDs and are
# checked against the .anno (isostyle/tests/test_ancestry.py).
[ancestry.sources.whg]
name = "Western hunter-gatherer"
groups = ["Luxembourg_Loschbour_Mesolithic", "Switzerland_Epipaleolithic", "Italy_NordEst_Epigravettian"]
ids = ["Loschbour.DG", "Bichon.SG", "Villabruna.AG.BY.AA"]

[ancestry.sources.ehg]
name = "Eastern hunter-gatherer"
groups = ["Russia_Karelia_Mesolithic_HG", "Russia_Karelia_Mesolithic", "Russia_Samara_EN_Mesolithic", "Russia_Sidelkino2_Mesolithic-Dup"]

[ancestry.sources.ana]
name = "Anatolian farmer"
groups = ["Turkey_N"]

[ancestry.sources.irn]
name = "Iranian farmer / Caucasus hunter-gatherer"
groups = ["Iran_GanjDareh_N", "Georgia_KotiasKlde_Mesolithic", "Georgia_Satsurblia_LateUP"]

[ancestry.sources.lev]
name = "Levantine forager"
groups = ["Israel_Natufian"]

[ancestry.sources.naf]
name = "North African forager"
groups = ["Morocco_Iberomaurusian"]

# Known results the table must reproduce within `tol` (default 0.10): the
# phase-0 validations, kept as regression guards in `evals`.
[[ancestry.validate]]
name = "Cheddar Man is a western hunter-gatherer"
individual = "I3016"
expect = { whg = 1.0 }

[[ancestry.validate]]
name = "Oetzi is mostly Anatolian farmer with a little WHG"
individual = "Iceman"
expect = { ana = 0.90, whg = 0.10 }

[[ancestry.validate]]
name = "An LBK farmer (Derenburg) is mostly Anatolian farmer"
individual = "DER002"
expect = { ana = 0.93 }
tol = 0.08

[[ancestry.validate]]
name = "Globular Amphora shows the hunter-gatherer resurgence"
individual = "RISE1163"
expect = { whg = 0.25, ana = 0.75 }

[[ancestry.validate]]
name = "Khvalynsk is EHG with Iran/CHG"
individual = "I6737"
expect = { ehg = 0.75, irn = 0.25 }
tol = 0.15

[output]
build_dir = "build/isostyle"
out_dir = "data/isostyle"

