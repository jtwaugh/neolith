# ============================================ Amu Darya, Syr Darya (deltas)
# Krivonogov et al. 2014 (Gondwana Research 26:284): both deltas shifted
# north through the Holocene. In -10000..-3000 the Amu Darya fed Sarykamysh
# (and the Uzboy) through the Daudan channel, and the Aral through the
# Akchadarya; the modern Aral sub-delta dates from antiquity on. The Syr
# Darya ran through its southern courses (Krivonogov's Karadarya and
# Daryalyk); the Inkardarya (4-3 ka), Janadarya and Kuvandarya (from 2.7 ka)
# and the modern northern course to the Small Aral are later, so not drawn.
# All the branch courses are HydroRIVERS channels (from SRTM, so dry beds
# show), linked to the main river by a waypoint or two.

[[river]]
key = "amu-darya"
name = "Amu Darya"
size = 3
from = [65.2, 37.8]
min_upland = 100000
# Upper course, to the delta head below Tuyamuyun.
to = [61.1, 41.45]
state = { "-10000" = "perennial" }
confidence = "high"

[[river]]
