# Hand corrections to settlement positions (pipeline/coords.py). The map build
# applies them to the shipped settlements before anything reads a position.
# Each [[fix]] names a site, where it is now (`was`, matched within 0.02°), one
# action (`to = [lon, lat]`, `drop = true` or `submerged = true`), a `source`
# link and a `note`. Sources are listed in data/settlements/SOURCES.md.

[[fix]]
name = "Parnwell, Peterborough"
was = [-0.2105, 50.5925]
to = [-0.2105, 52.5925]
source = "https://archaeologydataservice.ac.uk/catalogue/adsdata/arch-1352-1/dissemination/pdf/Cambs_grey_lit_reports/GL2018_Fen_edge_landscape_Parnwell.pdf"
note = "Latitude mistyped 50 for 52: the record put it in the English Channel. Parnwell is on the north-eastern edge of Peterborough, 2 km north of Fengate."

[[fix]]
name = "Lockarp 7E"
was = [4.1318, 55.55]
to = [13.07, 55.55]
source = "https://radonb.ufg.uni-kiel.de/samples/16488"
note = "Longitude wrong (in the North Sea). Lockarp is in Malmö, Skåne; position to the parish, about 5 km."

[[fix]]
name = "El Collado"
was = [-0.103, 36.89]
