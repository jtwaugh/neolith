reasoning = "The southern Red Sea has more than 4,200 shell-midden sites, with dated ones from about 8,000 cal BP in Eritrea, 7,500 cal BP on the Farasan Islands and 8-5 ka cal BP on the Yemeni Tihama (Meredith-Williams et al. 2014; Hausmann et al. 2019). Our own data has the Tihama middens from 6,610 BCE 110-200 km north of the box, and the literature has Gihayu inside it in the fifth to fourth millennium BCE. There is no environmental break between those coasts and this one. That the box shows none is explained by dune cover and wadi erosion on the mainland shore (Hausmann et al. 2019) and by nobody having dated anything on the African side. Presence is a medium-confidence claim; the spacing is a guess (low) taken from how thinly the mainland Tihama middens are spread compared with the islands."
