really_empty = "No. Three records in the box: Rakushechny Yar (6,840-3,030 BCE, 10 dates), Matveev Kurgan I (6,040 BCE) and Matveev Kurgan II (4,220 BCE). The two Matveev Kurgans are separate sites sharing one point, not a duplicate. Within 100 km: Razdorskoe I, Astahovo and Zolotovka (9,060 BCE). But the record is misplaced and thin. Rakushechny Yar is filed at 39.07 E, 47.45 N, west of Rostov. The site is on Porechny island by Razdorskaya stanitsa (Tsybrij et al. 2017), about 40.65 E, 47.55 N: 120 km east and outside the box, whose east edge is 40.3 E. The other XRONOS spelling of the site ('Rakusecnyj Jar', Le-5344) and Dolbunova's table (40.67, 47.56) both have it there. Razdorskoe I shows only its 4490 BP date (3,180 BCE); its 9470 +/- 310 BP date (IGAN-722, 10,013-7,846 cal BC) is in the raw XRONOS file but not in the built record. 'Unterpullendorf' (41.41, 47.50; Lengyel, 83 km east) is an Austrian site with its longitude about 25 degrees too far east. So the box misses the Lower Don cluster it was drawn for, and the record we hold of that cluster is 3 of roughly 10 dated sites."
why_empty = ["not_in_open_compilations", "dataset_edge", "publication_access", "submerged"]
summary = """
The head of the Sea of Azov and the Lower Don below the Donets confluence.
The Lower Don is one of the best-dated early Neolithic regions of eastern
Europe. Tsybrij et al. (2017) list 111 radiocarbon dates from the Lower Don
and the north-east Azov. Rakushechny Yar is a stratified site on Porechny
island by Razdorskaya, with 23 cultural layers; its earliest dated pottery
layers fall at 7,186-6,472 cal BC, and dates run through the 5th millennium.
Razdorskaya II, 6 km downstream, is an aceramic fishing site, dated
7,460-5,759 cal BC. The paper also covers Razdorskoe I, Samsonovskoe and the
two Matveev Kurgans on the Mius, and puts Kremennaya II and III and
Rassypnaya VI in the steppe valleys to the north-east. The early pottery
dates are on food crusts and may be several centuries too old, from
freshwater reservoir effects; Tsybrij et al. discuss this and keep them.

Our data has three of these sites, and the most important one is in the
wrong place. The causes are (1) not in open compilations: only the XRONOS
subset reached us, without Razdorskaya II, Samsonovskoe, Kremennaya or
Rassypnaya; (2) a coordinate error on Rakushechny Yar; and (3) the box,
which stops at 40.3 E, short of the Razdorskaya cluster. The Azov itself was
dry land until the Black Sea reconnection (-7,050 on the board) and filled
over the next millennia, so the early Holocene Don valley across the Azov
floor is submerged. That hides the lower reach, not the cluster upstream.

Do this: (1) correct Rakushechny Yar's position (see the reply for the
correction); (2) enter Tsybrij et al.'s Table 1 by site, which is the single
best source for this place; (3) widen the box east to 41.3 E and north to
47.9 N so that it holds Razdorskaya, the Donets mouth and Astahovo; (4)
restore Razdorskoe I's early date, or say in the record why it was dropped.
A person should also move 'Unterpullendorf' and 'Unterwolbing' back to
Austria.
"""

