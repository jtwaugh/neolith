# ------------------------------------------------- Lower Don
[[same]]
name = "Rakushechny Yar"
members = ["Rakushechny Yar"]
at = [40.67, 47.56]
source = "https://journals.uni-lj.si/DocumentaPraehistorica/article/view/44.13"
note = "XRONOS files it west of Rostov (39.0667, 47.4459); the site is on Porechny island by Razdorskaya stanitsa on the Lower Don (Tsybrij et al. 2017), 120 km east, where Dolbunova et al. 2023 ('Rakucheshny Yar') put it (40.67, 47.56). Moving the XRONOS records here, before grouping, joins them with the Tsybrij dates (data/settlements/literature_dates.csv) as one site. Replaces a corrections.toml fix, which moved the finished XRONOS site after grouping and so left two sites at one point."

