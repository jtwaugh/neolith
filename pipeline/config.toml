# Hex-map build pipeline config. Paths are relative to the repo root.
# Years are negative integers (BCE), matching combined_map.geojson keys.

[output]
# Intermediate GeoJSON (SPEC §3.2 shape); `make maps` converts it into
# neolith-rs/assets/world.bin for the Rust app.
combined = "build/combined_map.geojson"
build_dir = "build"
# Write a year key only when a hex's value changes (SPEC §3.2 step function).
sparse = true

[time]
start = -10000
end = -3000
step = 100
# How years between/outside keyframes get values. "hold": latest earlier
# keyframe. "fronts": between keyframes, changes spread as fronts from where
# the new value already is; outside the keyframe range, hold.
fill = "fronts"

# How far a hex is from where the new value already is, for "fronts".
# "hops" counts hexes through the patch, which on this grid makes fronts with
# straight north-south sides (45°E in Russia at -5500, 6°E at -8500).
# "distance" is the straight-line distance (longitude shrunk by cos lat) to
# the nearest source reached through the patch, times 1 + noise x a smooth
# fixed noise field of `noise_period` hex widths, so fronts fed from a
# straight edge wander. Keyframes are unchanged either way.
[time.fronts]
metric = "distance"
noise = 0.25
noise_period = 6.0
seed = 11

[grid]
# Canonical hex geometry, ids and bboxes come from this file.
source = "data/legacy/grid.geojson"

# ---------------------------------------------------------------- terrain
[terrain]
# Pixels within this RGB distance of a palette colour count as that class;
# anything further (anti-aliasing, labels) doesn't vote.
tolerance = 30.0

# RGB -> terrain class. Moved from scripts/convert_terrain.py.
palette = [
  [[255, 0, 0], "Chaparral"],
  [[255, 0, 255], "Extreme Desert"],
  [[0, 0, 255], "Semi-Desert"],
  [[0, 255, 255], "Ice"],
  [[0, 255, 0], "Free"],
  [[255, 255, 0], "Savannah"],
  [[127, 0, 0], "Woodlands"],
  [[127, 0, 127], "Mountains"],
  [[0, 0, 127], "Tropical Forest"],
  [[0, 127, 127], "Grassland"],
  [[0, 127, 0], "Temperate Forest"],
  [[130, 127, 0], "Steppe-Forest"],
  [[102, 102, 102], "Boreal Forest"],
  [[178, 178, 178], "Land"],
  [[51, 51, 51], "Water"],
]

# Drawn classes the transcription of the source maps got wrong. The composite
# key frames were copied from Adams & Faure's QEN maps (raw/maps/europe/,
# raw/maps/africa/). QEN's pale-yellow steppe over the Pontic-Caspian region,
# the Caucasus and Anatolia was copied as red Chaparral at -9000 and as
# yellow Savannah from -8000 on, the colours of Mediterranean scrub and
# tropical savanna. Tropical savanna doesn't grow north of 30°N, and pollen
# records there (Shotota, Lake Neor, Nar Gölü) show steppe, meadow and oak
# parkland; the gap filling ([paleobiome.calibrate]) then spread both classes
# over the Anatolian, Zagros and Talesh uplands. Each rule turns `from` into
# `to` on hexes centred in `box` = [lon0, lat0, lon1, lat1] (optionally only
# for `years` = [first, last]).
[[terrain.reinterpret]]
from = "Savannah"
to = "Grassland"
box = [-17.0, 30.0, 66.5, 76.5]
[[terrain.reinterpret]]
from = "Chaparral"
to = "Grassland"
box = [26.0, 39.0, 66.5, 76.5]

# The eastern Sahel and Nubia in the African Humid Period: the drawn maps
# have grassland from 15 to 22°N where pollen at El Atrun (18°N) and Selima
# (21.4°N) shows thorn-tree savanna at -7000 and -6000. Fitted on those (the
# latitude limit is loose: 19.5-24.5°N fit equally; 22°N is just north of
# Selima, the northernmost savanna among them) and checked on held-out Oyo,
# Nabta and Sodmein: 5 -> 7 of 10 slices. Arabia's errors run both ways at
# too few sites for a rule.
[[terrain.reinterpret]]
from = "Grassland"
to = "Savannah"
box = [20.0, 15.0, 38.0, 22.0]
years = [-7000, -6000]

# The Middle Volga and Trans-Volga at -7000 and -6000. The composites copy
# QEN's 8,000 14C BP map, which has closed taiga down to about 51-52°N here,
# and drop QEN's own forest-steppe band (lilac in raw/maps/europe/
# terrain_7000_bce.gif) into it; the gap fill east of the QEN map's edge, and
# at -10000...-8000 (`misdated`, trained on this drawing), copied the taiga.
# So the Samara Bend was Boreal Forest from -10000 to -6000, under a Dfa
# (hot-summer) climate, where BIOME4 has grassland. Pollen from the Early
# Neolithic layers at Chekalino IV (Sok, 53.9°N: wormwood and goosefoots 68%,
# trees about 15%, in the valley) and Ivanovka (Samara valley, 51.9°N: "almost
# bare of trees"), dated about -7000 (Vybornov 2011, Documenta Praehistorica
# 38), Courel et al. 2021 (QSR 269, Fig. 1: open steppe at the start of the
# Atlantic up to the Sok) and the regional synthesis of Senator 2017 (steppe
# with pine patches in the Preboreal, steppe and forest-steppe in the Boreal,
# forest-steppe in the Atlantic) put forest-steppe and steppe here, not taiga.
# Literature anchors: lit:chekalino-iv, lit:ivanovka (held out),
# lit:middle-volga-synthesis. The north edge (54.5°N) is near Courel's steppe
# line; the west edge (45°E, the Sura) is a seam with the drawn taiga of the
# Don-Oka forest-steppe, which no anchor here tests. -5000 on (drawn
# Temperate Forest, the mid-Holocene forest maximum) is left as drawn.
[[terrain.reinterpret]]
from = "Boreal Forest"
to = "Steppe-Forest"
box = [45.0, 49.0, 56.0, 54.5]   # south to 49°N: the drawn taiga's tail at 50-51°N
years = [-7000, -6000]

# The Trans-Volga south of the Volga Upland at -7000 and -6000: steppe, after
# the Steppe-Forest rule above (later rules win). Senator 2017 (after
# Zavyalov et al. 2003): in the Boreal the Trans-Volga's herb cover was close
# to turf-grass steppe and the Obshchy Syrt interfluves had no sizeable
# woods. Vybornov 2011: at the start of the Atlantic the southern Volga-Ural
# forest-steppe "conform[ed] substantially with southern steppe and even
# semi-desert conditions". BIOME4 has grassland here. The boxes step along
# the Volga's east bank so the edge lies under its floodplain. North limit
# 52.5°N: the Buzuluk pine forest (52.2-52.6°N) had pine from about 10 ka
# and elm, oak and hazel from about 9 ka 14C BP (Kremenetski et al. 1999,
# via Senator 2017). lit:ivanovka is held out, but this rule is written from
# its own source, so it no longer tests it independently.
[[terrain.reinterpret]]
from = "Boreal Forest"
to = "Grassland"
box = [46.0, 49.0, 56.0, 51.0]
years = [-7000, -6000]
[[terrain.reinterpret]]
from = "Boreal Forest"
to = "Grassland"
box = [46.8, 51.0, 56.0, 51.75]
years = [-7000, -6000]
[[terrain.reinterpret]]
from = "Boreal Forest"
to = "Grassland"
box = [47.8, 51.75, 56.0, 52.5]
years = [-7000, -6000]

# Regions of a drawn keyframe copied from a source map of another time. The
# QEN Europe originals (raw/maps/europe/) print their own radiocarbon dates:
# the -9000 composite copies the 12,000-11,000 14C BP map (Allerød, about
# -11950 to -10950 BCE) and the -8000 composite the 11,000-10,000 14C BP map
# (Younger Dryas, which ended about -9750: Walker et al. 2009). The -7000
# composite copies the 8,000 14C BP map (about -6950), so it is dated right.
# Against the pollen anchors, Europe north of 42°N agreed with the map in
# 23-25% of slices at -10000…-9000 and 46-52% at -8500…-8000, against 85-91%
# from -7000 on (the Balkans Chaparral at -8000 is the Younger Dryas steppe).
# Each rule makes every drawn class but `keep` (default Water) a biome gap on
# hexes centred in `boxes` in `years`; gaps fill from the climate model as for
# drawn "Land", with the calibration for those years also trained on the
# `train_from` keyframe's drawing of the same boxes. -10000 reuses the -9000
# drawing, so it gets the same treatment.
# `fill = "biome4"`: the rule's gaps take the model's own biome instead of
# the calibration's (pipeline/__main__.py), in every keyframe.
# Ice: with `model_ice`, a gap hex where the model has land ice keeps it
# (else the calibration, which never predicts ice, decides). At -8000 the
# drawn Younger Dryas ice (800 hexes) gives way to the model's 10 ka ice
# (419 cells). At -9000 the drawn Allerød ice is kept (`keep`): the model's
# 11 ka ice covers the Finnmark coast and southern Finland and Norway, where
# 9 pollen anchors record vegetation, against 3 under the drawn ice, and it
# would put ice on the North Sea and the British Isles.
[[terrain.misdated]]
name = "Europe at -9000: QEN Allerød map (12,000-11,000 14C BP)"
years = [-9000]
train_from = -7000
keep = ["Water", "Ice"]
boxes = [
  [-12.0, 37.5, 66.5, 76.5],   # Europe, the Caucasus, northern Anatolia, Turan's north
  [-10.0, 35.9, -1.8, 37.5],   # southern Iberia (east of -1.8 the Algerian coast reaches 37°N)
  [11.5, 35.7, 19.0, 37.5],    # Sicily and Malta (Cap Bon, Tunisia, is at 11°E)
  [19.0, 34.5, 36.0, 37.5],    # Greece, Crete, Cyprus, southern Anatolia
]

[[terrain.misdated]]
name = "Europe at -8000: QEN Younger Dryas map (11,000-10,000 14C BP)"
years = [-8000]
train_from = -7000
model_ice = true
boxes = [
  [-12.0, 37.5, 66.5, 76.5],   # Europe, the Caucasus, northern Anatolia, Turan's north
  [-10.0, 35.9, -1.8, 37.5],   # southern Iberia (east of -1.8 the Algerian coast reaches 37°N)
  [11.5, 35.7, 19.0, 37.5],    # Sicily and Malta (Cap Bon, Tunisia, is at 11°E)
  [19.0, 34.5, 36.0, 37.5],    # Greece, Crete, Cyprus, southern Anatolia
]

# The Russian Plain, every drawn keyframe. The drawings here are coarse
# guesses: QEN's taiga runs over the Oka-Don and the Central Russian Upland
# to about 50°N at -7000 and drops QEN's forest-steppe band (no palette
# colour for it), and the -5000 drawing (by hand, not from a source map)
# puts Temperate Forest over the Trans-Volga steppe, so forest swept over
# the steppe between -6000 and -5000. No pollen-based forest-cover product
# can stand in east of about 35°E (Zanon et al. 2018 stops at 43°E;
# Githumbi et al. 2022 extrapolates 55-75% forest over the steppe from 0-2
# REVEALS cells east of 45°E). So the forest-steppe and steppe belt
# (46-55°N) is a gap in every keyframe, filled with BIOME4's own biome
# (`fill = "biome4"`), not the calibration: the calibration learns from
# drawings elsewhere that are as rough, and put taiga back over the
# Trans-Volga steppe (Ivanovka, the Middle Volga synthesis). North of 55°N
# the drawn taiga and mixed forest agree with the pollen and stay: gapping
# them too (to 62°N) lost 8 of 117 pollen slices, the model calling the
# northern taiga Temperate Forest and Lake Nero grassland. Anchors in
# 30-60°E, 46-62°N, this rule (with the edge noise, replace and ecotone
# below) against the drawn maps: pollen 102 vs 99 of 117 (held out 14 vs 14
# of 17), literature 15 vs 15 of 15. Middle Volga closed forest now grows
# 0 -> 15% over -10000..-3000, with Steppe-Forest at its edges, instead of
# jumping 7 -> 48% at -5500..-5000. The [[terrain.reinterpret]] Samara rules above
# fall inside the box and no longer do anything.
[[terrain.misdated]]
name = "Russian Plain: drawn keyframes are guesses"
years = [-9000, -8000, -7000, -6000, -5000]
keep = ["Water", "Ice"]
fill = "biome4"
boxes = [
  [30.0, 46.0, 60.0, 55.0],
]
# The edge against the drawn map wanders by up to about 1.5° on a 5° noise
# field instead of running along 55°N and 30°E.
edge_noise = { amplitude = 1.5, period = 5.0, seed = 11 }
# BIOME4 classes that don't belong on the plain: its Chaparral and Savannah
# patches on the dry southern steppe (the drawn-map rules above make the
# same swap).
replace = { Chaparral = "Grassland", Savannah = "Grassland" }
# Forest next to open land in the belt and one ring around it becomes
# Steppe-Forest: the forest-steppe BIOME4 has no class for, and a soft seam.
ecotone = "Steppe-Forest"

# The Carpathians and the Transylvanian uplands, every drawn keyframe, at or
# above 500 m. The drawings put Grassland over the Eastern Carpathians and
# the Moldavian uplands (25-26.7°E, 45.6-49°N, up to about 1,100 m; 14 drawn
# Grassland hexes above 400 m at -5000), while BIOME4 has forest there in
# every keyframe and the pollen anchors in the range show forest: emb:2080
# (1129 m) temperate forest or woodland throughout, emb:1693 (625 m) forest
# from -7000. The gap takes BIOME4's biome; the elevation limit makes the
# edge follow the contours, so the plains around (Wallachia, the Pannonian
# and Moldavian lowlands) keep their drawing.
# The Urals foreland north of the Kama (55-63°E, 57-64°N) at -6000: the
# drawing leaves it a gap and the calibration filled 44 hexes with Grassland
# in the middle of the taiga, appearing and vanishing between -7000 and
# -5000; BIOME4 has Boreal Forest on all of them, as the pollen at Mulianka
# (56.3°E, 57.8°N) and Zuratkul' record.
[[terrain.misdated]]
name = "Urals foreland: calibrated grassland"
years = [-6000]
keep = ["Water", "Ice"]
fill = "biome4"
boxes = [
  [55.0, 57.0, 63.5, 64.0],
]

[[terrain.misdated]]
name = "Carpathian uplands: drawn grassland"
years = [-9000, -8000, -7000, -6000, -5000]
keep = ["Water", "Ice"]
fill = "biome4"
min_elevation = 500.0
boxes = [
  [21.0, 44.3, 27.5, 49.5],
]
replace = { Chaparral = "Temperate Forest", Savannah = "Temperate Forest" }

# Drawn Water on hexes whose median elevation is above max_elevation, outside
# every lake box in data/lakes/lakes.toml and the `keep` boxes, is a drawing
# artefact (a coast a hex off, a one-key-frame flicker): it becomes a gap
# ("Land") filled from the climate model. A real palaeolake belongs in
# lakes.toml with a level curve and sources, which also brings it back here.
[terrain.high_water]
enabled = true
max_elevation = 200.0
keep = []

# Georeferenced keyframes: PNG + world file (.pgw).
[[terrain.sources]]
year = -9000
image = "raw/maps/composite/terrain_9000_bce_georeferenced_2.png"
world = "raw/maps/composite/terrain_9000_bce_georeferenced_2.pgw"

[[terrain.sources]]
year = -8000
image = "raw/maps/composite/terrain_8000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_8000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -7000
image = "raw/maps/composite/terrain_7000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_7000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -6000
image = "raw/maps/composite/terrain_6000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_6000_bce_georeferenced.pgw"

[[terrain.sources]]
year = -5000
image = "raw/maps/composite/terrain_5000_bce_georeferenced.png"
world = "raw/maps/composite/terrain_5000_bce_georeferenced.pgw"

# ---------------------------------------------------------------- mountains
# Mountains are a landform, not a biome. The keyframes' hand-drawn Mountains
# are biome gaps, filled like Land ([paleobiome]), and the landform comes from
# the elevation raster ([sea] elevation). A cell is mountain if it passes any band:
# at least `above` metres, and, where given, a slope of `slope` degrees or
# (`rugged`) more than `relief` metres of relief within `relief_radius` metres.
# Bands follow Kapos et al. 2000 (UNEP-WCMC mountain classes).
[mountains]
relief = 300.0
relief_radius = 7000.0
bands = [
  { above = 2500.0 },
  { above = 1500.0, slope = 2.0 },
  { above = 1000.0, slope = 5.0, rugged = true },
  { above = 300.0, rugged = true },
]
# Landform is static and separate from the biome (`landform` property,
# 0 flat, 1 hills, 2 mountains, 3 high mountains). A hex is mountains when at
# least `min_fraction` of its cells are mountain cells. That's below a half so
# that narrow ranges (Apennines, Pyrenees) stay connected. Mountains whose
# median is at or above `high_elevation` m are high mountains. Hills are hexes
# with at least `hills_fraction` mountain cells.
min_fraction = 0.4
hills_fraction = 0.15
high_elevation = 2000.0

# Mountain hexes whose growing season is too cold or short for trees are
# Alpine (above the treeline). After Paulsen & Körner 2014 (Alpine Botany
# 124:1-12): the season is the days with a mean above `season_min` degC, and
# trees need a season mean of `season_mean` degC over `season_days` days.
# Monthly means stand in for days. Model temperatures are moved to each hex's
# own elevation first ([paleobiome.lapse]).
[mountains.treeline]
season_min = 0.9
season_mean = 6.4
season_days = 94

# The board's peaks stand on a sketch of each hilly or mountain hex's high
# ground from the same raster (`elevation.massif`): its summits, the strike
# of its ridge, and whether it is a ridge, a lone cone (a volcano), a plateau
# or a knot of peaks. Windows in raster cells (2 arc-min), heights in metres,
# `separation` in hex-local units (a hex is about 2 across).
[mountains.massif]
peak_window = 3
min_prominence = 150.0
separation = 0.45
plateau_elevation = 900.0
plateau_relief = 450.0
cone_relief = 900.0
cone_coherence = 0.35
cone_ratio = 1.8
ridge_coherence = 0.3

# ---------------------------------------------------------------- sea level
[sea]
# ETOPO1 subset (2 arc-min), fetched by `make build/etopo.asc`.
elevation = "build/etopo.asc"
# Hexes deeper than this always count as open ocean (seeds the flood fill,
# along with below-sea-level hexes on the grid's edge).
seed_depth = -1500.0
# Global mean sea level (metres) by year. APPROXIMATE values read off the
# Lambeck et al. 2014 (PNAS 111:15296) GMSL curve, converted from BP
# (BCE = BP - 1950). Replace with tabulated values before trusting details.
# Ignores isostatic rebound here; the Baltic basin is handled with an
# uplift-corrected surface in the lakes stage ([isostasy]).
curve = [
  [-12050, -70.0],
  [-10050, -60.0],
  [-9050, -50.0],
  [-8050, -40.0],
  [-7050, -25.0],
  [-6050, -13.0],
  [-5050, -4.0],
  [-4050, -1.5],
  [-3050, -0.5],
  [1950, 0.0],
]

# Sea channels narrower than a hex that never closed: the hexes along each
# line count as open sea in every year, whatever their median elevation.
# Bab-el-Mandeb: the Red Sea stayed open to the Gulf of Aden through the last
# 400,000 years; at lowstand the channels south of the Hanish Sill were under
# 4-5 km wide (Lambeck et al. 2011, QSR 30:3542). Hex medians put the
# narrows at -30 to -55 m, so without this the strait is land until about
# 6,000 BCE and the Red Sea a lake. From the Gulf of Aden through the
# Perim narrows and past the Hanish Islands to the axial trough.
[[sea.channel]]
name = "Bab-el-Mandeb"
line = [[43.9, 12.4], [43.42, 12.62], [43.1, 13.1], [42.75, 13.7], [42.3, 14.3]]

# Gibraltar: 14 km wide at Tarifa, with a sill near -280 m (Camarinal), so
# open in every year. The hex over the narrows takes in the Tarifa coast and
# Jbel Musa and has a median of +4 m, so without this the Atlantic and the
# Mediterranean never met on the board (data/places/SOURCES.md).
[[sea.channel]]
name = "Gibraltar"
line = [[-6.3, 35.9], [-5.75, 35.98], [-5.35, 35.9], [-4.95, 36.05]]

# Dardanelles: 1.2-6 km wide, sill about -65 m today (about -85 m when the
# Mediterranean first came in). The Sea of Marmara turned marine about
# 12.55 cal ka (-10600, Çağatay et al.), before the board starts, so it is
# open in every year. From the Aegean off Kumkale past Çanakkale and
# Gelibolu into the Marmara, and on to its deep basin (to -1,270 m): the
# shelf hex between them has a median of -52 m, which at lowstand cut the
# basin off and left it drawn as land.
[[sea.channel]]
name = "Dardanelles"
line = [[25.85, 39.95], [26.2, 40.05], [26.4, 40.2], [26.67, 40.4], [27.1, 40.6], [27.5, 40.75], [28.0, 40.65], [28.4, 40.8]]

# Bosporus: under 1 km wide at its narrowest, sill about -35 m. Shut until
# the Mediterranean reached the Black Sea lake about 9.0 cal ka (-7050,
# Soulet et al. 2011), the year the black-sea entry in data/lakes/lakes.toml
# ends; a land bridge before. Whether the lake overflowed into the Marmara
# before then is contested, so no outflow river is drawn.
[[sea.channel]]
name = "Bosporus"
from = -7050
line = [[28.9, 40.75], [28.98, 41.02], [29.05, 41.2], [29.25, 41.35]]

# ------------------------------------------------------------ paleobiome
# The drawn keyframes have no biome (grey, "Land") over Arabia, Russia east of
# the Volga, Central Asia and the Iranian/Levantine uplands. Those hexes take
# modelled biomes from Beyer, Krapp & Manica 2020 (Sci. Data 7:236; HadCM3 +
# BIOME4, 0.5 degrees, 1000-year slices; CC BY 4.0). `make build/biome.npz`
# downloads the 1.3 GB NetCDF once and cuts it down with `python -m pipeline biome`.
# Biome cleanup (pipeline/biome_clean.py), applied to each keyframe after the
# model fills its gaps and before the years between are filled.
[biome.edges]
# Model-filled hexes take the biome at a smoothly displaced position, which
# breaks up the BIOME4 grid's straight rows and columns. One fixed field for
# all years, so the edges don't shimmer. apply_to: "model" or "all".
enabled = true
apply_to = "all"
seed = 7
# Displacement (hexes) and the noise wavelength (hexes). The noise sum has a
# median size of about 0.23, so the typical move is about a quarter of
# amplitude; at 1.2 straight edges near 57°N survived (finding F4, 2026-11-13).
amplitude = 1.8
period = 4.0

[biome.upland]
# The Irano-Anatolian uplands. The drawn maps leave them as Mountains (a gap),
# and the gap filling, never shown woodland in this climate, made them
# Chaparral, Savannah or Grassland. Pollen and charcoal records there (Nar,
# Hazar, Mirabad, Hashilan, Gölhisar, Zeribar, Van, Urmia, Abant, Yeniçağa)
# show steppe and forest-steppe until about -7000, then oak woodland where
# it is wet enough, and steppe where it is dry. A gap-filled hex in `box`
# at or above min_elevation (not Alpine) with a coldest month (BIO6, lapse-
# corrected) at or below max_coldest and annual precipitation (BIO12) of at
# least min_precip becomes Woodlands from woodland_from where precipitation
# reaches woodland_precip, else Steppe-Forest from forest_steppe_precip,
# else Grassland. The mild-winter test leaves the Lebanon and Aegean
# mountains Mediterranean. Thresholds fitted on the anchors that aren't held
# out (52 of 60 upland keyframe slices right); on the held-out ones the map
# went from 15 to 37 of 44.
enabled = true
box = [26.0, 30.0, 62.0, 43.5]
min_elevation = 700.0
max_coldest = -2.0
min_precip = 200.0
woodland_from = -7000
woodland_precip = 350.0
forest_steppe_precip = 225.0

[biome.forest_type]
# Boreal vs Temperate Forest from the model's climate, over the drawn and
# filled keyframes: Boreal where the coldest month's minimum (BIO6, lapse-
# corrected) is below boreal_coldest or the warmest quarter (BIO10) below
# boreal_warm; Temperate from temperate_coldest up; in between (the cool
# mixed forest of the Russian Plain and the Baltic) Temperate from
# mixed_from, once broadleaf trees had arrived, where the warmest quarter
# reaches mixed_warm, else Boreal. The mixed band: the pollen sites recording
# cool mixed forest in central Russia (Nero, Myshetskoe-Dolgoe, Kasplya,
# Balkashkinskii) sit at BIO6 -11..-15 and BIO10 17-19 °C in -6000..-4000;
# the boreal ones at the same winters (Onego, Glubokoe) at BIO10 about 15,
# and Mulianka (boreal at 6 ka) below -19. A single cut at -8 turned the
# whole mixed band Boreal (central Russia 0 Temperate hexes). At -16 the
# Middle Volga Upland (BIO6 -16..-17) flickered Boreal / Steppe-Forest from
# keyframe to keyframe against the regional synthesis (forest-steppe and
# broadleaf forest -6000..-3000); -18 keeps it in the mixed band. The drawn keyframes disagree with each other
# on where the boreal forest is (in 10°W-30°E, 40-56°N: 674 boreal hexes at
# -9000, 355 at -7000, 429 at -6000, 25 at -5000), and the fronts fill made
# that advance-and-collapse blotchy; the model's climate warms smoothly.
# Fitted on pollen slices biomised as cool conifer (CENF, must be Boreal) or
# temperate deciduous (TEDE, must be Temperate), cool mixed (CMIX) either,
# in 10°W-66°E, 42-66°N, not held out: 606 of 635. On the decisive slices it
# ties the drawn maps (training 221 of 250 either way; held out 96 vs 97 of
# 106). Woodlands, Steppe-Forest and open classes are left alone; the
# dry-lowland, cold-winter and broadleaf-lag rules below still apply.
enabled = true
box = [-10.0, 42.0, 66.0, 70.0]
boreal_coldest = -18.0
boreal_warm = 10.5
temperate_coldest = -8.0
mixed_from = -6500
mixed_warm = 18.0
# Boreal at and north of this latitude whatever the model's climate.
# Fennoscandia's Holocene forest stayed boreal with a broadleaf admixture:
# the Finnish pollen in -5000..-3000 is cool conifer or cool mixed forest,
# never temperate deciduous. The model's mild Bothnian coast (BIO6 above -8
# with summers of 11-12 °C) and its warm 5 ka summers in Finland (median
# BIO10 17.4, against 15.1 at 6 ka) had made 53, 12 and 145 Finnish forest
# hexes Temperate at -5000, -4000 and -3000. With mixed_warm 18 (from 16.5)
# and this cap: 2, 2 and 7; anchors training 710 -> 712, held out
# 325 -> 329. Requiring summer warmth or oceanic winters on the mild branch
# instead cost 14-50 training slices (Britain and Ireland's cool-summer
# temperate forest).
temperate_max_lat = 60.5

[biome.dry_lowland]
# Europe's dry, warm lowlands: a forest hex (drawn or filled) below
# max_elevation whose warmest quarter (BIO10) is at least min_warm becomes
# Steppe-Forest below steppe_forest_precip mm a year (BIO12), else Woodlands
# below woodland_precip. Fitted on the anchors that aren't held out, after
# adding literature anchors for the Great Hungarian Plain and Dobrogea, the
# dry central European basins and interior Iberia (data/terrain/SOURCES.md):
# training slices in -10..60°E, 36..56°N 709 -> 721 of 956; held out
# 325 -> 333 of 458, the Pannonian and Lower Danube plains 41 -> 49 of 64,
# no region worse. It doesn't reach the dry basins of Bohemia, Moravia and
# the Elbe-Saale (summers below min_warm in the model) or the Ebro and
# Teruel interior (above max_elevation), where the records show open
# woodland mostly before about -7500; those stay as drawn.
enabled = true
box = [-10.0, 36.0, 60.0, 56.0]
max_elevation = 300.0
min_warm = 20.0
steppe_forest_precip = 600.0
woodland_precip = 700.0
apply_to = ["Temperate Forest", "Boreal Forest", "Woodlands"]

[biome.cold_temperate]
# Temperate (broadleaf) Forest where the coldest month's minimum (BIO6,
# lapse-corrected) is below max_coldest becomes Steppe-Forest below
# steppe_forest_precip mm a year, else Boreal Forest. The gap fill put
# Temperate Forest on 241 hexes of central Russia at -10000 with BIO6 about
# -19 degC and summers about 18 degC: birch-pine and steppe country (broadleaf
# trees reach the plain only from about 9-8 ka), out of reach of
# [biome.dry_lowland]'s warm-summer test. On the anchors it is neutral
# (training 1005 of 1333 either way; held out 482 -> 483 of 663, 10°W-66°E,
# 36-64°N): few dated sites sit on those hexes, so the threshold rests on
# the climate argument; -18 degC (moved from -16 with [biome.forest_type]'s
# boreal_coldest, so the two agree) is colder than Moscow today.
enabled = true
box = [-10.0, 36.0, 66.0, 64.0]
max_coldest = -18.0
steppe_forest_precip = 600.0
# Plains only: in the Caucasus uplands the lapse-corrected winters pass the
# test but the records show broadleaf forest.
max_elevation = 600.0

[biome.broadleaf_lag]
# Broadleaf trees (oak, elm, lime, hazel) spread over the Russian Plain only
# from about 8.5-8 ka, after the climate allowed them: in the pollen there,
# central Russia is birch-pine forest and steppe until about -7000 (Lake Nero
# and Myshetskoe-Dolgoe conifer-dominated at -7500..-7000), and cool mixed
# forest from about -6500 (Myshetskoe, Kasplya, Staroselsky Moch, Nero,
# Balkashkinskii; Middle Volga synthesis: "first lime, elm, oak and hazel"
# in the early Atlantic). The climate model can't know a migration lag, so
# its Temperate Forest there before then (blocks at 32-38°E 53-56°N at
# -9000..-8000 and 40-47°E at -7000) becomes Steppe-Forest below
# steppe_forest_precip, else Boreal Forest. Two early slices biomise as
# temperate deciduous (Staroselsky Moch -10000..-9000, Myshetskoe
# -9000..-8500): birch-dominated spectra, a known biomisation artefact, and
# misses either way; no anchor hit is lost.
enabled = true
box = [30.0, 44.0, 66.0, 64.0]
until = -7000
steppe_forest_precip = 600.0
max_elevation = 600.0

# Time-limited corrections where the literature anchors (data/terrain/
# anchors_literature.csv, SOURCES.md) disagree with the map and no climate
# rule reaches: the model's summers there are too cool for
# [biome.dry_lowland], or the land is above its max_elevation. Keyframe
# years [first, last]; `from` defaults to every land biome.
#
# Dry central European basins (lower Ohře / Louny-Žatec, eastern Harz
# foreland and Elbe-Saale): Steppe-Forest in the early Holocene (Pokorný et
# al. 2015 at Zahájí and Suchý potok; Mania 1999); in Bohemia open woodland
# with steppe gaps through the Atlantic.
[[biome.override]]
name = "Bohemian and Elbe-Saale dry cores, early Holocene"
boxes = [[13.3, 50.2, 14.4, 50.6], [10.9, 51.3, 12.3, 52.1]]
years = [-10000, -8000]
from = ["Temperate Forest", "Boreal Forest", "Woodlands"]
to = "Steppe-Forest"
[[biome.override]]
name = "Bohemian dry core, Atlantic"
# Lower Ohře only: the Elbe-Saale records (Mania 1999) give Steppe-Forest or
# Temperate Forest for the Atlantic, which is contested; the map's forest
# stays there. The box keeps north of 50.2°N, off the upland margin
# (Rynholec, 407 m: pine forest throughout).
boxes = [[13.3, 50.2, 14.4, 50.6]]
years = [-7000, -5000]
from = ["Temperate Forest", "Boreal Forest"]
to = "Woodlands"
# Southern Moravia: REVEALS around Vracov (Kuneš et al. 2015) gives about
# 27% open land early and 12-20% through the Atlantic: open woodland.
[[biome.override]]
name = "Southern Moravia"
boxes = [[16.3, 48.6, 17.4, 49.2]]
years = [-10000, -5000]
from = ["Temperate Forest", "Boreal Forest"]
to = "Woodlands"
# Ebro lowland (Hoya del Castillo, Davis & Stevenson 2007): juniper, pine
# and Artemisia-chenopod steppe at -8500, open woodland at -8000, pine
# forest from -7500.
[[biome.override]]
name = "Ebro lowland, early Holocene"
boxes = [[-1.6, 41.0, 0.8, 42.2]]
max_elevation = 600.0
years = [-10000, -9000]
from = ["Temperate Forest", "Boreal Forest", "Woodlands"]
to = "Steppe-Forest"
[[biome.override]]
name = "Ebro lowland, -8000"
boxes = [[-1.6, 41.0, 0.8, 42.2]]
max_elevation = 600.0
years = [-8000, -8000]
from = ["Temperate Forest", "Boreal Forest"]
to = "Woodlands"
# Teruel interior (Villarquemado, Aranbarri et al. 2014): "pinewoods and
# steppe" until about 7780 cal BP, then evergreen-oak woodland.
[[biome.override]]
name = "Teruel interior (Jiloca)"
boxes = [[-1.9, 40.2, -0.9, 41.0]]
years = [-10000, -6000]
from = ["Temperate Forest", "Boreal Forest"]
to = "Woodlands"
# Almería coast (San Rafael, Pantaleón-Cano et al. 2003): no significant
# forest in the Holocene; steppe or semi-desert until about -6000,
# sclerophyll maquis about -5500 to -3500, steppe again by -3000.
[[biome.override]]
name = "Almería coast, steppe phases"
boxes = [[-3.1, 36.6, -1.6, 37.5]]
max_elevation = 800.0
years = [-10000, -6000]
to = "Semi-Desert"
[[biome.override]]
name = "Almería coast, maquis"
boxes = [[-3.1, 36.6, -1.6, 37.5]]
max_elevation = 800.0
years = [-5000, -4000]
to = "Chaparral"
[[biome.override]]
name = "Almería coast, late steppe"
boxes = [[-3.1, 36.6, -1.6, 37.5]]
max_elevation = 800.0
years = [-3000, -3000]
to = "Semi-Desert"

[biome.adjacency]
# Pairs that should never share an edge, and the biome put between them
# (on the model-filled side, else the less established one). Water, Ice and
# Alpine are never changed. Also run on every year between keyframes.
enabled = true
max_passes = 8
forbid = [
  ["Extreme Desert", "Boreal Forest", "Steppe-Forest"],
  ["Extreme Desert", "Temperate Forest", "Grassland"],
  ["Extreme Desert", "Tropical Forest", "Savannah"],
  ["Tropical Forest", "Tundra", "Woodlands"],
  ["Tropical Forest", "Boreal Forest", "Temperate Forest"],
  ["Ice", "Tropical Forest", "Tundra"],
  ["Ice", "Savannah", "Tundra"],
  ["Tundra", "Savannah", "Grassland"],
  ["Savannah", "Boreal Forest", "Steppe-Forest"],
]

[paleobiome]
source = "build/LateQuaternary_Environment.nc"
url = "https://ndownloader.figshare.com/files/22659026"
data = "build/biome.npz"
box = [-17.5, 5.5, 67.0, 76.5]  # lon0, lat0, lon1, lat1
bp_min = 4000
bp_max = 13000
# Extra keyframes outside the drawn range (-9000..-5000): the nearest drawn
# map, with its Land hexes taking that year's modelled biome.
extend_keyframes = [-10000, -4000, -3000]
# Codes that aren't vegetation; hexes fall back to neighbours instead.
ignore_codes = [0]
# Drawn classes that are biome gaps, filled from the model: unlabelled land,
# and the drawn Mountains (a landform: the maps give no biome under them).
gaps = ["Land", "Mountains"]
# Monthly climatologies (t, month, lat, lon) for the Köppen classification.
monthly_vars = ["temperature", "precipitation"]

# The model climate is for each 0.5-degree cell at its mean land elevation;
# a hex's temperatures (BIO1/5/6/8/9/10/11 and monthly means, for the
# calibration and the treeline) are moved to the hex's median elevation at
# `rate` degC per metre (the standard environmental lapse rate). Precipitation
# is left as it is.
[paleobiome.lapse]
enabled = true
rate = 0.0065

# The model is drier than the drawn maps (HadCM3 underplays the Holocene
# monsoon), so its biomes alone leave Arabia desert beside a green Sahara.
# Calibration learns the drawn maps' biome from the model's own climate on the
# hexes both cover (k nearest neighbours in standardised climate space), then
# applies that to the gaps; the model's wet bias cancels because both sides
# use the same model climate. Years with no drawn map use the nearest drawn
# map's relation with their own climate. A gap hex keeps the model's biome
# when its climate is far from every drawn hex: its mean distance to its k
# nearest is over `max_distance_factor` times the `max_distance_quantile`
# of drawn hexes' own. At 2.5 that keeps the model in the cold deserts of
# Turan and the far north-east, which have no counterpart in the hot Sahara,
# and calibrates Arabia, Iran and the Volga, whose climates the drawn maps span.
[paleobiome.calibrate]
enabled = true
k = 15
max_distance_quantile = 0.99
max_distance_factor = 2.5
# Spatial cross-validation tile size for the report's accuracy figure.
block_degrees = 10.0
# Only drawn hexes within max_km vote (0 = off). Tried at 1000-2500 km to
# stop the Zagros and eastern Anatolia (drawn as Mountains, a gap) borrowing
# Chaparral from Iberia and the Maghreb. Off: on the held-out literature
# anchors it made things worse (10 of 31 keyframe slices right -> 7-8), since
# nearby drawn hexes offer Grassland, not the oak woodland the records show,
# and the Egyptian and Yemeni deserts lost good examples.
max_km = 0
# Add the literature anchors (data/terrain/anchors_literature.csv, those not
# held out by [anchors] holdout) to the training, each slice on a keyframe
# year anchor_weight times. It corrects the map at and around those sites
# (27 -> 46 of 57 keyframe slices) but does not carry to other sites (held
# out: 10 of 31 either way), so it is a local correction, and only the held-
# out anchors measure the map.
use_literature = true
anchor_weight = 5
features = [
  ["BIO1", "linear"],   # annual mean temperature
  ["BIO6", "linear"],   # min temperature of coldest month
  ["BIO10", "linear"],  # mean temperature of warmest quarter
  ["BIO12", "log"],     # annual precipitation
  ["BIO18", "log"],     # precipitation of warmest quarter (summer drought)
]

# BIOME4 code -> terrain class.
[paleobiome.classes]
"1" = "Tropical Forest"    # tropical evergreen forest
"2" = "Tropical Forest"    # tropical semi-deciduous forest
"3" = "Woodlands"          # tropical deciduous forest/woodland
"4" = "Temperate Forest"   # temperate deciduous forest
"5" = "Temperate Forest"   # temperate conifer forest
"6" = "Temperate Forest"   # warm mixed forest
"7" = "Temperate Forest"   # cool mixed forest
"8" = "Boreal Forest"      # cool conifer forest
"9" = "Boreal Forest"      # cold mixed forest
"10" = "Boreal Forest"     # evergreen taiga/montane forest
"11" = "Boreal Forest"     # deciduous taiga/montane forest
"12" = "Savannah"          # tropical savanna
"13" = "Semi-Desert"       # tropical xerophytic shrubland
"14" = "Semi-Desert"       # temperate xerophytic shrubland
"15" = "Chaparral"         # temperate sclerophyll woodland
"16" = "Woodlands"         # temperate broadleaved savanna
"17" = "Woodlands"         # open conifer woodland
"18" = "Steppe-Forest"     # boreal parkland
"19" = "Savannah"          # tropical grassland
"20" = "Grassland"         # temperate grassland
"21" = "Extreme Desert"    # desert
"22" = "Tundra"            # steppe tundra
"23" = "Tundra"            # shrub tundra
"24" = "Tundra"            # dwarf shrub tundra
"25" = "Tundra"            # prostrate shrub tundra
"26" = "Tundra"            # cushion forbs, lichen and moss
"27" = "Extreme Desert"    # barren
"28" = "Ice"               # land ice

# ----------------------------------------------------------------- islands
# Islands smaller than a hex or two lose the Water majority vote and vanish
# (pipeline/islands.py). Per frame, a hex's land fraction is the share of its
# ETOPO1 cells above that frame's sea or modelled-lake level (uplift-
# corrected). A landmass of hexes with any land, at most max_hexes big and
# with at least min_area_km2 of land, keeps max(1, round(area / hex area))
# land hexes: its Water hexes with the most land (at least
# min_hex_fraction) become land, best first. Lake levels count only inside
# that year's modelled shoreline.
[islands]
enabled = true
# Drawn Water on a hex at least this much land at the frame's water level,
# outside every lake, is a coast drawn a hex off: it becomes land.
restore_majority_land = 0.5
# 0.1 keeps Bornholm and Menorca apart from Scania and Mallorca.
min_any_fraction = 0.1
min_area_km2 = 150.0
min_hex_fraction = 0.1
max_hexes = 60
# Second pass on the ETOPO1 cells for islands that the hex grouping joins to
# the mainland through a shared coastal hex (Dahlak, Farasan): see
# pipeline/islands.py.
near_shore = true
# Islands the report tracks (land hexes centred in the box per 1000 years).
watch = [
  ["Gotland", [18.1, 56.9, 19.4, 58.0]],
  ["Bornholm", [14.6, 54.95, 15.2, 55.3]],
  ["Mallorca", [2.3, 39.25, 3.5, 40.0]],
  ["Menorca", [3.8, 39.8, 4.35, 40.1]],
  ["Malta", [14.15, 35.8, 14.6, 36.1]],
  ["Crete", [23.5, 34.9, 26.3, 35.7]],
  ["Cyprus", [32.2, 34.5, 34.6, 35.7]],
  ["Orkney", [-3.5, 58.7, -2.3, 59.4]],
  ["Corsica", [8.5, 41.3, 9.6, 43.1]],
  ["Sardinia", [8.1, 38.8, 9.9, 41.3]],
  # Near-shore archipelagos joined to the mainland landmass through coastal
  # hexes, so keep_islands skips them (data/places/plans/dahlak.toml).
  ["Dahlak", [39.8, 15.4, 40.5, 16.0]],
  ["Farasan", [41.6, 16.4, 42.3, 17.0]],
]

# ------------------------------------------------------------ settled land
# Settlements arrive on land and leave only when the water really reaches
# them. A settlement's hex stays land (its own pre-water biome, else its land
# neighbours') in any frame the map has it Water while the site's ground is
# above the water: the highest ETOPO1 cell within site_radius cells, less
# glacio-isostatic uplift still to come ([isostasy]), against the level of a
# modelled lake whose box holds it, else global sea level ([sea] curve). The
# first frame the ground is below ends the occupation phase (`drowned`).
# Sites starting on Water with no land neighbour are left alone and listed
# in the report. `make maps` converts `out`, not data/settlements.
[settled_land]
enabled = true
min_land_neighbours = 1
site_radius = 1
# Hand corrections to settlement positions, applied first (pipeline/coords.py),
# and the coordinate audit written after the map is final.
corrections = "data/settlements/corrections.toml"
audit = "data/settlements/coordinate_audit.csv"
audit_deep_m = 50.0
audit_far_km = 25.0
# A shore site is within metres of the water, closer than the sea, lake and
# uplift models are good: the depth they give at a phase's start (when the
# site was dry) is their error there. Water must rise this much more than
# that to end the phase.
drown_margin = 3.0
# A site on a hex next to open sea (but not in it) is exposed to the sea
# only if its ground is within this of sea level; deeper, it is a basin
# behind higher ground (the Jordan Valley beside a coastal hex).
coast_cap = 20.0
# A site that starts on a Water hex with no land neighbour but whose own
# ground is above the water is on an islet too small for the grid (Youra,
# Scilly): its hex is kept land like a mis-drawn shore.
islets = true
out = "build/settlements.geojson"

# ---------------------------------------------------------------- inferred
# Inferred settlements (`python -m pipeline inferred`, pipeline/inferred.py):
# the place plans' settlement speculation as points, for the app only
# (neolith-convert --inferred). Needs `make maps` (the built map and
# build/settlements.geojson, whose sites clear inferred ones from their hex).
[inferred]
rules = "data/settlements/inferred.toml"
rivers = "data/rivers/rivers.toml"
out = "data/settlements/inferred.geojson"

# ----------------------------------------------------------------- anchors
# Natural-history anchor records for checking the biome maps
# (`python -m pipeline anchors`, pipeline/anchors.py). Method and sources in
# data/terrain/SOURCES.md; output in out_dir. Needs `python -m isostyle pollen`
# (the Neotoma level list) and `make maps` (build/combined_map.geojson) first.
[anchors]
cache = "build/anchors"
out_dir = "data/terrain"
neotoma_levels = "build/isostyle/pollen/levels.csv.gz"
# Harrison 2017, BIOME 6000 DB classified plotfile v1 (CC BY 4.0).
biome6000_url = "https://researchdata.reading.ac.uk/99/1/BIOME%206000%20DB%20classified%20plotfile_v1.csv"
# Harrison, Marinova & Cruz-Silva 2021, EMBSeCBIO pollen database (CC BY 4.0).
embsecbio_url = "https://researchdata.reading.ac.uk/309/10/EMBSeCBIO_pollen_DB.zip"
# Cruz-Silva et al. 2022 code and data, pinned to a commit.
cruzsilva_url = "https://raw.githubusercontent.com/esmeraldacs/Intra_biome_variation_method/28949b77fb0e63035d6b80a5eadea1b3e868e30a"
# A record qualifies if its levels span this share of [time] start..end,
# leave no gap longer than max_gap years, and number at least min_levels.
min_coverage = 0.8
max_gap = 1000
min_levels = 15
# Ranking: coverage x min(1, levels / full_levels) x min(1, good_gap / gap)
# x basin weight. Basin size (EMBSeCBIO codes) stands in for pollen-source
# area: big lakes see the region, small bogs their own shore.
full_levels = 30
good_gap = 500
# Two records closer than this (degrees) are the same site or core.
dedupe_degrees = 0.05
# Records within this many km whose names share a word (other than "lake",
# "core"...) are one site: Lake Van's three cores, Lake Urmia's two.
same_site_km = 50.0
# Thinning: keep the best per_cell records in each cell_degrees cell.
cell_degrees = 5.0
per_cell = 2
# A cell with this many land hexes and no anchor is a gap.
min_land_hexes = 20
# Biome labels every slice_step years over [time], from samples within
# slice_half_window years of the slice.
slice_step = 500
slice_half_window = 250
# A BIOME 6000 site this close (degrees) to an anchor gives its 6 ka label.
biome6000_match_degrees = 0.06
# Cruz-Silva et al. 2022's epsilon in the dissimilarity index.
epsilon = 0.5
# Neotoma levels with less of their pollen and spores harmonised to the
# training taxa than this are dropped.
min_mapped = 0.7
# Anchors whose id's crc32 is 0 mod holdout are held out from tuning.
holdout = 3
# Inside the EMBSeCBIO box (the game's core region) keep more per cell.
per_cell_core = 4
# An anchor with no land hex centre within this (degrees) is off the grid.
off_grid_degrees = 0.6
# Biomised labels need modern training samples nearby: the method has no
# biomes for, e.g., tropical Africa. Farther than this, only published
# labels count.
domain_km = 300.0
# Samples mostly made of the core site's own mire say little about the
# region (Hawks Tor: 62% Cyperaceae at -3800): left out of the labels.
local_taxa = ["Cyperaceae"]
max_local_share = 40.0
# Hand-entered anchors from the literature, for the gap cells.
literature = "data/terrain/anchors_literature.csv"
# Known-bad labels: what = "published", "biomised" or "all".
# Positions the source database has wrong, replaced before anything reads
# them (the database's own is kept on the candidate as `filed_at`). Each has a
# `source` link, listed in data/terrain/SOURCES.md.
# Avrig 1: EMBSeCBIO has longitude = latitude = 45.716 (a point in Kalmykia);
# the Avrig bogs are in southern Transylvania at 45°43'N, 24°23'E, 400 m.
[[anchors.override]]
id = "emb:1686"
lon = 24.3833
lat = 45.7167
source = "https://doi.org/10.1002/jqs.937"

[[anchors.exclude]]
name = "Hawks Tor"
what = "all"
reason = "a small upland mire whose pollen is mostly its own sedges (62% Cyperaceae at -3800); BIOME 6000's 6 ka 'tundra' disagrees with the three other SW England sites (temperate deciduous forest)"
[[anchors.exclude]]
name = "Tigalmamine"
what = "biomised"
reason = "evergreen-oak and grass assemblages (Quercus evergreen 32-42%) are read as xeric shrubland; the published 6 ka label is warm-temperate evergreen forest"

[anchors.basin_weight]
VELG = 1.0
LARG = 1.0
MEDI = 0.8
SMAL = 0.5
VESM = 0.5
NOTA = 0.7
unknown = 0.7

[anchors.classes]
# Cruz-Silva et al. 2022 biome -> compatible game classes, best first.
# Follows [paleobiome.classes] for the nearest BIOME4 biome.
TUND = ["Tundra", "Alpine"]
DESE = ["Semi-Desert", "Extreme Desert"]          # pollen "desert": sparse Amaranthaceae/Artemisia
GRAM = ["Grassland", "Steppe-Forest"]              # graminoids with forbs: steppe
XSHB = ["Semi-Desert", "Grassland"]                # xeric shrubland (BIOME4 14)
ENWD = ["Woodlands", "Steppe-Forest"]              # evergreen needleleaf woodland (BIOME4 17)
WTSFS = ["Chaparral", "Woodlands", "Temperate Forest"]  # Mediterranean evergreen forest (BIOME4 15)
CENF = ["Boreal Forest"]
CMIX = ["Temperate Forest", "Boreal Forest"]       # cool mixed (BIOME4 7)
TEDE = ["Temperate Forest", "Woodlands"]           # temperate deciduous (BIOME4 4)

# ------------------------------------------------------------------ Köppen
# Köppen-Geiger per key frame (Beck et al. 2018 rules) from the monthly
# Beyer et al. 2020 temperature/precipitation in build/biome.npz; "legacy"
# copies the committed epoch files' modern Köppen instead. Water hexes are
# Ocean each year; exposed shelf takes its land neighbours' class.
[koeppen]
source = "beyer2020"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# Terrain classes with a fixed climate.
force = { Ice = "EF" }
# Classify each hex's own mean monthly climate with its temperatures moved
# to the hex's median elevation ([paleobiome.lapse]), instead of taking the
# majority class of the 0.5-degree model cells. The 0 BP validation uses
# the same method.
lapse = true

# Each key frame is the modern (0 BP) climatology plus the model anomaly,
# averaged over `months` (circular, odd) and +-`slices` neighbouring 1 ka
# slices. Unsmoothed, single-month noise in the anomalies (0 mm Julys in
# Karelia) turns ~1,400 boreal cells summer-dry (Ds); smoothed, the classes
# converge steadily on modern. months = 1, slices = 0 uses the raw slice.
[koeppen.smooth]
months = 3
slices = 1

# HadCM3 is too dry over the Holocene Sahara and Arabia (see
# [paleobiome.calibrate]). Hexes whose terrain that year (drawn, or
# calibrated to the drawn maps) is wetter than their modelled climate step
# up BW -> BS -> the classifier's non-arid class: "BS" = at least steppe,
# "humid" = not arid. Never makes a hex drier.
[koeppen.nudge]
enabled = true
[koeppen.nudge.wanted]
"Semi-Desert" = "BS"
"Grassland" = "BS"
"Savannah" = "BS"
"Chaparral" = "BS"
"Steppe-Forest" = "BS"
"Woodlands" = "humid"
"Tropical Forest" = "humid"
"Temperate Forest" = "humid"
"Boreal Forest" = "humid"

# --------------------------------------------------- legacy-only properties
# No rasters for these yet: read them from the committed per-epoch files.
[legacy]
dir = "data/legacy"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]

# ------------------------------------------------------------ productivity
# Net primary productivity per hex per key frame, by the Miami model (Lieth
# 1973) from annual mean temperature and annual precipitation: the lower of
# 3000 / (1 + exp(1.315 - 0.119 T)) and 3000 (1 - exp(-0.000664 P)), in grams
# of dry matter per m² per year. This is the productivity the forager-density
# model was fitted on (Tallavaara et al. 2018; data/population/SOURCES.md),
# so it is what the hexes carry, not the climate model's own `npp`.
# Temperature is moved to the hex's elevation ([paleobiome.lapse]). After
# changing the variables, delete build/biome.npz so it is cut again.
[productivity]
enabled = true
temperature = "BIO1"     # annual mean temperature, degC
precipitation = "BIO12"  # annual precipitation, mm
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# Stored to the nearest `round` g/m²/yr.
round = 10
# Hexes with no model land cell nearby (shelf the lower sea exposed) take
# their neighbours' mean, this many rings out. The rest are open sea: 0.
fill_rings = 3

# ---------------------------------------------------------------- edge sea
# Km from each hex to the nearest open sea beyond the map's edge, per key
# frame (hex property `edge_sea_km`; pipeline/edge_sea.py). The app takes the
# nearer of this and the map's own Water as a hex's distance to water, so a
# coast that lies off the map (the Gulf of Guinea, the Atlantic off Senegal)
# still counts for forager density. Sea level is [sea] curve.
[edge_sea]
enabled = true
# ETOPO1 at 6 arc-min, 12 degrees wider than the map on every side, fetched
# by `make build/etopo_wide.asc`.
elevation = "build/etopo_wide.asc"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# Further than this is stored as none (65535): the forager model's shore
# factor is flat beyond it (MAX_SHORE_KM in neolith-rs/crates/core/src/forager.rs).
max_km = 2000.0

# ---------------------------------------------------------------- farming
# The year farming reaches each hex (static hex property `farming`): one
# origin, one speed, shortest path over land (pipeline/farming.py). The
# model and its three numbers are Pinhasi, Fort & Ammerman 2005
# (doi:10.1371/journal.pbio.0030410); none is fitted to this project's sites.
# Whether a hex can then be farmed is decided in the app, per year.
[farming]
enabled = true
# Çayönü: their best-correlated origin for shortest-path distances.
origin = [39.73, 38.22]
# Their origin date is 10,000-11,500 cal BP (8050-9550 BCE); the midpoint.
start = -8800
# Their calibrated shortest-path speed is 0.7-1.1 km/yr; the midpoint.
speed_km_per_year = 0.9
# Land hexes this close are linked across whatever lies between, so the
# front crosses straits and reaches near islands (Cyprus, Britain, Sicily).
# They allow "some sea travel" but no long voyages and give no distance;
# 100 km is this project's choice.
sea_reach_km = 100.0

# -------------------------------------------------------------- residuals
# `make residuals`: where the site list falls short of expected population,
# and why (pipeline/residuals.py; data/population/SOURCES.md). Outputs are
# residuals only and never feed expected population.
[residuals]
# Expected population per hex and year, written by `neolith-convert --expected`.
expected = "build/population/expected.csv"
years = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
# A site counts for an epoch if it was occupied within this many years of it.
half_window = 500
# Presence near water for foragers: ln factor = a + b ln(km to water + 10),
# flat beyond max_shore_km. These are the forager model's own numbers
# (`shore_factor` in neolith-rs/crates/core/src/forager.rs, fitted to
# ethnographic groups); a test keeps the two copies the same.
shore_factor = [2.1279, -0.4024]
max_shore_km = 2000.0
# Research effort: dated records younger than this many radiocarbon years
# (about 2800 BCE), smoothed over effort_sigma_km. Later than the period, so
# they show where archaeologists work without counting the sites being judged.
background_max_bp = 4200
effort_sigma_km = 100
# "Nothing hiding the sites" puts every hex at least at this quantile of effort.
effort_quantile = 0.9
# A hex that is land at the epoch and Water at this year counts as drowned.
today = -3000
# SoilGrids pH layers (fetched by isostyle); below acid_ph bone does not last.
soil_dir = "build/isostyle/sources"
acid_ph = 5.5
# A hex-epoch is short when at least min_missing sites are missing and the
# known sites are no more than 1/ratio of those expected; the mirror image
# is "more sites than expected".
min_missing = 1.0
ratio = 2.0
map_bins = [0.5, 1, 2, 5, 10]
out = "data/population/residuals.csv.gz"
summary = "data/population/residuals.json"
maps = "data/population/maps"

# Grey level -> people/km². From scripts/convert_population_density.py, with
# 199 and 215 swapped so density rises with grey level (SPEC defect 15).
[legacy.population_lookup]
"0" = 0.0
"23" = 0.0
"31" = 0.0
"39" = 0.0
"63" = 0.0
"127" = 0.1
"151" = 0.3
"175" = 0.5
"183" = 0.8
"199" = 1.0
"215" = 1.5
"231" = 2.0
"247" = 5.0

# ------------------------------------------------------------ settlements
# `make settlements`: dated sites from XRONOS (xronos.ch), calibrated with
# IntCal20. A site needs at least one date inside [time] start..end.
[settlements]
out = "data/settlements/settlements.geojson"
# Hand entries; their properties override the dated site named by `match`,
# else the nearest within merge_km. A null geometry takes that site's.
# Besides name/founding/population they may set `features` (a list of notable
# features, e.g. ["rock art", "megalithic tomb"]) and `wikipedia` (an English
# article title); the app shows both in the settlement popup.
curated = "data/settlements/curated.geojson"
merge_km = 5.0
# Hand fixes to the dated records before they are grouped into sites:
# positions for records filed with none, and spellings of one site.
records = "data/settlements/records.toml"
raw_dir = "build/settlements"
curve_url = "https://intcal.org/curves/intcal20.14c"
# Dates with a larger 1-sigma error (14C years) are ignored.
max_std = 200
min_dates = 1
# founding/abandoned are this quantile (and 1 minus it) of a site's dates, so
# stray dates at well-dated sites are ignored. Below 1/trim dates: min/max.
trim = 0.05
# Years without a date after which a site is assumed abandoned. Dates further
# apart than this also split a site into separate occupation phases (e.g. a
# tell resettled after a hiatus). Each phase runs from its first date to its
# last date + abandon_after. 0 = sites never end.
abandon_after = 1000
# Entries this close whose names differ only by extra words are one site.
same_km = 1.0
# Entries with the same name (ignoring case, accents, punctuation) this close
# are one site filed at differing coordinates.
same_name_km = 10.0
# Entries this close that hold the same measurements (lab number, or age and
# error) are one site whatever their names: at least two shared dates and half
# of the smaller entry's, or the one date of a one-date entry by lab number
# ("Aswad" / "Tell Aswad", "Troia" / "Troy"). 0 turns the rule off.
share_km = 10.0
# XRONOS dates taken from p3k14c's Vermeersch2019 rows, whose names are often
# an alphabetical neighbour's, are dropped when p3k14c has the same date more
# than this far from where XRONOS filed it (by name, at a namesake: Lake
# Lacha's GIN-4858 in Italy as 'Peschio Ranaro'). settlements.drop_shifted.
# records.toml [[refile]] puts back the ones we can place. 0 = off.
p3k14c_km = 50.0

# SOURCES.md lists original references behind at least this many dates.
min_refs_listed = 200

# Piece size for sites without a population figure (settlements.score_sites).
# importance = class of the site type + 1 for a long total occupation and
# + 1 for many dates, each judged against the site's own neighbourhood since
# both grow with research effort. Never from references or sources.
[settlements.importance]
min_span = 1000          # total occupied years must exceed one phase (abandon_after)
persist_top = 0.75       # and beat this share of neighbours
local_km = 150           # neighbourhood for both local tests
local_top = 0.9          # share of neighbours with fewer dates
local_min_dates = 5      # and at least this many dates of its own

# Keywords matched inside the normalised site type; the highest class wins.
[settlements.importance.class]
default = 1
3 = ["tell", "enclosure", "hillfort", "fortified", "entrenched", "pile-dwelling", "pfahlbau", "henge", "crannog"]
2 = ["settlement", "habitation", "house", "hut", "structure", "village", "roundhouse", "dwelling"]
1 = ["site", "open air", "camp", "cave", "rock shelter", "shell midden", "midden", "abri", "terrace"]
0 = ["pit", "hearth", "kiln", "well", "ditch", "find spot", "boat", "togher", "post-hole", "stake-hole",
     "burnt mound", "burnt spread", "spread", "oven", "mine", "quarry", "gully", "yoke", "plough", "wood",
     "lake core", "peat", "sediment", "alluvium", "bog", "inhumation", "cremation", "pyre"]

# Research effort per hex (settlements.survey_intensity): every dated record
# of any period and site type, smoothed. A detection model only; never an
# input to expected population density. Levels: below `thin` records per
# 10,000 km² = 0 (absence uninformative), below `well` = 1, else 2.
[settlements.survey]
out = "data/settlements/survey.csv.gz"
sigma_km = 100
thin = 5
well = 25

# Extra date tables, read in this order after XRONOS. A date whose lab number
# is already in hand is skipped, so these only add what XRONOS lacks.
# `columns` maps our fields to the table's headers; `refs` columns are kept
# as each date's references.
[[settlements.tables]]
name = "p3k14c"
url = "https://raw.githubusercontent.com/people3k/p3k14c/refs/tags/2025.07/inst/p3k14c_scrubbed_fuzzed.csv"
file = "p3k14c_2025.07.csv"
columns = { labnr = "LabID", bp = "Age", std = "Error", lon = "Long", lat = "Lat", site = "SiteName", period = "Period", refs = ["Source", "Reference"] }

[[settlements.tables]]
name = "neonet"
url = "https://digitallib.unipi.it/fedora/objects/mag:2814/datastreams/MMb714bbfacf4af2ce1fd7025e3789a99b/content"
file = "neonet_med_v2.tsv"
delimiter = "\t"
columns = { labnr = "LabCode", bp = "C14Age", std = "C14SD", lon = "Longitude", lat = "Latitude", site = "SiteName", period = "Period", refs = ["bib", "bib_url"] }

[[settlements.tables]]
name = "neonetatl"
url = "https://digitallib.unipi.it/fedora/objects/mag:2627/datastreams/MM54ff3698c0ea78b77469ce6462c2ca36/content"
file = "neonet_atl_v1.tsv"
delimiter = "\t"
columns = { labnr = "LabCode", bp = "C14Age", std = "C14SD", lon = "Longitude", lat = "Latitude", site = "SiteName", period = "Period", refs = ["bib", "bib_url"] }

# Tables tracked in the repository (`path`, read in place). Each row gives its
# source, page or table, and a positional-precision note; `approximate` marks
# positions read off a map or put at a locality. `keep_types`: their burial
# and cemetery sites are kept despite [settlements.xronos] exclude_types.
# test_local_tables.py checks them.
[[settlements.tables]]
name = "aadr"
url = "https://dataverse.harvard.edu/api/access/datafile/13994515"
path = "data/settlements/aadr_dates.csv"
keep_types = true
columns = { labnr = "labnr", bp = "bp", std = "std", lon = "lon", lat = "lat", site = "site", type = "type", period = "period", refs = ["refs"] }

[[settlements.tables]]
name = "literature"
url = "data/settlements/literature_dates.csv"
path = "data/settlements/literature_dates.csv"
keep_types = true
columns = { labnr = "labnr", bp = "bp", std = "std", lon = "lon", lat = "lat", site = "site", type = "type", period = "period", refs = ["refs"] }

[settlements.citations.aadr]
title = "Allen Ancient DNA Resource (AADR) v66.p1, 1240K annotation"
citation = "Mallick, S. et al., 2024. The Allen Ancient DNA Resource (AADR): a curated compendium of ancient human genomes. Scientific Data. Data: Harvard Dataverse, https://dataverse.harvard.edu/api/access/datafile/13994515. Each date also cites the genetics paper that published the individual."
licence = "CC0 1.0"
url = "https://dataverse.harvard.edu/api/access/datafile/13994515"
note = "`data/settlements/aadr_dates.csv`: the direct radiocarbon dates (conventional age, error and lab number in the 'Full Date' column; each date of an R_combine separately) of individuals from Russia in the map window, 11,500-4,400 BP, at AADR's locality coordinates. Burial sites; human bone, so riverine and lake populations may carry a freshwater reservoir offset. Contextual (non-radiocarbon) dates are not used."

[settlements.citations.literature]
title = "Radiocarbon dates transcribed from papers"
citation = "`data/settlements/literature_dates.csv` in this repository, transcribed from: Zaitseva, G.I. et al. 2000, Radiocarbon and Archaeology 1:33-52 (https://old.archeo.ru/izdaniya-1/vagnejshije-izdanija/pdf/2000Radiocarbon.pdf); Zaretskaya, N.E. et al. 2005, Geochronometria 24:117-131 (http://www.geochronometria.pl/pdf/geo_24/Geo24_16.pdf); Zaretskaya, N.E. et al. 2012, Radiocarbon 54(3-4):783-794 (https://resolve.cambridge.org/core/services/aop-cambridge-core/content/view/F3D2E5D73C3850C8E41225E739698432/S0033822200047433a.pdf/radiocarbon-chronology-of-the-shigir-and-gorbunovo-archaeological-bog-sites-middle-urals-russia.pdf); Tsybrij, A. et al. 2017, Documenta Praehistorica 44:204-223 (https://doi.org/10.4312/dp.44.13); Kulkova, M.A. et al. 2019, Documenta Praehistorica 46:376-387 (https://doi.org/10.4312/dp.46.23); Lychagina, E. & Vybornov, A. 2017, Documenta Praehistorica 44 (https://doi.org/10.4312/dp.44.9); Tarasov, A. et al. 2017, Documenta Praehistorica 44:98-121 (https://doi.org/10.4312/dp.44.7); Seitsonen, O. et al. 2012, Geochronometria 39(2):101-121 (https://doi.org/10.2478/s13386-012-0002-9); Tribolo, C. et al. 2017, PLoS ONE 12(1):e0169418 (https://doi.org/10.1371/journal.pone.0169418; Goda Buticha, Table 1, placed from https://www.mindat.org/loc-417079.html); Vybornov, A. et al. 2013, Documenta Praehistorica 40:13-20 (https://doi.org/10.4312/dp.40.2); Vybornov, A. 2016, Documenta Praehistorica 43:161-166 (https://doi.org/10.4312/dp.43.7); Vybornov, A. et al. 2017, Documenta Praehistorica 44:224-239 (https://doi.org/10.4312/dp.44.14); Vybornov, A.A. et al. 2022, Vestnik VolGU ser. 4, 27(3):6-15 (https://doi.org/10.15688/jvolsu4.2022.3.1; Lower Volga and North Caspian sites, placed from Grechkina et al. 2014 https://snv63.ru/2309-4370/article/download/22443/18625, Vybornov et al. 2022 https://snv63.ru/2309-4370/article/download/133233/111035, Burataev 2014 https://kigiran.elpub.ru/jour/article/download/1037/2075 and Vybornov 2016 Fig. 1); Card, N. et al. 2018, European Journal of Archaeology 21(2):217-263 (https://doi.org/10.1017/eaa.2016.29; Ness of Brodgar); Cassidy, L.M. et al. 2020, Nature 582:384-388 (https://doi.org/10.1038/s41586-020-2378-6; the two directly dated Newgrange burials, as listed in AADR v66.p1); Meadows, J. et al. 2015, Samara Journal of Science 4(3):113-121 (https://doi.org/10.17816/snv20153210; Zamostje 2 food-crust, fibre and wood dates, placed from Dolbunova et al. 2023 SI_ORA); Nikitin et al. 2025 (AADR 'NikitinReichNature2025'), Nature (https://doi.org/10.1038/s41586-024-08372-2; the directly dated Mariupol' burial, as listed in AADR v66.p1); Firew, G.A. 2014, PhD thesis, University of Bergen (https://hdl.handle.net/1956/8931; Kurtiye rock shelter, Lake Tana, section 5.1). Each row gives its paper, page and table row."
licence = "Facts from the cited papers; the transcription is the project's own."
note = "Only Zaitseva et al. print coordinates (to 1 arcminute). Every other row is placed from the paper's map, text or locality, or from Dolbunova et al. 2023 SI_ORA, and is marked approximate with how and to what precision. Dates the authors reject are left out, as are rows without a lab number and lab numbers printed for two different dates or sites."

# Names, Wikipedia links and cultures for sites that Wikidata classes as an
# archaeological site and that have an English Wikipedia article. Items with
# an inception date in [time] start..end that match no dated site are added.
#
# The query service answered this client with 429 and a 1000 s Retry-After
# while `contact` was empty (2026-11-11). Wikimedia's User-Agent policy asks
# automated clients to give contact details; `contact` is sent in the
# User-Agent header. If it is emptied, set enabled = false.
[settlements.wikidata]
enabled = true
contact = "https://github.com/jtwaugh/neolith"
url = "https://query.wikidata.org/sparql"
tile_degrees = 10.0
match_km = 5.0
# An unmatched item is not added as a site of its own when a site sharing its
# name lies within this distance (the same place, recorded a little apart).
add_km = 10.0
# Items never added as sites: modern places whose inception Wikidata gives as
# the founding of an older site nearby. Q5687 is the modern city of Jericho
# (inception -9600, from Tell es-Sultan, which is matched to Q6585622);
# Q60305 is the Tower of Jericho, a structure on that same tell.
skip = ["Q5687", "Q60305"]

