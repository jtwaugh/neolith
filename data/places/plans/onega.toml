reasoning = "The lake has been free of ice since before the window (Rybalko et al. 2022). The nearest dated pioneers are earlier than any Onega date: the Veretye sites at Lake Lacha, 150 km east (Peschanitsa 9890±120 BP, 9500-9010 cal BC; Lower Veretye from 9600±80 BP, 8954-8602 cal BC), and the Antrea net on the Karelian Isthmus at 8560-8240 cal BC (Zaitseva et al. 2000; Seitsonen et al. 2012). The oldest Onega dates (Besov Nos 6, 8340 BP, about 7,400 BCE; Oleni Ostrov GIN-4836, 9910±80 BP, but bone with a freshwater reservoir offset) come from shore sites already in use. A cemetery of more than 170 burials by 6,300 BCE implies a population that was there well before. At -9000 the north basin was near the retreating ice margin, so confidence there is lower than at -8000."
basis = ["neighbouring_evidence", "literature", "environment"]

