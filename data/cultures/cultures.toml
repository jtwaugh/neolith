# ------------------------------------------------------------------ vocab
# What `make cultures-check` looks for in an article's text to count a trait
# as supported (regular expressions, lower case). A value not listed here is
# supported when every word of five letters or more appears in the article.
[vocab.economy]
foraging = 'hunt|gather|forag|fishing|fisher'
farming = 'agricultur|farm|cultivat|domesticat|cereal|crop'
herding = 'pastoral|herd|herder|livestock|cattle'
mixed = '(?s)(?=.*(hunt|forag|fish))(?=.*(domestic|agricultur|farm|herd|livestock))'

[vocab.pottery]
none = 'pre-?pottery|aceramic|without pottery|no pottery|before pottery'
yes = 'pottery|ceramic'
painted = 'painted'
incised = 'incis'
impressed = 'impress'

[vocab.houses]
longhouse = 'long ?house'
rectangular = 'rectangular'
round = '\bround|circular'
mudbrick = 'mud ?-?brick|adobe'
"pile dwelling" = '\bpiles?\b|stilt|lake[- ]?dwell|pile[- ]dwell|lakeside|lake shore|wetland'
tell = '\btells?\b'
"large settlement" = 'mega-?site|large settlement|town|proto-?cit|\bcit(y|ies)\b|urban'

[vocab.burial]
cemetery = 'cemeter|burial ground|burial place|burial site|grave ?field|necropol'
intramural = 'under (the )?(house )?floors?|beneath (the )?(house )?floors?|below (the )?floors?|intramural|within (the )?(houses|settlement)'
"skull removal" = 'skull|crani'
"megalithic tomb" = 'megalith|dolmen|passage grave|passage tomb|gallery grave|chambered'
barrow = 'barrow|tumul'
kurgan = 'kurgan'
collective = 'collective'
individual = 'individual|single grave|single burial'

[vocab.monuments]
enclosure = 'enclosure|ditch'
roundel = 'rondel|roundel|circular enclosure|circular ditch'
megaliths = 'megalith|menhir|dolmen|standing stone'
temple = 'temple|shrine|sanctuar'
tower = '\btower'

[vocab.metal]
copper = 'copper'
gold = '\bgold'
bronze = 'bronze'
iron = '\biron\b'

[vocab.domesticates]
wheat = 'wheat|emmer|einkorn'
barley = 'barley'
cattle = 'cattle|\bcows?\b|bovine|\boxen\b'
"sheep/goat" = 'sheep|goats?\b|caprine|ovicaprid'
pig = '\bpigs?\b|swine'
dog = '\bdogs?\b'
horse = '\bhorses?\b'

[vocab.other]
microliths = 'microlith'
"wild cereal harvesting" = 'wild (cereal|grain|wheat|barley|grass)|harvest'
sedentism = 'sedentar|sedentism|permanent settlement'
figurines = 'figurin'
irrigation = 'irrigat'
writing = 'writing|script|cuneiform|tablet'
granaries = 'granar|silo|storage pit'
"tooth avulsion" = 'avulsion|tooth|teeth|incisor'
"shell middens" = 'midden|escargot'
"land snails" = 'snail|escargot'
"plastered floors" = 'plaster'
"ostrich eggshell" = 'ostrich'
fishing = 'fish'
"cave art" = 'cave art|cave painting|parietal|rock art'
reindeer = 'reindeer'
"painted pebbles" = 'pebble'
"house burning" = 'burn'
"wheeled vehicles" = 'wheel|wagon|cart\b'
"battle axes" = 'battle[- ]?axe|axe'
archery = 'archer|wrist[- ]?guard|bracer|arrow'
"seal hunting" = '\bseals?\b'
