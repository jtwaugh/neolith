# Gap critic: cereal_pollen layer. Judgements, not data.
# Values are the expected share of pollen cores (core-slices with counted levels)
# that hold at least one Cerealia-type grain, if cores existed in the gap.
# In SW Asia, Central Asia and the steppe this share measures wild large grasses
# (wild wheat, barley, rye, Aegilops, Elymus/Leymus) as much as farming.

[meta]
layer = "cereal_pollen"
written = "2026-11-12"
dossier = "build/isostyle/gaps/cereal_pollen/dossier.json"
summary = """The cereal-pollen gaps follow where lake and bog cores were taken and put into Neotoma/EPD, not where people farmed: coverage is near-total in Europe and 0-13% across Africa, Arabia, Central Asia, Iran and Mesopotamia. Read outside Europe, the layer is mostly a wild-grass signal. Cores in the Zagros, Levant, Anatolia and Central Asia show Cerealia-type grains in 60-100% of core-slices at 10,000 BCE, long before farming. Cores in northern Russia and Finland show it in only 0-5%. African cores show it in none, because the African Pollen Database does not split Cerealia-type from other Poaceae. \
Two features are method artefacts. (1) Most edge values in Africa and the Horn (0.05-0.15) come from shrinkage, not data. A cell just above the mask threshold with only absent cores gets f = f0/(E+1), about 0.45 times the slice mean. These edges therefore rise from 0.058 to 0.145 between 9,000 and 3,000 BCE only because European farming lifts the global f0. They should not be read as an African trend. (2) The high edge values around Arabia, Libya-Egypt and the central Iranian plateau (0.5-0.75) leak in from Levantine, Nile Delta and Zagros cores, where they reflect wild cereals and steppe grasses. They should not be stretched across deserts that have no lakes."""

# ---------------------------------------------------------------- Africa

[[judgement]]
region = "Sahara–Sahel"
slices = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]
gap_ids = ["cereal_pollen-10000-01", "cereal_pollen-9000-20", "cereal_pollen-8000-40", "cereal_pollen-7000-60", "cereal_pollen-6000-80", "cereal_pollen-5000-99", "cereal_pollen-4000-117", "cereal_pollen-3000-134"]
why_empty = ["research_intensity", "preservation", "recording_practice", "true_absence"]
why_note = "Few lakes held water after the African Humid Period, and dry lake beds deflate or oxidise. The handful of Saharan and Sahelian records that exist (Chad, Yoa, Tibesti, Oursi) are counted in an African pollen taxonomy that does not separate Cerealia-type. Neither wheat nor barley was grown here, and pearl millet was domesticated only after c. 2500 BCE."
expected = 0.02
expected_range = [0.0, 0.1]
confidence = "medium"
basis = ["dossier_statistics", "literature", "environment", "other_layer"]
reasoning = "Every Saharan core in core_units records 0 Cerealia across all eight slices (1-5 cores per slice). The edges (0.056-0.145) are the shrinkage term, not cores with cereal pollen. Pottery, ground stone and later livestock inside the gap show people were there, but they were wild-grass gatherers and cattle herders. Large wild grasses such as Echinochloa, Panicum and wild Sorghum might occasionally pass a European size threshold. A few percent is the most that could be expected even if analysts applied European keys."
literature = [
  { cite = "Manning et al. 2011, '4500-year old domesticated pearl millet (Pennisetum glaucum) from the Tilemsi Valley, Mali', Antiquity 85", checked = false },
  { cite = "Lézine et al. 2011, 'Sahara and Sahel vulnerability to climate changes, lessons from Holocene hydrological data', QSR 30", checked = false },
  { cite = "Vincens et al. 2007, African Pollen Database taxonomy (Poaceae not split by size)", checked = false },
]
would_settle = "Size-measured Poaceae pollen from a Sahelian lake such as Lake Chad, Bal or Tichitt, which would also tell wild from domestic Pennisetum. Ingesting the African Pollen Database's own taxa list would show whether any core separates large grasses at all."
speculative_rule = "Fill at 0.02 in every slice and ignore the shrinkage edges. If the game wants a domestication marker, add a separate 'millet' flag in the western Sahel from 2,500 BCE instead of raising this layer."

