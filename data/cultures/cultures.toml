# Archaeological cultures and stages, matched to the period labels on
# radiocarbon dates. Read by `make settlements`; checked against the cited
# Wikipedia articles by `make cultures-check`.
#
# Each entry:
#   id, name      identifier used in settlements.geojson, and display name
#   key           (optional) words the cited article must contain to count as
#                 being about this entry; default: the name without (...)
#   stage         (cultures only) the stage it belongs to
#   wikipedia     English Wikipedia title the traits are cited to
#   start, end    (optional) the culture's date range in signed years
#                 (negative = BCE), from the cited article; `quotes` holds
#                 the article's own words for it, checked to still be there
#   match         regular expression searched in each normalised label
#                 (lower case, accents folded, punctuation as spaces)
#   traits        economy, pottery, houses, burial, monuments, metal,
#                 domesticates, other. A trait that is absent means
#                 "not recorded here", not "absent in the culture".
#
# A label that matches two cultures (e.g. "Horgen/Schnurkeramik"), or no
# culture and two stages, is ignored as ambiguous. A culture match beats a
# stage match. Many sources label every date at a site with all of the
# site's periods, so a date counts toward a culture only if it also falls
# within the culture's start..end, widened by `range_margin` years (set in
# pipeline/config.toml). A culture without a range counts only on dates
# no other culture's label competes for, and for those the missing ends of
# the range are taken from the dates themselves (reported as "observed").
# Stage labels count only where their range fits, too; a stage and its
# `parent` together count as the parent.
#
# Traits are short summaries written for this project, cited to an article
# revision; `make cultures-check` lists any trait the article doesn't
# mention, and cultures.json carries that list as `unverified`.

# Labels never matched: transitions, phases and mixed attributions.
ignore = [
  '\b(ubergang|transition|transi|or|und|bis|nicht gesichert|terminus|expected|expeced|analogie|einfluss|elemente|einflussen|beginn|ende|zuweisung)\b',
  '^(meso neo|meso neolithikum|lmen|lneba|sn ii|sn i|antic|mig|mig final|spate|fruhe|jungere|jungeres|alteres|mittlere|early|late|middle|final|unspec|abt|tcz|tci|nmb|nfv|nav|ia|em|eb|c|b|a|v|i|ii|iii|vi|1a)$',
]

# ------------------------------------------------------------------ stages
[[stage]]
id = "palaeolithic"
key = "paleolithic"
name = "Palaeolithic (Lower and Middle)"
wikipedia = "Paleolithic"
match = '^(pal(a)?eolithic|middle pal(a)?eolithic|lower pal(a)?eolithic|pleistocene)$|\b(mousterian|micoquian)\b'
traits = { economy = "foraging" }

[[stage]]
id = "upper_palaeolithic"
key = "upper paleolithic"
name = "Upper Palaeolithic"
wikipedia = "Upper Paleolithic"
start = -48050
end = -10050
quotes = ["between 50,000 and 12,000 years ago"]
match = '\b(upper|middle upper|late) pal(a)?eolithic\b|paleolithique superieur|^up$|\b(aurignacian|gravettian|gravettien|solutrean|badegoulian|chatelperronian|uluzzian|ahmarian|gorodtsovian|streletskayan|masraqan|nizzanan|protomagdalenian)\b'
traits = { economy = "foraging" }

[[stage]]
id = "epipalaeolithic"
name = "Epipalaeolithic"
wikipedia = "Epipalaeolithic"
start = -18050
end = -3050
quotes = ["20,000 bp to 10,000 bp in the levant, but later in europe", "5,000 bp or even later"]
match = '\bepi ?pal(a)?(e)?olithi|\bepipaleolithique\b|^ep$|\b(mushabian|harifian|microlaminar|laborien|laborian|epilaborian)\b'
traits = { economy = "foraging" }

[[stage]]
id = "mesolithic"
name = "Mesolithic"
wikipedia = "Mesolithic"
start = -13050
end = -3050
quotes = ["15,000 to 5,000 bp"]
match = '\bmesolithi|\bmesolithikum\b|^(um|lm|mm)$|\blate meso$|muescas y denticulados|fase geometrica|meso recent|castelnov'
traits = { economy = "foraging" }

[[stage]]
id = "aceramic_neolithic"
key = "pre pottery neolithic"
name = "Aceramic Neolithic"
wikipedia = "Pre-Pottery Neolithic"
start = -10000
end = -6500
quotes = ["(10000 – 6500 bce)"]
parent = "neolithic"
match = '^(acn|ppn|aceramic|aceramique|pre pottery)$'
traits = { economy = "farming", pottery = "none" }

[[stage]]
id = "neolithic"
name = "Neolithic"
wikipedia = "Neolithic"
start = -10000
end = -2000
quotes = ["10,000 bc to c", "2,000 bc)"]
match = '\bneolith|^(en|mn|ln|fn|un|emn|neo|pn|na nm|neo moyen i|mln|minl|jungnl)$|earlyneolithic|middleneolithic|lateneolithic|fruhneolithikum|mittelneolithikum|spatneolithikum|^(en|mn|ln|fn) [iv]+\b|hazendonk|schussenried|peu richard|matignons|fiorano|epicardial'
traits = { economy = "farming" }

[[stage]]
id = "chalcolithic"
name = "Chalcolithic (Copper Age)"
wikipedia = "Chalcolithic"
start = -6500
end = -2200
quotes = ["6,500 bc", "2,500 and 2,200 bc"]
match = 'chalcolithic|^chalc$|^ch$|copper age|calcolitic|eneolithic|^e ch$|^l ?ch$|^cham$|ferrieres|treilles|fontbouisse'
traits = { economy = "farming", metal = ["copper"] }

[[stage]]
id = "bronze_age"
name = "Bronze Age"
wikipedia = "Bronze Age"
match = '\bbronze\b|bronzezeit|^(eba|mba|lba|uba|br|bz|fbz)$|\b(helladic|minoan|cycladic)\b|nordic ba\b|^periode [iv]+'
traits = { economy = "farming", metal = ["bronze"] }

[[stage]]
id = "iron_age"
name = "Iron Age"
wikipedia = "Iron Age"
match = 'iron age|age du fer|eisenzeit|\bferro\b|la tene|vorromische'
traits = { economy = "farming", metal = ["iron"] }

