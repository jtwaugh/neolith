# Gap critic: cereals layer (charred wheat, barley or rye grain). Judgements, not data.
# Values are the expected share of sampled occupations (phases with plant remains) that
# would show wheat or barley if the gap had evidence. Pearl millet and sorghum are outside
# the layer's definition, so Africa south of the Nile valley and Maghreb coast reads 0.

[meta]
layer = "cereals"
written = "2026-11-12"
dossier = "build/isostyle/gaps/cereals/dossier.json"
summary = """The cereal surface is almost all mask: no region has more than 49% of its land evidenced in any slice, and most have 0%. Two things drive that. First, the record: 680 units with known status, 654 of them presences, mostly directly dated grain in XRONOS plus the Arranz-Otaegui & Roe SW Asian flora; Africa south of the Mediterranean, Arabia, Central Asia, the Caucasus, the Russian plain and the Baltic have essentially no sampled phases. Second, and more important, the method: cross-validation picked sigma = 50 km, the smallest width tried, on a nearly flat curve (log loss 0.1282 at 50 km against 0.1295 at 100 km), and the mask needs E >= 1.2 within that width, so even Linearbandkeramik central Europe is only 17% evidenced at 5,000 BCE and the Levant only 15-30%. The European and SW Asian gaps after farming arrives (Central Europe, France, Balkans, Italy, Iberia, Anatolia, Levant, Mesopotamia, Zagros) are kernel artefacts, not missing archaeology; a speculative layer should fill them from the edge values (0.92-0.99). \
Two data artefacts deserve fixing upstream. (1) The SW Asian flora rule has no minimum sample: 28 of 240 phases lack cereals and most of them list only 1-5 taxa (Ain Ghazal M/L-PPNB is recorded from a single flax entry, Ayn Abu Nakhayla, Nemrik 9 and Umbashi from one taxon each, Basta's PN phase from three), so several of the 26 'absences' are just thin taxon lists; a rule like livestock's (minimum count or taxa) would remove them. (2) EUROEVOL archaeobotany has 398 phases but only 6 units carry it as their source; many may have been merged into XRONOS episodes, but if they were dropped by the phase-dating rule that explains much of the European thinness. \
The genuine absences are the forager worlds: everything north and east of the farming frontier until it moves (Ertebolle Denmark is the only well-recorded block of absences), the whole Russian plain, and all of Africa beyond the Nile and the Maghreb coast, where wheat and barley never became staples in this period."""

