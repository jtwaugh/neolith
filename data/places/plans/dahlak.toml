target = "settlements"
slices = [-6000, -5000, -4000, -3000]
rule = "Place inferred shell-midden fisher-forager camps on the shore of that epoch: on the Dahlak islands where the board shows them, otherwise on the mainland coast from Massawa to the Buri peninsula and around the Gulf of Zula. Prefer shallow bays, mangrove inlets and headlands. Use about one per 30 km of shore, marked as inferred. Put one or two more on hilltops up to 15 km inland on the Buri peninsula, the Gelalo NW pattern."
confidence = "medium"
reasoning = "Presence is well argued, but the density is a guess. The Farasan islands, the twin salt-dome archipelago 200 km east, carry about 3,000 ground-checked and dated shell middens of mainly 8000-4500 cal BP. The Dahlak islands have about 1,200 remote-sensed mounds with the same spectral signature, on the same +2 m palaeoshorelines, some tall enough to cast shadows (Meredith-Williams et al. 2014). The islands are easier to reach: at most 10 km of open water to a midway island, with each step visible. The mainland coast at the box's south edge has dated middens of 8500-5500 cal BP (Beyin & Bar-Yosef Mayer 2018), and Dahlak Kebir has LSA obsidian microliths and undated middens (Blanc 1952, after Zazzaro 2013). The spacing is set denser than on the Yemeni mainland shore (bab_el_mandeb plan, one per 50 km) because this is the most midden-dense kind of coast in the Red Sea; low confidence in the number."
basis = ["analogy", "neighbouring_evidence", "literature"]

