why_empty = ["research_intensity", "preservation", "recording_practice", "true_absence"]
why_note = "Few lakes held water after the African Humid Period, and dry lake beds deflate or oxidise. The handful of Saharan and Sahelian records that exist (Chad, Yoa, Tibesti, Oursi) are counted in an African pollen taxonomy that does not separate Cerealia-type. Neither wheat nor barley was grown here, and pearl millet was domesticated only after c. 2500 BCE."
expected = 0.02
expected_range = [0.0, 0.1]
confidence = "medium"
basis = ["dossier_statistics", "literature", "environment", "other_layer"]
reasoning = "Every Saharan core in core_units records 0 Cerealia across all eight slices (1-5 cores per slice). The edges (0.056-0.145) are the shrinkage term, not cores with cereal pollen. Pottery, ground stone and later livestock inside the gap show people were there, but they were wild-grass gatherers and cattle herders. Large wild grasses such as Echinochloa, Panicum and wild Sorghum might occasionally pass a European size threshold. A few percent is the most that could be expected even if analysts applied European keys."
literature = [
  { cite = "Manning, Pelling, Higham, Schwenniger & Fuller 2011, '4500-Year old domesticated pearl millet (Pennisetum glaucum) from the Tilemsi Valley, Mali: new insights into an alternative cereal domestication pathway', Journal of Archaeological Science 38, 312-322", checked = false, note = "Was cited as Antiquity 85; corrected to JAS 38 from Crossref (doi:10.1016/j.jas.2010.09.007). ScienceDirect blocks automated fetching and OpenAlex/Crossref carry no abstract, so the c. 2500 BCE date was not read from the source." },
