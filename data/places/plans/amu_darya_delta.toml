what = "Find and digitise the Kel'teminar site catalogues and their maps: Vinogradov's monographs on the Neolithic of Khorezm (1968) and on the hunters and fishers of the Central Asian interfluve (1981), and Tolstov 1948. Titles and years are from memory and unverified; confirming them is step one. Vinogradov 1957 (open PDF) is a way in."
