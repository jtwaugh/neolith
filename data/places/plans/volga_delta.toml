reasoning = "The board itself puts a 300-km river plain here for three millennia. Bezrodnykh & Sorokin (2016) describe the Mangyshlak deposits as freshwater basins in valleys and depressions, comparable to the ilmen lakes of the modern delta: the richest fishing ground in the region. Fisher-hunters with heavy fishing gear were on the Lower Don at Razdorskaya II from c. 7,450 BCE and at Rakushechny Yar from c. 7,000 BCE (Tsybrij et al. 2017). People were at Varfolomeevka on the Maly Uzen by the 7th millennium BC, and at Kairshak and Baibek on the edge of this plain by 6,000 BCE. A people that fished the Don and the Uzen will have fished the Mangyshlak Volga. Confidence is low for two reasons. Nothing has been found on the plain because it is under the sea. And if the regression ended at 10.5 ka (Sorokin et al. 2021), the plain was gone by about 8,000 BCE, so the 7,000 and 6,000 BCE slices depend on the board's lake curve being right."
basis = ["analogy", "neighbouring_evidence", "environment"]

