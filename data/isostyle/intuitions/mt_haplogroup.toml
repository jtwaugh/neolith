# Gap critic: mt haplogroup set (mt_u5, mt_u4, mt_h, mt_k, mt_j, mt_t2, mt_n1a, mt_other). Judgements, not data.
# `expected` maps clade layer id -> expected share of genomes in the gap if it had been sampled.
# mt_other carries U2 and X (folded in by the build), U6, M1, L*, N1b, R0a, W, HV, I, C/D/Z and the rest:
# in Africa and South Asia it is nearly everything. Gap ids are those of the mt_u5 dossier;
# every mt clade dossier has the same regions.

[meta]
layer = "mt haplogroup"
written = "2026-11-12"
dossier = "build/isostyle/gaps/mt_u5/dossier.json"
summary = "The mt surfaces use a 300 km kernel (against 100 km for Y), so they cover far more land than the genomes behind them and their gaps are fewer (173). The expected pattern: European hunter-gatherers were U5 (U5b in the west, U5a in the east) with U4 and U2e (in 'other') rising eastwards into the EHG and SHG; Anatolian farmers brought K1, N1a, J, T2, H, X2, W and HV, and European farmer gene pools are a mix of these with H rising after 5,000 BCE; CHG and Iranian farmers were H13, K3, U1, X, T and J; Levantine Natufians and PPNB farmers were N1b, J, K, T, R0a; North Africans were U6 and M1 (Iberomaurusian), with K1, T2, J, X and H arriving from the Levant and Iberia after 5,500 BCE; and steppe Yamnaya were a mix of EHG U5a/U4/U2e and CHG-related H, T2, W, I, J. NO mt data exist for Sudan, the Sahara-Sahel, West Africa, the Horn, Arabia before 3,000 BCE, Afghanistan, Baluchistan or interior Algeria; any value there is extrapolation. Method artefacts of the wide kernel: the Maghreb at 7,000 BCE reads U5 0.82 and Libya & Egypt / Arabia read Levantine shares at 8,000-7,000 BCE purely by bleed from Iberia and the Levant; these should not be extended. Early-slice H spikes (Russia steppe 0.34, Ukraine 0.35 at 10,000 BCE) rest on one or two individuals."

[[judgement]]
region = "France & Low Countries"
slices = [-10000, -9000, -8000, -7000]
gap_ids = ["mt_u5-10000-19", "mt_u5-9000-45", "mt_u5-8000-76", "mt_u5-7000-106"]
why_empty = ["research_intensity", "sampling_bias"]
why_note = "Sampling: few Mesolithic burials sequenced (Téviec and Hoedic are late)."
expected = { mt_u5 = 0.75, mt_u4 = 0.03, mt_h = 0.04, mt_other = 0.15 }
confidence = "high"
basis = ["literature", "neighbouring_evidence", "dossier_statistics"]
reasoning = "Western hunter-gatherers are about three-quarters U5b with U2, U4 and U5a (mostly in 'other' and U4); evidenced cells read U5 0.67-0.82. Gaps of 25-247 cells lie 463-539 km from genomes."
literature = [
  { cite = "Posth et al. 2023, Nature", checked = false },
  { cite = "Bramanti et al. 2009, 'Genetic discontinuity between local hunter-gatherers and central Europe's first farmers', Science", checked = false },
]
would_settle = "Mesolithic genomes from northern France and Belgium."
speculative_rule = "Set U5 0.75, other 0.15 across the region until farming arrives."

