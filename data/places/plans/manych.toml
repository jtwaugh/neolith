[meta]
place = "manych"
written = "2026-11-12"
verdict = "research"
confidence = "medium"
really_empty = "Yes in our data: no site in the proposed box (41.0-46.0 E, 45.3-47.0 N, 54-59 land hexes) in any epoch. Within 100 km are Zolotovka (9,060 BCE, 70 km), Razdorskoe I (91 km) and 'Unterpullendorf' (56 km). The last is an Austrian Lengyel site misfiled about 25 degrees east, so it should be discounted. The nearest real Neolithic sites are on the Lower Don and in Kalmykia (Dzangar, 105 km). But AADR holds ten directly dated burial localities inside the box, all kurgan burials of 4,350-2,900 BCE (Eneolithic, Steppe Maykop, early Yamnaya), and none of them is in our settlements. For 10,000-4,500 BCE I found no named, dated site in the box."
why_empty = ["not_in_open_compilations", "research_intensity", "sampling_bias", "low_population"]
summary = """
The Kuma-Manych depression: the low trough between the Lower Don and the
Caspian lowland that separates the Russian Plain from Ciscaucasia. It is now
a chain of salt lakes and reservoirs (Manych-Gudilo, Proletarsk). It
carried Caspian overflow to the Black Sea in the Late Pleistocene, but that
'Manych strait' is older than our period. Lavrentyev (2022) dates the
early Khvalynian strait by OSL to 17.7-14.9 ka and says that after the
flooding it 'ceased to exist'. The board agrees: the Caspian's computed
outlet here is +18 m, and its level never comes near that after 10,000 BCE.
So in our window this is a dry steppe isthmus with saline lakes. The board
draws it as uniform grassland, with no lakes and no Manych, Kalaus or
Yegorlyk rivers.

It is empty in our data for two reasons. The later prehistory is known
almost only from kurgans, which are dated through aDNA projects; AADR has ten
such localities here (4,350-2,900 BCE), but AADR is used only as an isostyle
layer, not as a settlement source. The earlier prehistory is thin in the
literature as well: Lavrentyev (2022) says only 'few Mesolithic sites were
known' in the Manych valley before the end of the twentieth century, and
names none. The nearest dated Neolithic is on the Lower Don (Tsybrij et al.
2017) and at Dzhangar in Kalmykia. The steppe-valley sites of Rostov oblast
(Kremennaya, Rassypnaya), which Tsybrij et al. group with the Caspian and
Ciscaucasian region, are dated 7th-5th millennium BC and lie, as far as I can place them (Kremennaya in the Milyutinsky district), some 150-200 km to
the north. A dry, saline isthmus probably did hold fewer people than
the river valleys on either side, so low population is a real but minor part
of the answer. Research intensity and the kurgan bias are the major part.

Do this: (1) ingest the AADR burial localities (ten in the box); (2) find
the Mesolithic and Neolithic survey of the Manych valley, which is the work
of the Rostov and Kalmyk institutes; (3) until then, put a thin scatter of
inferred camps on the lake shores. Also on the board: there are no Manych
lakes. They are small at hex scale, but the Manych-Gudilo chain is about
100 km long.
"""

