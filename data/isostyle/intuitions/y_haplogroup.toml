# Gap critic: Y haplogroup set (y_i2, y_g2a, y_r1b, y_r1a, y_c, y_j2, y_h2, y_other). Judgements, not data.
# `expected` maps clade layer id -> expected share of male genomes in the gap if it had been sampled.
# Shares need not sum to 1; the remainder is spread across the listed clades' uncertainty.
# y_other carries E1b1b, E1b1a, J1, T1a, L, Q1a, R2, N, G2b, A/B and everything else, so in Africa,
# Arabia and South Asia it is most of the expectation. Gap ids are those of the y_i2 dossier;
# every Y clade dossier has the same regions and gaps.

[meta]
layer = "Y haplogroup"
written = "2026-11-12"
dossier = "build/isostyle/gaps/y_i2/dossier.json"
summary = "The Y gaps are the ancient-genome gaps, thinned further because only males count (722 male genomes at 3,000 BCE against 1,242 genomes). The expected pattern follows the published history: Western hunter-gatherers were overwhelmingly I2 with C1a2 and Villabruna-type R1b (L754/V88) as minorities, the Iron Gates carried much R1b-V88, and Eastern hunter-gatherers carried R1a, R1b and J1/Q1a; Anatolian-derived farmers brought G2a with H2, C1a2, J2a and T1a, then Middle Neolithic Europe saw I2 resurge through hunter-gatherer admixture (Britain, Iberia, France); CHG and Iranian farmers were J2 and G2b/R2-rich; the Levant was E1b1b, H2 and T; North Africa was E1b1b (M78, M81) with Levantine and Iberian-Neolithic inputs (G2a, T1a) after 5,500 BCE; and steppe R1b-Z2103 (Yamnaya) and R1a-M417 (Corded Ware) reach Central and Western Europe only after c. 2900 BCE, so the 3,000 BCE slice (3,500-2,500 BCE) should show at most a few percent R1a/R1b west of the Vistula. Whole regions have NO Y data at all and the expectation is extrapolation: Arabia, Libya & Egypt, Nile & Sudan, the Sahara-Sahel, West Africa, the Horn, interior Algeria, Afghanistan and Baluchistan. Method artefacts: with sigma 100 km and a few samples, single individuals dominate whole regions, e.g. J2 = 0.60 in the Russian steppe at 8,000 BCE is Caucasus (Kotias) bleed into the North Caucasus cells, C = 0.39 in Iberia at 6,000 BCE is La Braña alone, R1b = 0.22 in Anatolia at 5,000 BCE rests on a handful of samples, and R1b = 0.34 in the Balkans at 3,000 BCE is Bulgarian Yamnaya at the late edge of the slice. Shares in thinly sampled slices should be treated as anecdotes."

[[judgement]]
region = "France & Low Countries"
slices = [-10000, -9000, -8000, -7000, -6000]
gap_ids = ["y_i2-9000-45", "y_i2-10000-16", "y_i2-8000-73", "y_i2-7000-104", "y_i2-6000-132"]
why_empty = ["research_intensity", "sampling_bias"]
why_note = "Sampling: few Mesolithic burials sequenced; bone survives in Meuse and Jura caves."
expected = { y_i2 = 0.75, y_c = 0.08, y_r1b = 0.05, y_other = 0.1 }
confidence = "medium"
basis = ["literature", "neighbouring_evidence", "dossier_statistics"]
reasoning = "Western hunter-gatherer males from Loschbour, Bichon, Rochedane, Ranchot and the Breton middens are almost all I2a, with rare C1a2 and Villabruna-type R1b-L754. Evidenced cells give I2 0.56-0.66 at 8,000 and 6,000 BCE, with C 0.32-0.39 in slices resting on one or two men. Gaps of 300-372 cells lie 169-543 km from genomes."
literature = [
  { cite = "Posth et al. 2023, 'Palaeogenomics of Upper Palaeolithic to Neolithic European hunter-gatherers', Nature 615", checked = true, url = "https://doi.org/10.1038/s41586-023-05726-0", read = "AADR annotation + abstract", note = "AADR: French Mesolithic men in this paper are I2/I2a1; Bichon and Loschbour themselves are from Jones et al. 2015 and Lazaridis et al. 2014, and the C1a2/R1b calls in Posth are Palaeolithic." },
  { cite = "Rivollat et al. 2020, 'Ancient genome-wide DNA from France highlights the complexity of interactions between Mesolithic hunter-gatherers and Neolithic farmers', Sci. Adv. 6", checked = false, url = "https://doi.org/10.1126/sciadv.aaz5344", note = "Does not support a Mesolithic I2a claim: its three Mesolithic genomes are German (Bad Dürrenberg, Bottendorf) with no I2 man; its French I2a men are Early/Middle Neolithic farmers." },
]
would_settle = "More Mesolithic males from the Paris Basin, Belgium and Doggerland's edges."
speculative_rule = "Set I2 0.75, C 0.08, R1b 0.05 across France and the Low Countries until farmers arrive (5,700 BCE in the south, 5,300 BCE in the north-east)."

