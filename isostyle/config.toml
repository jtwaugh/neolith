# Isostyle surfaces on the game's hex grid. Paths are relative to the repo
# root. Years are signed (negative = BCE). The Phase 1 audit keeps its own
# config, isostyle/audit.toml (50 km equal-area grid, 250-year slices).

[grid]
# The hex-map pipeline's output: hexagons in lon/lat with id and bbox
# properties, and a year-keyed `terrain` (Water and Ice are used here).
file = "build/combined_map.geojson"

[region]
# Dates outside this box are not read. It is the grid's extent.
lon_min = -17.0
lon_max = 66.5
lat_min = 5.5
lat_max = 76.5

[time]
# The map keyframes. Each slice covers its year ± half the spacing.
slices = [-10000, -9000, -8000, -7000, -6000, -5000, -4000, -3000]

[dates]
raw_dir = "build/settlements"
pipeline_config = "pipeline/config.toml"
curve = "build/settlements/intcal20.14c"
same_km = 1.0
same_name_km = 10.0
# Occupation episodes: a site's dates are chained while their 95% calibrated
# ranges overlap or lie within this many years of each other.
episode_gap = 200
# A culture label counts for an episode only if the episode's median falls
# inside the culture's range in data/cultures/cultures.toml, widened by this.
range_margin = 200
# Site types counted as graves (flagged, not dropped).
grave_types = ["grave", "burial", "tomb", "tumulus", "barrow", "dolmen", "megalith", "cairn",
               "cist", "funerary", "cemetery", "necropolis", "hypogeum"]

[presence]
# The layer registry (what each surface is); occupation layers' direct-evidence
# rules (dated sample material, site type) live there too.
layers = "data/isostyle/layers.toml"
cultures = "data/cultures/cultures.toml"
rules = "data/isostyle/label_presence.toml"
# A dataset record within this distance of a dated site, overlapping one of
# its episodes in time, marks that episode instead of adding a new one.
match_km = 2.0
# Hand-extracted tables kept in the repo: reader function -> path.
inputs = { jordan2016 = "data/isostyle/inputs/jordan2016_africa.csv" }

[surface]
# Candidate kernel widths (km) for leave-one-site-out cross-validation.
sigma_km = [50, 75, 100, 150, 200, 300]
cutoff = 2.5          # R = cutoff * sigma
alpha = 1.0           # shrinkage toward the slice mean
# Mask below this evidence: two well-dated sites one sigma away, 2*exp(-1/2).
e_min = 1.2
levels = [0.25, 0.5, 0.75]
bootstrap = 200
seed = 20261112
# Bone and antler: cells whose topsoil pH (SoilGrids 0-30 cm mean) is below
# this are masked. Kendall et al. 2018 put the onset of bone mineral
# dissolution at pH 6.0; 5.5 is the "strongly acid" class boundary.
bone_ph_min = 5.5

[speculative]
# Fill smoothing, chosen by `python -m isostyle evals --search` (the smoothest
# grid point that passes every guard; data/isostyle/evals/search.json).
blend_rings = 12     # hex rings over which judged values lean toward nearby observed ones
time_smooth = 0.4    # share of the way a speculative cell moves toward its neighbours in time
smooth_iters = 16    # neighbour-averaging passes over speculative cells (observed cells fixed)
smooth_rate = 0.5
bridge = 0.75        # a speculative cell observed in the slices before and after leans toward those two values

[output]
build_dir = "build/isostyle"
out_dir = "data/isostyle"

