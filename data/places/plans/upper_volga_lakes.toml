really_empty = "No, but thin and partly misplaced. The box (36-42.5 E, 55-58.2 N, 127 land hexes, no water in any epoch) holds six dated records, all from XRONOS via p3k14c: Ivanovskoye, Zolotoruce, Starnska Skala, Stanovoe 4, Sakhtysh 2 and Ivanovskoe 3; Podoli V (5 km W) and Berendeevo 2a (89 km N) lie just outside. Read against Zaretskaya et al. 2005, three are put in the wrong place: Ivanovskoye (37.82, 55.77; GIN-9516 = Ivanovskoe-7), Ivanovskoe 3 (38.03, 56.06) and Stanovoe 4 (37.88, 55.95; GIN-8378) all sit in Moscow's north-eastern suburbs. Ivanovskoye is the name of a district of eastern Moscow, so the records look geocoded by name. The real sites are 100-180 km further NE, near Pereslavl-Zalessky and between Yaroslavl and Ivanovo. 'Starnska Skala' (KIA-35152, citing Hartz et al. 2010) is a Stanovoje 4 date carrying a Czech site's name. 'Ivanovskoye' has a French date (OxA-19831, 14110 BP, from near Isturitz) merged into it, which gives it a false start of 15,230 BCE. The genuine Stanovoje KIA dates were merged by name into a British record at -2.65, 51.28. No site of any kind falls in the box for the 7,000 or 3,000 BCE slices. There is no Zamostje record in the box: a 'Zamostye 2' (GIN-7988, 7200 BP, citing Zaretskaya) sits at 25.43, 48.35 in Ukraine. There is nothing for Ozerki, Sakhtysh 14, Lake Nero, Lake Pleshcheyevo, the Meshchera lakes or any Lyalovo or Volosovo site."
why_empty = ["not_in_open_compilations", "publication_access", "recording_practice", "sampling_bias"]
summary = """
The Upper Volga - Oka interfluve, from Tver to Murom and from the Meshchera
to Yaroslavl, is one of the classic wetland Stone Age regions of Europe. Its
peat bogs formed over small post-glacial lakes, and they hold stratified
Butovo Mesolithic, Upper Volga Early Neolithic, Lyalovo and Volosovo layers
with wood, bark, bone and antler preserved. On our board the box is 127
boreal or temperate forest hexes with the Volga as the only river, and six
dated records, half of them misplaced (see really_empty). The residual model
expects 3 to 5 sites per epoch here and calls it 'as expected', because the
site list's own pattern has nothing better to learn from. Before 6,000 BCE
the true record is denser than ours. One paper, Zaretskaya et al. 2005,
gives about 170 radiocarbon dates from four bog sites (Ivanovskoe-7,
Stanovoe-4, Sakhtysh-14, Sakhtysh-2a), with layers from earliest Butovo
(before 10,300 BP, c. 9600 cal BC) to the Upper Volga Neolithic (7030-6500 BP).
Zamostje 2 on the Dubna has more than 100 dates (Meadows et al. 2015). Ozerki
near Tver has about 20 Mesolithic and Neolithic sites. Pesochnoe-1 on Lake
Nero has dated Lyalovo (4430-3900 cal BC) and Volosovo (3000-2840 cal BC)
layers. Almost none of this is in XRONOS or p3k14c. What did get in came
through RADON or the Vermeersch Palaeolithic list with broken names and
positions.

So the emptiness is a compilation problem, made worse by two
data-handling faults. The first is coordinates geocoded by place name in
the source. The second is that p3k14c's Vermeersch2019 rows have names
shifted to an alphabetical neighbour ('Jagerhaushohle' at Ivanovskoye's
point, 'Zolotovka' at Zolotoruce's, 'Karain B' at Karacharovo's, 'Suponevo'
at Sungir's), and our build merges records by name across thousands of
kilometres. The bog sites are a sampling bias of their own: they are where
the peat was cut and organics survive. Survey of the dry sandy terraces (the
Meshchera alone has over 150 Final Palaeolithic and Mesolithic sites, by an
abstract I could not open) yields few dates.

The user asked whether the board shows the Preboreal lakes. It does not,
and mostly it should not. The board has no lake and no water hex in the
box in any epoch, and lakes.toml has none nearer than Ladoga. The dated
palaeolakes the sites sat on were small: the Podozerskiy lake at Stanovoe-4
was 5 by 3 km, the Ivanovskoe basin two small lakes joined by a channel, and
the Sakhtysh lake 'wide'. A hex is about 1,460 km², so none of them can be a
water hex. Nor were the big basins bigger then. Lake Nero was lower than
today from about 13,000 cal BP (Wohlfarth et al. 2006), and a 2022 study
puts it 7 m below today in the Late Glacial and Early Holocene.
Pesochnoe-1's lower part is now under the lake. Borisova et al. 2022 found
no single large MIS 2 lake in the Rostov-Kostroma lowland: the lakes there
were about their modern size. What the literature does describe is lake
levels that moved: transgressions drowned Stanovoe-4 and Ivanovskoe-7 and
pushed people off them more than once in the Preboreal and Boreal. That is
a sub-hex wetland attribute, not a map of water.

The one hex-scale Preboreal lake nearby is the Mologa-Sheksna proglacial
lake, just north of the box (under today's Rybinsk Reservoir). It survived
into the early Holocene and finally drained around 10.9-10.7 cal ka BP,
about 8950-8750 BCE (search summaries of Sadokov and colleagues; the
Allerod level was 96-102 m by an EGU abstract I opened). Our ETOPO raster
has about 4,100 km² below 100 m and 5,200 km² below 105 m there, so a
lakes.toml entry would give the 10,000 BCE slice two to four water hexes.
Caution: ETOPO probably records the reservoir's surface there, not the old
valley floor. The board also lacks the Oka and every other Volga tributary.

Do this, in order. (1) Correct the three misplaced records and undo the
name merges (corrections listed in the caller reply and the research
entries below). (2) Enter the four bog sites from Zaretskaya et al. 2005,
then Zamostje 2, Ozerki and Pesochnoe-1. (3) Get the IHMC radiocarbon
catalogue of the Neolithic of northern Eurasia (Timofeev, Zaitseva et al.)
for Lyalovo and Volosovo. (4) Hand the board two items: the Mologa-Sheksna
lake at 10,000 BCE, and the Oka. A small speculative layer (wetland camps
in the lake lowlands, waterlogged organics at the bog clusters) can go
beside the record now.
"""

